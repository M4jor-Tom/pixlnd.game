id: https://w3id.org/pixlnd/save-content
name: pixlnd-save-content
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
default_range: string
classes:
  saved-rubble:
    class_uri: pixlnd:saved-rubble
    see_also: &id001
    - ../domain/encounter-contracts.md#boss-specials-and-breakable-rubble
    slots:
    - saved-rubble-broken
    - saved-rubble-restore-at
  saved-prop:
    class_uri: pixlnd:saved-prop
    see_also: &id002
    - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
    slots:
    - saved-prop-hp
  saved-trap:
    class_uri: pixlnd:saved-trap
    see_also: &id003
    - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
    slots:
    - saved-trap-phase
    - saved-trap-left
    - saved-trap-hit
    description: Current trap phase/timer/hit-set; phase-dependent timing and hit-set emptiness require
      coupled current-rule checks.
  saved-special:
    class_uri: pixlnd:saved-special
    see_also: &id004
    - ../domain/encounter-contracts.md#boss-specials-and-breakable-rubble
    slots:
    - saved-special-phase
    - saved-special-left
    - saved-special-recovery
    - saved-special-engaged
    - saved-special-target
    - saved-special-origin
    - saved-special-endpoint
    description: Current special snapshot. Origin/endpoint are empty while inactive or three coordinates
      while active; phase-dependent applicability and geometry remain linked checks.
  saved-vendor:
    class_uri: pixlnd:saved-vendor
    see_also: &id005
    - ../domain/3_Classes.md#shop
    slots:
    - saved-vendor-day
    - saved-vendor-level
    - saved-vendor-ceiling
    - saved-vendor-items
    description: Remaining daily stock; earned ceiling, deterministic remaining-stock subsequence and
      clock/day agreement require current-rule validation.
slots:
  saved-rubble-broken:
    slot_uri: pixlnd:saved-rubble/broken
    alias: broken
    domain: saved-rubble
    range: boolean
    required: true
    see_also: *id001
  saved-rubble-restore-at:
    slot_uri: pixlnd:saved-rubble/restore_at
    alias: restore_at
    domain: saved-rubble
    range: double
    required: true
    see_also: *id001
    minimum_value: 0
  saved-prop-hp:
    slot_uri: pixlnd:saved-prop/hp
    alias: hp
    domain: saved-prop
    range: double
    required: true
    see_also: *id002
    minimum_value: 0
  saved-trap-phase:
    slot_uri: pixlnd:saved-trap/phase
    alias: phase
    domain: saved-trap
    range: trap-phase
    required: true
    see_also: *id003
  saved-trap-left:
    slot_uri: pixlnd:saved-trap/left
    alias: left
    domain: saved-trap
    range: double
    required: true
    see_also: *id003
    minimum_value: 0
  saved-trap-hit:
    slot_uri: pixlnd:saved-trap/hit
    alias: hit
    domain: saved-trap
    range: string
    required: true
    see_also: *id003
    multivalued: true
    list_elements_unique: true
  saved-special-phase:
    slot_uri: pixlnd:saved-special/phase
    alias: phase
    domain: saved-special
    range: special-phase
    required: true
    see_also: *id004
  saved-special-left:
    slot_uri: pixlnd:saved-special/left
    alias: left
    domain: saved-special
    range: double
    required: true
    see_also: *id004
    minimum_value: 0
  saved-special-recovery:
    slot_uri: pixlnd:saved-special/recovery
    alias: recovery
    domain: saved-special
    range: double
    required: true
    see_also: *id004
    minimum_value: 0
  saved-special-engaged:
    slot_uri: pixlnd:saved-special/engaged
    alias: engaged
    domain: saved-special
    range: boolean
    required: true
    see_also: *id004
  saved-special-target:
    slot_uri: pixlnd:saved-special/target
    alias: target
    domain: saved-special
    range: string
    required: true
    see_also: *id004
  saved-special-origin:
    slot_uri: pixlnd:saved-special/origin
    alias: origin
    domain: saved-special
    required: true
    see_also: *id004
    any_of:
    - range: double
      multivalued: true
      maximum_cardinality: 0
    - range: double
      multivalued: true
      minimum_cardinality: 3
      maximum_cardinality: 3
  saved-special-endpoint:
    slot_uri: pixlnd:saved-special/endpoint
    alias: endpoint
    domain: saved-special
    required: true
    see_also: *id004
    any_of:
    - range: double
      multivalued: true
      maximum_cardinality: 0
    - range: double
      multivalued: true
      minimum_cardinality: 3
      maximum_cardinality: 3
  saved-vendor-day:
    slot_uri: pixlnd:saved-vendor/day
    alias: day
    domain: saved-vendor
    range: integer
    required: true
    see_also: *id005
    minimum_value: 0
  saved-vendor-level:
    slot_uri: pixlnd:saved-vendor/level
    alias: level
    domain: saved-vendor
    range: integer
    required: true
    see_also: *id005
    minimum_value: 1
  saved-vendor-ceiling:
    slot_uri: pixlnd:saved-vendor/ceiling
    alias: ceiling
    domain: saved-vendor
    range: integer
    required: true
    see_also: *id005
    minimum_value: 0
  saved-vendor-items:
    slot_uri: pixlnd:saved-vendor/items
    alias: items
    domain: saved-vendor
    range: saved-item
    required: true
    see_also: *id005
    multivalued: true
    inlined: true
    inlined_as_list: true
enums:
  trap-phase:
    enum_uri: pixlnd:trap-phase
    permissible_values:
      idle: {}
      warning: {}
      active: {}
      cooldown: {}
  special-phase:
    enum_uri: pixlnd:special-phase
    permissible_values:
      ready: {}
      cooldown: {}
      warning: {}
      charge: {}
