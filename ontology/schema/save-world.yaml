id: https://w3id.org/pixlnd/save-world
name: pixlnd-save-world
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
default_range: string
classes:
  saved-mob-entry:
    class_uri: pixlnd:saved-mob-entry
    see_also: &id001
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-mob-entry-mob
    - saved-mob-entry-value
    description: Container-scoped current snapshot map entry; key identity and key/body agreement require
      admission checks. Native generation also accepts explicit wrapper objects.
  saved-land-entry:
    class_uri: pixlnd:saved-land-entry
    see_also: &id002
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-land-entry-land
    - saved-land-entry-value
    description: Container-scoped current snapshot map entry; key identity and key/body agreement require
      admission checks. Native generation also accepts explicit wrapper objects.
  saved-vendor-entry:
    class_uri: pixlnd:saved-vendor-entry
    see_also: &id003
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-vendor-entry-vendor
    - saved-vendor-entry-value
    description: Container-scoped current snapshot map entry; key identity and key/body agreement require
      admission checks. Native generation also accepts explicit wrapper objects.
  saved-rubble-entry:
    class_uri: pixlnd:saved-rubble-entry
    see_also: &id004
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-rubble-entry-rubble
    - saved-rubble-entry-value
    description: Container-scoped current snapshot map entry; key identity and key/body agreement require
      admission checks. Native generation also accepts explicit wrapper objects.
  saved-prop-entry:
    class_uri: pixlnd:saved-prop-entry
    see_also: &id005
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-prop-entry-prop
    - saved-prop-entry-value
    description: Container-scoped current snapshot map entry; key identity and key/body agreement require
      admission checks. Native generation also accepts explicit wrapper objects.
  saved-contents:
    class_uri: pixlnd:saved-contents
    see_also: &id006
    - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
    slots:
    - saved-contents-rubble
    - saved-contents-props
    - saved-contents-traps
  saved-reward:
    class_uri: pixlnd:saved-reward
    see_also: &id007
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-reward-source
    - saved-reward-delivered
    - saved-reward-level
    - saved-reward-payload
    - saved-reward-position
    - saved-reward-classes
    - saved-reward-class-id
    description: Current source/cycle reward record. Kill records add position, mission records add classes/class_id,
      furnishing records add neither. Those mutually conditional fields and source/cycle receipt integrity
      remain current-rule checks, not a universal payload shape.
  saved-spirit-level:
    class_uri: pixlnd:saved-spirit-level
    see_also: &id008
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-spirit-level-assignment
    - saved-spirit-level-level
    description: Initial boss level keyed by stable assignment, not item power; source-level-to-power
      conversion remains the canonical rule.
  saved-site:
    class_uri: pixlnd:saved-site
    see_also: &id009
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-site-id
    - saved-site-family
    - saved-site-volumes
    - saved-site-pending
    - saved-site-cleared
    - saved-site-completed
    - saved-site-cycle
    - saved-site-mobs
    - saved-site-rewards
    - saved-site-spirit-levels
    - saved-site-room-levels
    - saved-site-contents
    description: Current mutable site state keyed by logical site ID. Conditional ruin room levels, boss
      spirit membership, refresh/completion and reward issuance remain current-rule checks.
    rules:
    - see_also:
      - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
      preconditions:
        slot_conditions:
          saved-site-family:
            equals_string: ruins
      postconditions:
        slot_conditions:
          saved-site-room-levels:
            minimum_cardinality: 3
            maximum_cardinality: 3
  world-state:
    class_uri: pixlnd:world-state
    see_also: &id010
    - ../domain/3_Classes.md#save-data
    slots:
    - world-state-world-id
    - world-state-seed
    - world-state-clock
    - world-state-elapsed
    - world-state-lands
    - world-state-vendors
    - world-state-sites
    - world-state-mobs
    - world-state-characters
    description: Current WorldState.snapshot wire fields only. Saved-world identity is distinct from seed;
      IDs are not assumed to follow catalog kebab-case. Geometry, map key closure, local curves and reward
      integrity remain current-rule admission responsibilities.
  save-data:
    class_uri: pixlnd:save-data
    see_also: &id011
    - ../domain/3_Classes.md#save-data
    slots:
    - save-data-version
    - save-data-world
    - save-data-character
    description: Current save envelope only, not a portable import protocol or historical database. Current-rule
      validation must succeed before publishing or replacing original bytes.
slots:
  saved-mob-entry-mob:
    slot_uri: pixlnd:saved-mob-entry/mob
    alias: mob
    domain: saved-mob-entry
    range: string
    required: true
    see_also: *id001
    key: true
  saved-mob-entry-value:
    slot_uri: pixlnd:saved-mob-entry/value
    alias: value
    domain: saved-mob-entry
    range: saved-mob
    required: true
    see_also: *id001
    inlined: true
  saved-land-entry-land:
    slot_uri: pixlnd:saved-land-entry/land
    alias: land
    domain: saved-land-entry
    range: string
    required: true
    see_also: *id002
    key: true
  saved-land-entry-value:
    slot_uri: pixlnd:saved-land-entry/value
    alias: value
    domain: saved-land-entry
    range: saved-land-plan
    required: true
    see_also: *id002
    inlined: true
  saved-vendor-entry-vendor:
    slot_uri: pixlnd:saved-vendor-entry/vendor
    alias: vendor
    domain: saved-vendor-entry
    range: string
    required: true
    see_also: *id003
    key: true
  saved-vendor-entry-value:
    slot_uri: pixlnd:saved-vendor-entry/value
    alias: value
    domain: saved-vendor-entry
    range: saved-vendor
    required: true
    see_also: *id003
    inlined: true
  saved-rubble-entry-rubble:
    slot_uri: pixlnd:saved-rubble-entry/rubble
    alias: rubble
    domain: saved-rubble-entry
    range: string
    required: true
    see_also: *id004
    key: true
  saved-rubble-entry-value:
    slot_uri: pixlnd:saved-rubble-entry/value
    alias: value
    domain: saved-rubble-entry
    range: saved-rubble
    required: true
    see_also: *id004
    inlined: true
  saved-prop-entry-prop:
    slot_uri: pixlnd:saved-prop-entry/prop
    alias: prop
    domain: saved-prop-entry
    range: string
    required: true
    see_also: *id005
    key: true
  saved-prop-entry-value:
    slot_uri: pixlnd:saved-prop-entry/value
    alias: value
    domain: saved-prop-entry
    range: saved-prop
    required: true
    see_also: *id005
    inlined: true
  saved-contents-rubble:
    slot_uri: pixlnd:saved-contents/rubble
    alias: rubble
    domain: saved-contents
    range: saved-rubble-entry
    required: true
    see_also: *id006
    multivalued: true
    inlined: true
    inlined_as_list: false
  saved-contents-props:
    slot_uri: pixlnd:saved-contents/props
    alias: props
    domain: saved-contents
    range: saved-prop-entry
    required: true
    see_also: *id006
    multivalued: true
    inlined: true
    inlined_as_list: false
  saved-contents-traps:
    slot_uri: pixlnd:saved-contents/traps
    alias: traps
    domain: saved-contents
    range: saved-trap
    required: true
    see_also: *id006
    multivalued: true
    inlined: true
    inlined_as_list: true
  saved-reward-source:
    slot_uri: pixlnd:saved-reward/source
    alias: source
    domain: saved-reward
    range: string
    required: true
    see_also: *id007
    key: true
  saved-reward-delivered:
    slot_uri: pixlnd:saved-reward/delivered
    alias: delivered
    domain: saved-reward
    range: boolean
    required: true
    see_also: *id007
  saved-reward-level:
    slot_uri: pixlnd:saved-reward/level
    alias: level
    domain: saved-reward
    range: integer
    required: true
    see_also: *id007
    minimum_value: 1
  saved-reward-payload:
    slot_uri: pixlnd:saved-reward/payload
    alias: payload
    domain: saved-reward
    range: saved-item
    required: true
    see_also: *id007
    multivalued: true
    inlined: true
    inlined_as_list: true
  saved-reward-position:
    slot_uri: pixlnd:saved-reward/position
    alias: position
    domain: saved-reward
    range: double
    required: false
    see_also: *id007
    multivalued: true
    minimum_cardinality: 3
    maximum_cardinality: 3
  saved-reward-classes:
    slot_uri: pixlnd:saved-reward/classes
    alias: classes
    domain: saved-reward
    range: character-class
    required: false
    see_also: *id007
    multivalued: true
    list_elements_unique: true
  saved-reward-class-id:
    slot_uri: pixlnd:saved-reward/class_id
    alias: class_id
    domain: saved-reward
    range: string
    required: false
    see_also: *id007
    description: Current empty-string pending-class sentinel or selected class ID; membership and applicability
      require current-rule validation.
  saved-spirit-level-assignment:
    slot_uri: pixlnd:saved-spirit-level/assignment
    alias: assignment
    domain: saved-spirit-level
    range: string
    required: true
    see_also: *id008
    key: true
  saved-spirit-level-level:
    slot_uri: pixlnd:saved-spirit-level/level
    alias: level
    domain: saved-spirit-level
    range: integer
    required: true
    see_also: *id008
    minimum_value: 1
  saved-site-id:
    slot_uri: pixlnd:saved-site/id
    alias: id
    domain: saved-site
    range: string
    required: true
    see_also: *id009
    key: true
  saved-site-family:
    slot_uri: pixlnd:saved-site/family
    alias: family
    domain: saved-site
    range: saved-site-family
    required: true
    see_also: *id009
  saved-site-volumes:
    slot_uri: pixlnd:saved-site/volumes
    alias: volumes
    domain: saved-site
    range: double
    required: true
    see_also: *id009
    array:
      dimensions:
      - minimum_cardinality: 1
      - exact_cardinality: 6
  saved-site-pending:
    slot_uri: pixlnd:saved-site/pending
    alias: pending
    domain: saved-site
    range: boolean
    required: true
    see_also: *id009
  saved-site-cleared:
    slot_uri: pixlnd:saved-site/cleared
    alias: cleared
    domain: saved-site
    range: boolean
    required: true
    see_also: *id009
  saved-site-completed:
    slot_uri: pixlnd:saved-site/completed
    alias: completed
    domain: saved-site
    range: boolean
    required: true
    see_also: *id009
  saved-site-cycle:
    slot_uri: pixlnd:saved-site/cycle
    alias: cycle
    domain: saved-site
    range: integer
    required: true
    see_also: *id009
    minimum_value: 0
  saved-site-mobs:
    slot_uri: pixlnd:saved-site/mobs
    alias: mobs
    domain: saved-site
    range: saved-mob-entry
    required: true
    see_also: *id009
    multivalued: true
    inlined: true
    inlined_as_list: false
  saved-site-rewards:
    slot_uri: pixlnd:saved-site/rewards
    alias: rewards
    domain: saved-site
    range: saved-reward
    required: true
    see_also: *id009
    multivalued: true
    inlined: true
    inlined_as_list: false
  saved-site-spirit-levels:
    slot_uri: pixlnd:saved-site/spirit_levels
    alias: spirit_levels
    domain: saved-site
    range: saved-spirit-level
    required: true
    see_also: *id009
    multivalued: true
    inlined: true
    inlined_as_list: false
  saved-site-room-levels:
    slot_uri: pixlnd:saved-site/room_levels
    alias: room_levels
    domain: saved-site
    range: integer
    required: true
    see_also: *id009
    multivalued: true
    minimum_value: 1
    maximum_cardinality: 3
  saved-site-contents:
    slot_uri: pixlnd:saved-site/contents
    alias: contents
    domain: saved-site
    range: saved-contents
    required: true
    see_also: *id009
    inlined: true
  world-state-world-id:
    slot_uri: pixlnd:world-state/world_id
    alias: world_id
    domain: world-state
    range: string
    required: true
    see_also: *id010
    pattern: ^[^/]+$
  world-state-seed:
    slot_uri: pixlnd:world-state/seed
    alias: seed
    domain: world-state
    range: integer
    required: true
    see_also: *id010
  world-state-clock:
    slot_uri: pixlnd:world-state/clock
    alias: clock
    domain: world-state
    range: double
    required: true
    see_also: *id010
    minimum_value: 0
  world-state-elapsed:
    slot_uri: pixlnd:world-state/elapsed
    alias: elapsed
    domain: world-state
    range: double
    required: true
    see_also: *id010
    minimum_value: 0
  world-state-lands:
    slot_uri: pixlnd:world-state/lands
    alias: lands
    domain: world-state
    range: saved-land-entry
    required: true
    see_also: *id010
    multivalued: true
    inlined: true
    inlined_as_list: false
  world-state-vendors:
    slot_uri: pixlnd:world-state/vendors
    alias: vendors
    domain: world-state
    range: saved-vendor-entry
    required: true
    see_also: *id010
    multivalued: true
    inlined: true
    inlined_as_list: false
  world-state-sites:
    slot_uri: pixlnd:world-state/sites
    alias: sites
    domain: world-state
    range: saved-site
    required: true
    see_also: *id010
    multivalued: true
    inlined: true
    inlined_as_list: false
  world-state-mobs:
    slot_uri: pixlnd:world-state/mobs
    alias: mobs
    domain: world-state
    range: saved-mob-entry
    required: true
    see_also: *id010
    multivalued: true
    inlined: true
    inlined_as_list: false
  world-state-characters:
    slot_uri: pixlnd:world-state/characters
    alias: characters
    domain: world-state
    range: character-world-position
    required: true
    see_also: *id010
    multivalued: true
    inlined: true
    inlined_as_list: false
  save-data-version:
    slot_uri: pixlnd:save-data/version
    alias: version
    domain: save-data
    range: integer
    required: true
    see_also: *id011
    minimum_value: 1
    maximum_value: 1
  save-data-world:
    slot_uri: pixlnd:save-data/world
    alias: world
    domain: save-data
    range: world-state
    required: true
    see_also: *id011
    inlined: true
  save-data-character:
    slot_uri: pixlnd:save-data/character
    alias: character
    domain: save-data
    range: character-state
    required: true
    see_also: *id011
    inlined: true
