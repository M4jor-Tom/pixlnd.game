id: https://w3id.org/pixlnd/save-combat/threat-records
name: pixlnd-save-combat-threat-records
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- entities
default_range: string
classes:
  saved-threat:
    class_uri: pixlnd:saved-threat
    see_also: &id001
    - ../domain/3_Classes.md#ai-behavior
    slots:
    - saved-threat-player
    - saved-threat-amount
    description: Positive accumulated threat keyed by player within one incarnation.
  saved-order:
    class_uri: pixlnd:saved-order
    see_also: &id002
    - ../domain/3_Classes.md#ai-behavior
    slots:
    - saved-order-player
    - saved-order-order
    description: First-engagement order keyed by player within one incarnation.
  saved-provocation:
    class_uri: pixlnd:saved-provocation
    see_also: &id003
    - ../domain/3_Classes.md#ai-behavior
    slots:
    - saved-provocation-player
    - saved-provocation-provoked
    description: Neutral provocation memory keyed by player within one incarnation.
slots:
  saved-threat-player:
    slot_uri: pixlnd:saved-threat/player
    alias: player
    domain: saved-threat
    range: player-character
    required: true
    see_also: *id001
    key: true
    description: Player of the saved threat.
  saved-threat-amount:
    slot_uri: pixlnd:saved-threat/amount
    alias: amount
    domain: saved-threat
    range: double
    required: true
    see_also: *id001
    minimum_value: 0
    description: Amount of the saved threat.
    none_of:
    - equals_number: 0
  saved-order-player:
    slot_uri: pixlnd:saved-order/player
    alias: player
    domain: saved-order
    range: player-character
    required: true
    see_also: *id002
    key: true
    description: Player of the saved order.
  saved-order-order:
    slot_uri: pixlnd:saved-order/order
    alias: order
    domain: saved-order
    range: integer
    required: true
    see_also: *id002
    minimum_value: 0
    description: Order of the saved order.
    maximum_value: 9223372036854775295
  saved-provocation-player:
    slot_uri: pixlnd:saved-provocation/player
    alias: player
    domain: saved-provocation
    range: player-character
    required: true
    see_also: *id003
    key: true
    description: Player of the saved provocation.
  saved-provocation-provoked:
    slot_uri: pixlnd:saved-provocation/provoked
    alias: provoked
    domain: saved-provocation
    range: boolean
    required: true
    see_also: *id003
    description: Provoked of the saved provocation.
    equals_expression: 'True'
