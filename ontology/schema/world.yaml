      minimum-room-guard-level: {alias: "minimum-room-guard-level", slot_uri: "pixlnd:furnishing-profile/minimum-room-guard-level", range: integer, required: true, equals_number: 1, description: "Minimum source level for the saved room guard-pack level shared by furnishings and newly spawned or replacement guards; a fixed context parameter, not an actual saved level or another room-level list.", see_also: ["../domain/encounter-contracts.md#spike-traps-and-furnishing-contents"]}
  vase-profile:
