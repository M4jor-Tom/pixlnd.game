  guaranteed-boss-gear-profile:
    class_uri: "pixlnd:guaranteed-boss-gear-profile"
    description: "Fixed logical guaranteed-gear parameters, not a reward event, configuration or saved payload. All seven initial site bosses independently guarantee one additional gear item, not replacement normal rolls or per-player copies. Gear uses power(L) for the defeated boss current saved level L, minimum 1, not the initial spirit level, current HP or boss power; no spread and zero upgrades. Rarity is tier + 1 capped at legendary, not a random rarity roll. Kind uses relative weights and the four current character classes are equally likely; legal class materials/weapons and subtype/modifier/name choices reuse linked inputs. New genuine deaths may reroll those choices, not tier-based rarity. Reloads cannot reroll the same death rewards. Shared pickup and reward lifecycle follow the linked rules; spirit applicability and initial-level power are distinct."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#loot-rule", "../domain/3_Classes.md#item", "../instances/generators.json#design.loot"]
