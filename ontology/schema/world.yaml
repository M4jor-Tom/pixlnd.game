  initial-site-placement-profile: {
    "class_uri": "pixlnd:initial-site-placement-profile",
    "description": "Initial hybrid site placement parameters, not positions or saved state. Land-seeded locations remain fixed across visits and daily renewal. Floors follow H=max(natural ground height, sea level+4 blocks); ocean lands retain dry site islands. The dry village hub applies only where ordinary ocean village generation fails. Protected village area, finite-world bounds and joint village/all-six-site geography validation remain required; failure is diagnostic, never fewer suppliers or partial encounters. Optional terrain-following guidance never reshapes terrain or guarantees walkability; its failure only omits guidance.",
    "see_also": ["../domain/encounter-contracts.md#placement-and-access"],
    "attributes": {
      "minimum-village-distance-blocks": {"alias": "minimum-village-distance-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/minimum-village-distance-blocks", "range": "integer", "required": true, "equals_number": 192, "description": "Inclusive lower distance of a site centre from the village square, not the land centre.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]},
      "maximum-village-distance-blocks": {"alias": "maximum-village-distance-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/maximum-village-distance-blocks", "range": "integer", "required": true, "equals_number": 215, "description": "Inclusive upper distance of a site centre from the village square, not the land centre.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]},
      "minimum-site-separation-blocks": {"alias": "minimum-site-separation-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/minimum-site-separation-blocks", "range": "integer", "required": true, "equals_number": 192, "description": "Minimum distance between site centres, distinct from village distance.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]},
      "sea-level-floor-clearance-blocks": {"alias": "sea-level-floor-clearance-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/sea-level-floor-clearance-blocks", "range": "integer", "required": true, "equals_number": 4, "description": "Relative sea-level clearance in H=max(natural ground height, sea level+4 blocks), not absolute floor altitude.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]},
      "terrain-apron-blocks": {"alias": "terrain-apron-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/terrain-apron-blocks", "range": "integer", "required": true, "equals_number": 8, "description": "Site terrain apron, not a connecting-route width or walkability guarantee.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]},
      "fallback-village-hub-width-blocks": {"alias": "fallback-village-hub-width-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/fallback-village-hub-width-blocks", "range": "integer", "required": true, "equals_number": 64, "description": "Dry village hub width only on ocean lands where ordinary village generation otherwise fails; not every site or battlefield.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]},
      "fallback-village-hub-depth-blocks": {"alias": "fallback-village-hub-depth-blocks", "slot_uri": "pixlnd:initial-site-placement-profile/fallback-village-hub-depth-blocks", "range": "integer", "required": true, "equals_number": 64, "description": "Dry village hub depth only on ocean lands where ordinary village generation otherwise fails; not every site or battlefield.", "see_also": ["../domain/encounter-contracts.md#placement-and-access"]}
    }
  }

