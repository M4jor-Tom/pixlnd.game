  encounter-assignment:
    class_uri: "pixlnd:encounter-assignment"
    description: "Permanent logical role/special and eligible non-mission boss spirit assignment. Probabilities, boss-only eligibility and initial-level/current-level distinctions remain the linked rules; no new assignment engine."
    see_also: ["../domain/encounter-contracts.md#boss-specials-and-breakable-rubble"]
    exactly_one_of:
    - slot_conditions:
        boss: {equals_expression: "True"}
        special: {value_presence: PRESENT}
    - slot_conditions:
        boss: {equals_expression: "False"}
        special: {value_presence: ABSENT}
    attributes:
      role: {"alias": "role", "slot_uri": "pixlnd:encounter-assignment/role", "range": "string", "description": "Role; interpreted within the linked source scope.", "required": true, "equals_string_in": ["melee", "ranged", "mage"]}
      tier: {"alias": "tier", "slot_uri": "pixlnd:encounter-assignment/tier", "range": "integer", "description": "Tier; interpreted within the linked source scope.", "required": true, "minimum_value": 0, "maximum_value": 4}
      boss: {"alias": "boss", "slot_uri": "pixlnd:encounter-assignment/boss", "range": "boolean", "description": "Boss; interpreted within the linked source scope.", "required": true}
      special: {"alias": "special", "slot_uri": "pixlnd:encounter-assignment/special", "description": "Special; interpreted within the linked source scope.", "exactly_one_of": [{"range": "string", "equals_string_in": ["stomp", "charge"]}]}
      spirit: {"alias": "spirit", "slot_uri": "pixlnd:encounter-assignment/spirit", "description": "Spirit; interpreted within the linked source scope.", "exactly_one_of": [{"range": "material", "equals_string_in": ["spirit-fire", "spirit-unholy", "spirit-ice", "spirit-wind"]}]}
  initial-nonboss-assignment:
    class_uri: "pixlnd:initial-nonboss-assignment"
    description: "Permanent logical assignment of an initial site nonboss guard: not a boss, with neither a boss special nor a spirit type. Scope is expressed by this class, not a new mission/site/context field or saved payload; ordinary kill loot remains separate."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/encounter-contracts.md#boss-specials-and-breakable-rubble"]
    is_a: "encounter-assignment"
    slot_usage:
      boss: {equals_expression: "False"}
    none_of:
    - slot_conditions:
        special: {value_presence: PRESENT}
    - slot_conditions:
        spirit: {value_presence: PRESENT}
  initial-ruins-boss-assignment:
    class_uri: "pixlnd:initial-ruins-boss-assignment"
    description: "Permanent logical assignment of either of the two initial ruins non-mission bosses: boss, one required permanent special and one required spirit type. First logical generation independently chooses the spirit type once; genuine deaths retain that type and power derived from the initial boss level across renewal. No per-player copy, per-death or daily type reroll, stored level or reward receipt is added."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/encounter-contracts.md#boss-specials-and-breakable-rubble"]
    is_a: "encounter-assignment"
    slot_usage:
      boss: {equals_expression: "True"}
      special: {required: true}
      spirit: {required: true}
  initial-mission-boss-assignment:
    class_uri: "pixlnd:initial-mission-boss-assignment"
    description: "Permanent logical assignment of the initial camp boss or any of the four supplier rescue bosses: boss with a required permanent special and no spirit type. These mission bosses give zero spirits; guaranteed gear and shared mission packages remain separate additive rewards. No mission Boolean, selected site serialization or global spirit exclusion is introduced."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/encounter-contracts.md#boss-specials-and-breakable-rubble"]
    is_a: "encounter-assignment"
    slot_usage:
      boss: {equals_expression: "True"}
      special: {required: true}
    none_of:
    - slot_conditions:
        spirit: {value_presence: PRESENT}
  initial-spirit-profile:
    class_uri: "pixlnd:initial-spirit-profile"
    description: "Fixed logical spirit acquisition parameters for the two ruins bosses (non-mission bosses), not a reward event, configuration or saved payload. At first logical generation each independently chooses one of four equally probable existing spirit types; that choice is permanent per logical boss. Each genuine ruins-boss death gives one cube and mission bosses give zero. Use canonical power(L) for the initial boss level L without spread, retaining its initial-level-derived power across daily renewal, not the current defeated boss level used by guaranteed gear. These are shared ground drops, not per-player copies, additive to ordinary rolls and guaranteed gear; unload/restart cannot reroll or re-award a death. This scope permits collecting and carrying only, no numerical effects or attachment behavior; retained bench restrictions and later customization remain distinct. No regional weakening or global spirit exclusion is added."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item", "../domain/3_Classes.md#spirit-cube", "../instances/generators.json#design.initial-encounters.spirits"]
    attributes:
      ruins-boss-count-per-death: {alias: "ruins-boss-count-per-death", slot_uri: "pixlnd:initial-spirit-profile/ruins-boss-count-per-death", range: integer, required: true, equals_number: 1, description: "One spirit cube per genuine death of either initial ruins boss, not per player or per whole site.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      mission-boss-count-per-death: {alias: "mission-boss-count-per-death", slot_uri: "pixlnd:initial-spirit-profile/mission-boss-count-per-death", range: integer, required: true, equals_number: 0, description: "Zero spirit cubes for the camp and four supplier rescue mission bosses; not a global removal of spirit sources.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      spirit-fire-probability: {alias: "spirit-fire-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-fire-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing fire spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-fire", "../instances/generators.json#design.initial-encounters.spirits"]}
      spirit-unholy-probability: {alias: "spirit-unholy-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-unholy-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing unholy spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-unholy", "../instances/generators.json#design.initial-encounters.spirits"]}
      spirit-ice-probability: {alias: "spirit-ice-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-ice-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing ice spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-ice", "../instances/generators.json#design.initial-encounters.spirits"]}
      spirit-wind-probability: {alias: "spirit-wind-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-wind-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing wind spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-wind", "../instances/generators.json#design.initial-encounters.spirits"]}
      power-spread: {alias: "power-spread", slot_uri: "pixlnd:initial-spirit-profile/power-spread", range: integer, required: true, equals_number: 0, description: "No spread in power points after canonical power(L) conversion of INITIAL boss level L; renewal retains that power, unlike current-level guaranteed gear.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item"]}
      minimum-initial-boss-level: {alias: "minimum-initial-boss-level", slot_uri: "pixlnd:initial-spirit-profile/minimum-initial-boss-level", range: integer, required: true, equals_number: 1, description: "Minimum source-level context for the logical boss INITIAL level L used by spirit power(L), matching the existing saved initial-boss-level constraint; not an actual saved level, another level list or minimum item power.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "save-world.yaml#saved-spirit-level-level"]}
  supplier-gear-stock-ceiling-profile:
    class_uri: "pixlnd:supplier-gear-stock-ceiling-profile"
    description: "Fixed logical gear-stock ceiling parameters shared by all players in the same saved world for each land, not current progress, a completed-rescue counter or a stock payload. Starts common; four completed supplier rescues raise the ceiling to legendary. The raised ceiling applies at the next normal stock generation/restock, not an extra rescue-triggered reroll. This is the best quality shops may offer, not a guarantee every item has that quality. Existing quantities and prices remain unchanged; equipment keeps its strength when travelling. Rescue eligibility, completion and restocking follow the linked rules."
    see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s"]
    attributes:
      initial-rarity-index: {alias: "initial-rarity-index", slot_uri: "pixlnd:supplier-gear-stock-ceiling-profile/initial-rarity-index", range: integer, required: true, equals_number: 0, description: "Common initial land-local gear-stock ceiling index, not a stored current ceiling or a default stock item rarity.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s", "../instances/rarities.json#common"]}
      rarity-increment-per-completed-rescue: {alias: "rarity-increment-per-completed-rescue", slot_uri: "pixlnd:supplier-gear-stock-ceiling-profile/rarity-increment-per-completed-rescue", range: integer, required: true, equals_number: 1, description: "Ceiling rises one grade per completed supplier rescue, shared across players in that saved-world land, not a per-player benefit or an immediate stock reroll.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s"]}
      maximum-rarity-index: {alias: "maximum-rarity-index", slot_uri: "pixlnd:supplier-gear-stock-ceiling-profile/maximum-rarity-index", range: integer, required: true, equals_number: 4, description: "Legendary maximum gear-stock ceiling index, reached after four land-shared rescues; not guaranteed quality of every offer.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s", "../instances/rarities.json#legendary"]}
  shared-mission-completion-profile:
    class_uri: "pixlnd:shared-mission-completion-profile"
    description: "Fixed logical delivery-height and extra-XP parameters for one shared package per camp/rescue completion cycle, not another reward event, receipt, configuration or package shape. Existing source level and class snapshot/fallback/deferred choice remain unchanged. Delivery at camp centre or captive feet follows camp final-death or rescue conversation/last-player-exit completion timing, once per cycle. Issuance and undelivered payload persist without duplicate rewards; ordinary ground pickup and lifetime apply, including later visitors. Existing kill XP and other future currency contracts remain unchanged; no additional completion currency is introduced."
    see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops"]
    attributes:
