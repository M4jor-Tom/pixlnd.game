  hybrid-inn-sleep-service-parameters:
    class_uri: pixlnd:hybrid-inn-sleep-service-parameters
    description: "Hybrid inn paid sleep parameters from settlements/inn items 2–4, distinct from free anytime healing and respawn. The 18:00–06:00 availability wraps midnight; next 07:00 is a clock skip, not accelerated combat, statuses or cooldowns. All connected players explicitly agree; the initiator pays the single fee only on success, with refusal blocking the skip without charge. Ordinary midnight resets apply once only when crossed; sleeping grants no extra shop refresh or mission reroll. The historical reference sleep multiplier and fresh-world clock remain separate."
    see_also: &inn-sleep-source ["../domain/3_Classes.md#game-clock", "../domain/5_Constraints.md#c-inn-hours"]
    attributes:
      fee-copper:
        alias: fee-copper
        slot_uri: pixlnd:hybrid-inn-sleep-service-parameters/fee-copper
        range: integer
        required: true
        equals_number: 10
        description: Single initiating-player fee on a successful agreed sleep skip.
        see_also: *inn-sleep-source
      available-from-hour:
        alias: available-from-hour
        slot_uri: pixlnd:hybrid-inn-sleep-service-parameters/available-from-hour
        range: integer
        required: true
        equals_number: 18
        description: Start hour of the overnight paid sleep window, not a free recovery restriction.
        see_also: *inn-sleep-source
      available-until-hour:
        alias: available-until-hour
        slot_uri: pixlnd:hybrid-inn-sleep-service-parameters/available-until-hour
        range: integer
        required: true
        equals_number: 6
        description: End hour of the overnight paid sleep window; wraps midnight from 18.
        see_also: *inn-sleep-source
      next-morning-hour:
        alias: next-morning-hour
        slot_uri: pixlnd:hybrid-inn-sleep-service-parameters/next-morning-hour
        range: integer
        required: true
        equals_number: 7
        description: "Next 07:00 target: 22:00 reaches tomorrow morning; 02:00 reaches that morning."
        see_also: *inn-sleep-source
