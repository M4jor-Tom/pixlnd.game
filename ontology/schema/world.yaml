      trigger-max-feet-above-floor-blocks: {alias: "trigger-max-feet-above-floor-blocks", slot_uri: "pixlnd:spike-trap-profile/trigger-max-feet-above-floor-blocks", range: double, required: true, minimum_value: 1, maximum_value: 1, description: "Maximum triggering player-feet height above the trap floor in blocks, inclusive upper endpoint.", see_also: ["../domain/encounter-contracts.md#spike-traps-and-furnishing-contents"]}
      warning-seconds: {alias: "warning-seconds", slot_uri: "pixlnd:spike-trap-profile/warning-seconds", range: double, required: true, minimum_value: 0.8, maximum_value: 0.8, description: "Visible and audible warning duration in simulation seconds; leaving does not cancel it.", see_also: ["../domain/encounter-contracts.md#spike-traps-and-furnishing-contents"]}
      active-seconds: {alias: "active-seconds", slot_uri: "pixlnd:spike-trap-profile/active-seconds", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Active duration in simulation seconds after warning.", see_also: ["../domain/encounter-contracts.md#spike-traps-and-furnishing-contents"]}
