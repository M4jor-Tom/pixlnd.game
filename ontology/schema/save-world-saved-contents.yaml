id: https://w3id.org/pixlnd/save-world/saved-contents
name: pixlnd-save-world-saved-contents
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- save-world-saved-entries
default_range: string
classes:
  saved-contents:
    class_uri: pixlnd:saved-contents
    see_also:
    - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
    slots:
    - saved-contents-rubble
    - saved-contents-props
    - saved-contents-traps
    description: Persisted breakable stone, furnishing health and spike state for one site.
  saved-reward:
    class_uri: pixlnd:saved-reward
    see_also:
    - ../domain/3_Classes.md#save-data
    slots:
    - saved-reward-source
    - saved-reward-delivered
    - saved-reward-level
    - saved-reward-payload
    - saved-reward-position
    - saved-reward-classes
    - saved-reward-class-id
    description: Source/cycle reward receipt with immutable payload and delivery state. Kill receipts have position;
      mission receipts have classes and class_id; furnishings have neither.
    rules:
    - preconditions:
        slot_conditions:
          saved-reward-source:
            alias: source
            pattern: ^kill/
      postconditions:
        slot_conditions:
          saved-reward-position:
            alias: position
            required: true
          saved-reward-classes:
            alias: classes
            value_presence: ABSENT
          saved-reward-class-id:
            alias: class_id
            value_presence: ABSENT
    - preconditions:
        slot_conditions:
          saved-reward-source:
            alias: source
            pattern: ^mission/
      postconditions:
        slot_conditions:
          saved-reward-position:
            alias: position
            value_presence: ABSENT
          saved-reward-classes:
            alias: classes
            required: true
          saved-reward-class-id:
            alias: class_id
            required: true
    - preconditions:
        slot_conditions:
          saved-reward-source:
            alias: source
            pattern: ^furnishing/
      postconditions:
        slot_conditions:
          saved-reward-position:
            alias: position
            value_presence: ABSENT
          saved-reward-classes:
            alias: classes
            value_presence: ABSENT
          saved-reward-class-id:
            alias: class_id
            value_presence: ABSENT
slots:
  saved-contents-rubble: {slot_uri: 'pixlnd:saved-contents/rubble', alias: rubble, domain: saved-contents, range: saved-rubble-entry, required: true,
      see_also: [../domain/encounter-contracts.md#spike-traps-and-furnishing-contents], multivalued: true, inlined: true,
      inlined_as_list: false, description: Rubble of the saved contents.}
  saved-contents-props: {slot_uri: 'pixlnd:saved-contents/props', alias: props, domain: saved-contents, range: saved-prop-entry, required: true,
      see_also: [../domain/encounter-contracts.md#spike-traps-and-furnishing-contents], multivalued: true, inlined: true,
      inlined_as_list: false, description: Props of the saved contents.}
  saved-contents-traps: {slot_uri: 'pixlnd:saved-contents/traps', alias: traps, domain: saved-contents, range: saved-trap, required: true,
      see_also: [../domain/encounter-contracts.md#spike-traps-and-furnishing-contents], multivalued: true, inlined: true,
      inlined_as_list: true, description: Traps of the saved contents.}
  saved-reward-source: {slot_uri: 'pixlnd:saved-reward/source', alias: source, domain: saved-reward, range: string, required: true, see_also: [
        ../domain/3_Classes.md#save-data], key: true, description: Container-local source and issuance cycle key.}
  saved-reward-delivered: {slot_uri: 'pixlnd:saved-reward/delivered', alias: delivered, domain: saved-reward, range: boolean, required: true,
      see_also: [../domain/3_Classes.md#save-data], description: Whether ordinary shared pickups have been exposed.}
  saved-reward-level: {slot_uri: 'pixlnd:saved-reward/level', alias: level, domain: saved-reward, range: integer, required: true, see_also: [
        ../domain/3_Classes.md#save-data], minimum_value: 1, description: 'Source level at issuance, before item-power
        conversion.', maximum_value: 9223372036854775295}
  saved-reward-payload: {slot_uri: 'pixlnd:saved-reward/payload', alias: payload, domain: saved-reward, range: saved-item, required: true,
      see_also: [../domain/3_Classes.md#save-data], multivalued: true, inlined: true, inlined_as_list: true, description: Already
        rolled items retained until delivery.}
  saved-reward-position: {slot_uri: 'pixlnd:saved-reward/position', alias: position, domain: saved-reward, required: false, see_also: [../domain/3_Classes.md#save-data],
      description: Logical kill-loot delivery coordinates., exactly_one_of: [{range: double, multivalued: true, minimum_cardinality: 3,
          maximum_cardinality: 3}]}
  saved-reward-classes: {slot_uri: 'pixlnd:saved-reward/classes', alias: classes, domain: saved-reward, required: false, see_also: [../domain/3_Classes.md#save-data],
      description: Distinct inside classes snapshotted at mission completion., list_elements_unique: true, exactly_one_of: [
        {range: character-class, multivalued: true}]}
  saved-reward-class-id: {slot_uri: 'pixlnd:saved-reward/class_id', alias: class_id, domain: saved-reward, required: false, see_also: [../domain/3_Classes.md#save-data],
      description: 'Selected mission class, or empty string while class selection is pending.', exactly_one_of: [{range: string}]}
