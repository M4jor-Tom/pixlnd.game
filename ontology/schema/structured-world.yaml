id: https://w3id.org/pixlnd/structured-world
name: pixlnd-structured-world
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- identity
- items
- catalog-identity-combat
default_range: string
classes:
  flora-yield-entry:
    description: "Flora yield entry; interpreted under its linked source definition and context."
    class_uri: pixlnd:flora-yield-entry
    see_also:
    - ../domain/3_Classes.md#flora
    - ../domain/4_Relations.md
    - ../instances/flora.json
    slots:
    - flora-yield-entry-ingredient
    - flora-yield-entry-quantity
  dungeon-variant-entry:
    description: "Dungeon variant entry; interpreted under its linked source definition and context."
    class_uri: pixlnd:dungeon-variant-entry
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
    slots:
    - dungeon-variant-entry-label
    - dungeon-variant-entry-description
  static-entity-catalog:
    class_uri: pixlnd:static-entity-catalog
    description: Catalog tables and configuration, not an individual static entity.
    see_also:
    - ../domain/5_Constraints.md
    - ../instances/static-entities.json
    slots:
    - static-entity-catalog-by-id
    - static-entity-catalog-behaviour
    - static-entity-catalog-s-additions
    - static-entity-catalog-candles
  static-index-name:
    description: "Static index name; interpreted under its linked source definition and context."
    class_uri: pixlnd:static-index-name
    see_also:
    - ../instances/static-entities.json#by-id
    slots:
    - static-index-name-index
    - static-index-name-name
  static-behaviour-entry:
    description: "Static behaviour entry; interpreted under its linked source definition and context."
    class_uri: pixlnd:static-behaviour-entry
    see_also:
    - ../instances/static-entities.json#behaviour
    slots:
    - static-behaviour-entry-group
    - static-behaviour-entry-description
  static-candles:
    description: "Static candles; interpreted under its linked source definition and context."
    class_uri: pixlnd:static-candles
    see_also:
    - ../instances/static-entities.json#candles
    slots:
    - static-candles-colors
    - static-candles-sizes
    - static-candles-placement
  block-type-catalog:
    class_uri: pixlnd:block-type-catalog
    description: Catalog configuration, not a voxel or an ordinary block type.
    see_also:
    - ../domain/3_Classes.md#block
    - ../instances/block-types.json
    slots:
    - block-type-catalog-scale
    - block-type-catalog-cub-format
  block-scale:
    description: "Block scale; interpreted under its linked source definition and context."
    class_uri: pixlnd:block-scale
    see_also:
    - ../domain/3_Classes.md#block
    - ../instances/block-types.json
    slots:
    - block-scale-block-native-units
    - block-scale-alpha-zone-blocks
    - block-scale-steam-zone-blocks
    - block-scale-steam-map-chunk-blocks
    - block-scale-character-height-m
  block-cub-format:
    description: "Block cub format; interpreted under its linked source definition and context."
    class_uri: pixlnd:block-cub-format
    see_also:
    - ../domain/3_Classes.md#block
    - ../instances/block-types.json
    slots:
    - block-cub-format-header
    - block-cub-format-body
    - block-cub-format-empty
    - block-cub-format-compression
    - block-cub-format-storage
  map-marker-integer-triple:
    class_uri: pixlnd:map-marker-integer-triple
    description: Three integer coordinates of a source-qualified map marker; not a polygon vertex or a serialization rule.
    slots:
    - map-marker-integer-triple-x
    - map-marker-integer-triple-y
    - map-marker-integer-triple-z
  map-marker-place-key:
    class_uri: pixlnd:map-marker-place-key
    description: Two integer coordinates forming the composite place key in the later WorldMap source collection.
    slots:
    - map-marker-place-key-x
    - map-marker-place-key-y
  place-marker-list-entry:
    class_uri: pixlnd:place-marker-list-entry
    description: Later release WorldMap positionsByPlace entry; retains its two-integer key and list of integer triples as separate members. Duplicate composite-key enforcement is not selected.
    slots:
    - place-marker-list-entry-place
    - place-marker-list-entry-positions
  zone-tile-marker-collection:
    class_uri: pixlnd:zone-tile-marker-collection
    description: Alpha-era source captures t05-infinite-alpha-worldmap-h.txt and t06-infinite-alpha-worldmap-cpp.txt show ZoneTile m_markers as a list of integer triples. This scope is distinct from the later release keyed collection; neither defines polygon geometry, connectivity, client authenticity, or a universal wire/save contract.
    slots:
    - zone-tile-marker-collection-markers
  place-keyed-marker-collection:
    class_uri: pixlnd:place-keyed-marker-collection
    description: Later release captures t14-release-worldmap-h.txt and t15-release-worldmap-cpp.txt show WorldMapRegion positionsByPlace keyed by a two-integer place pair, with a list of integer triples per key. This source scope does not define polygon geometry, connectivity, client authenticity, or a universal wire/save contract.
    slots:
    - place-keyed-marker-collection-places
  terrain-features-source:
    class_uri: "pixlnd:terrain-features-source"
    description: "Reversible keyed source container; fixed metadata remains separate."
    see_also: ["../instances/terrain-features.json", "../domain/5_Constraints.md"]
    annotations: {"source-map-entries": "entries"}
    attributes:
      schema-tag: {"range": "string", "required": true, "equals_string": "terrain-feature", "alias": "$schema", "slot_uri": "pixlnd:terrain-features-source/schema", "description": "Source $schema of terrain-features-source; preserves literal representation and qualification."}
      entries: {"range": "terrain-feature-source-row-entry", "multivalued": true, "required": true, "minimum_cardinality": 1, "inlined": true, "inlined_as_list": true, "alias": "entries", "slot_uri": "pixlnd:terrain-features-source/entries", "description": "Source entries of terrain-features-source; preserves literal representation and qualification."}
  terrain-feature-source-row-entry:
    class_uri: "pixlnd:terrain-feature-source-row-entry"
    description: "Reversible original container key and unchanged value."
    see_also: ["../instances/terrain-features.json", "../domain/5_Constraints.md"]
    slots: ["source-entry-key"]
    attributes:
      value: {"range": "terrain-feature-source-row", "inlined": true, "required": true, "alias": "value", "slot_uri": "pixlnd:terrain-feature-source-row-entry/value", "description": "Source value of terrain-feature-source-row-entry; preserves literal representation and qualification."}
  terrain-feature-source-row:
    class_uri: "pixlnd:terrain-feature-source-row"
    description: "Complete natural-feature descriptions; overhang storage uncertainty remains literal prose."
    see_also: ["../instances/terrain-features.json", "../domain/5_Constraints.md"]
    attributes:
      name: {"range": "string", "required": true, "alias": "name", "slot_uri": "pixlnd:terrain-feature-source-row/name", "description": "Source name of terrain-feature-source-row; preserves literal representation and qualification."}
      desc: {"range": "string", "required": true, "alias": "desc", "slot_uri": "pixlnd:terrain-feature-source-row/desc", "description": "Source desc of terrain-feature-source-row; preserves literal representation and qualification."}
      named: {"exactly_one_of": [{"range": "boolean"}, {"range": "string"}], "alias": "named", "slot_uri": "pixlnd:terrain-feature-source-row/named", "description": "Source named of terrain-feature-source-row; preserves literal representation and qualification."}
      versions: {"range": "string", "multivalued": true, "required": true, "minimum_cardinality": 1, "equals_string_in": ["A", "S", "Ω", "X", "A?", "S?"], "alias": "versions", "slot_uri": "pixlnd:terrain-feature-source-row/versions", "description": "Source versions of terrain-feature-source-row; preserves literal representation and qualification."}
  deposits-source:
