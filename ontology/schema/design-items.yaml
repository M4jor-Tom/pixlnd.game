slots:
  generators-source-field-design:
    alias: design
    slot_uri: pixlnd:generators-source/design
    description: Source design of generators-source.
    required: true
    range: generator-design
    inlined: true
    equals_expression: design if design['defence']['dodge']['stamina'] <= design['movement']['stamina']['max'] else ''
