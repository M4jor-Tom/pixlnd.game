id: https://w3id.org/pixlnd/world/source-components
name: pixlnd-world-source-components
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- identity
- items
- associations
- world-world
default_range: string
classes:
  cuwo-discovery-coordinate-components:
    class_uri: "pixlnd:cuwo-discovery-coordinate-components"
    description: "Third-party Alpha ChunkDiscovered u32 pair, world-global 256-block helper context. Component projection only, not authenticated client behavior, persisted exploration or hybrid encoding."
    see_also: ["https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/packet.py#L652-L659", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/world.py"]
    is_a: "zone-coordinate"
    slot_usage: {"coordinate-x": {"range": "uint32"}, "coordinate-y": {"range": "uint32"}}
  cwsdk-zone-coordinate-components:
    class_uri: "pixlnd:cwsdk-zone-coordinate-components"
    description: "Third-party SDK in-memory IntVector2 global-zone key: signed C++ int components, portable width unestablished. Floor/mod conversions use 65536 dots/block and 64 blocks/zone; separate mapchunks use 20 blocks. Integer projection deliberately has no int32 bounds. Not a discovery/save wire or original-client authentication."
    see_also: ["https://api.github.com/repos/coremaze/CWSDK/git/blobs/be8891283cfa0d7676146f19d8e713f5a9650107", "https://api.github.com/repos/coremaze/CWSDK/git/blobs/420c24ff97a594f1e8f8f60aa7baf7929b0161d6", "https://api.github.com/repos/coremaze/CWSDK/git/blobs/a16689bfc90217d4059247de313c17b52b0d7591", "https://api.github.com/repos/coremaze/CWSDK/git/blobs/0b067c6515df7fe38b8ad24993933509cf9a3cfc", "https://api.github.com/repos/coremaze/CWSDK/git/blobs/97fc2a0ac21c0585186805fd7a1227cd827124d8"]
    is_a: "zone-coordinate"
  dropped-item:
    class_uri: "pixlnd:dropped-item"
    description: "Logical ground-item components, not a complete historical packet or save body. Item remains a nominal reference, not an inlined payload. Rotation and scale are known f32 scalars; no degrees, frame, positivity or uniform-scale semantics selected. Drop-time is an integer component with source-specific signedness below, not established age, epoch, world-clock time or unit. Berld yaw-copy and outgoing 500/stored 0 paired with a configured 500ms asynchronous sleep establish no measured delay or universal timer meaning."
    see_also: ["../domain/3_Classes.md#zone", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L441-L450", "https://github.com/LastExceed/berld/blob/f5d3886ce06cde28cc66932f23eea85a05149bc7/protocol/src/packet/world_update/loot.rs"]
    attributes:
      item: {"alias": "item", "domain": "dropped-item", "slot_uri": "pixlnd:dropped-item/item", "range": "item", "required": true, "description": "Nominal Item reference only; complete-wire Item admission is later work."}
      pos: {"alias": "pos", "domain": "dropped-item", "slot_uri": "pixlnd:dropped-item/pos", "range": "int64", "required": true, "description": "Qualified historical signed native-position triple; active coordinate encoding/frame not selected.", "multivalued": true, "minimum_cardinality": 3, "maximum_cardinality": 3}
      rotation: {"alias": "rotation", "domain": "dropped-item", "slot_uri": "pixlnd:dropped-item/rotation", "range": "float", "required": true, "description": "Source f32 scalar; angular units and frame unestablished."}
      scale: {"alias": "scale", "domain": "dropped-item", "slot_uri": "pixlnd:dropped-item/scale", "range": "float", "required": true, "description": "Source f32 scalar; no positivity or uniform-transform interpretation imposed."}
      drop-time: {"alias": "drop-time", "domain": "dropped-item", "slot_uri": "pixlnd:dropped-item/drop-time", "range": "integer", "required": true, "description": "Known timer component only; source signedness differs, unit and clock meaning unestablished."}
  cuwo-dropped-item-components:
    class_uri: "pixlnd:cuwo-dropped-item-components"
    description: "Qualified third-party ground-item component projection; drop-time uses uint32. Not a full ground-item wire, ABI, active/save encoding or Item-body contract."
    see_also: ["../domain/3_Classes.md#zone", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L441-L450"]
    is_a: "dropped-item"
    slot_usage: {"drop-time": {"range": "uint32"}}
  berld-dropped-item-components:
    class_uri: "pixlnd:berld-dropped-item-components"
    description: "Qualified third-party ground-item component projection; drop-time uses int32. Not a full ground-item wire, ABI, active/save encoding or Item-body contract."
    see_also: ["../domain/3_Classes.md#zone", "https://github.com/LastExceed/berld/blob/f5d3886ce06cde28cc66932f23eea85a05149bc7/protocol/src/packet/world_update/loot.rs"]
    is_a: "dropped-item"
    slot_usage: {"drop-time": {"range": "int32"}}
  berld-static-size-components:
    class_uri: "pixlnd:berld-static-size-components"
    description: "Named f32 Hitbox components used by berld WorldObject.size, not cuwo vec3 storage or a portable native ABI."
    see_also: ["https://github.com/LastExceed/berld/blob/f5d3886ce06cde28cc66932f23eea85a05149bc7/protocol/src/packet/common.rs#L190-L197"]
    attributes:
      width: {"alias": "width", "domain": "berld-static-size-components", "slot_uri": "pixlnd:berld-static-size-components/width", "range": "float", "required": true, "description": "Source f32 width component; no active/save size format selected."}
      depth: {"alias": "depth", "domain": "berld-static-size-components", "slot_uri": "pixlnd:berld-static-size-components/depth", "range": "float", "required": true, "description": "Source f32 depth component; no active/save size format selected."}
      height: {"alias": "height", "domain": "berld-static-size-components", "slot_uri": "pixlnd:berld-static-size-components/height", "range": "float", "required": true, "description": "Source f32 height component; no active/save size format selected."}
  cuwo-static-header-components:
    class_uri: "pixlnd:cuwo-static-header-components"
    description: "Third-party static header component projection only, excluding padding and packet envelope. Not the complete logical static-entity family: the cuwo static struct additionally contains Item/list/opaque state. Source signedness, Boolean use and occupant identity remain distinct; native-memory generic codecs do not establish a portable ABI or authenticated original-client semantics."
    see_also: ["../domain/3_Classes.md#static-entity", "../instances/static-entities.json", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L260-L271", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/static.py", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/world.py#L135-L182"]
    attributes:
      entity-type: {"alias": "entity-type", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/entity-type", "range": "uint32", "required": true, "description": "Source u32 type storage, not catalog membership or source identity reconciliation."}
      pos: {"alias": "pos", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/pos", "range": "int64", "required": true, "description": "Source signed i64 native-position triple; not selected hybrid/save encoding.", "multivalued": true, "minimum_cardinality": 3, "maximum_cardinality": 3}
      orientation: {"alias": "orientation", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/orientation", "range": "uint32", "required": true, "description": "Source storage component only; logical cardinal orientation remains 0..3, not yaw degrees. No portable ABI inferred."}
      size: {"alias": "size", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/size", "range": "float", "required": true, "description": "Source f32 triple; size frame/units and relation to drop scale not inferred.", "multivalued": true, "minimum_cardinality": 3, "maximum_cardinality": 3}
      closed: {"alias": "closed", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/closed", "range": "u8", "required": true, "description": "Source u8 storage with separate Boolean use; not a universal byte sentinel contract."}
      time-offset: {"alias": "time-offset", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/time-offset", "range": "uint32", "required": true, "description": "Source u32; cuwo local capped elapsed-loop seconds times 1000 is distinct from accelerated calendar time."}
      something8: {"alias": "something8", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/something8", "range": "uint32", "required": true, "description": "Opaque source integer component; meaning remains unknown."}
      user-id: {"alias": "user-id", "domain": "cuwo-static-header-components", "slot_uri": "pixlnd:cuwo-static-header-components/user-id", "range": "integer", "required": true, "description": "Source u64 occupant component; no universal empty sentinel or identity conversion selected.", "minimum_value": 0, "maximum_value": 18446744073709551615}
  cuwo-item-with-header-components:
    class_uri: "pixlnd:cuwo-item-with-header-components"
    description: "Third-party ItemWithHeader component projection. The item is a nominal Item reference, not an inlined or complete Item payload; header meaning is unspecified. Not a portable ABI or authenticated client contract."
    see_also: ["https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L222-L235"]
    attributes:
      header: {alias: "header", domain: "cuwo-item-with-header-components", slot_uri: "pixlnd:cuwo-item-with-header-components/header", range: "uint32", required: true, description: "Source u32 component; meaning remains unspecified."}
      item: {alias: "item", domain: "cuwo-item-with-header-components", slot_uri: "pixlnd:cuwo-item-with-header-components/item", range: "item", required: true, description: "Nominal Item reference only; full Item internals are not included."}
  cuwo-item-with-header-list-components:
    class_uri: "pixlnd:cuwo-item-with-header-list-components"
    description: "Third-party ItemWithHeaderList vector projection; element payloads retain nominal Item references. Container capacity/storage details are not a portable sequence encoding."
    see_also: ["https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L234-L246"]
    attributes:
      items: {alias: "items", domain: "cuwo-item-with-header-list-components", slot_uri: "pixlnd:cuwo-item-with-header-list-components/items", range: "cuwo-item-with-header-components", required: true, multivalued: true, inlined: true, inlined_as_list: true, description: "Known vector of ItemWithHeader component entries; no fixed length selected."}
  cuwo-item-with-header-lists-components:
    class_uri: "pixlnd:cuwo-item-with-header-lists-components"
    description: "Third-party ItemWithHeaderLists vector projection, separate from one ItemWithHeaderList. Container capacity/storage details are not a portable sequence encoding."
    see_also: ["https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L247-L259"]
    attributes:
      lists: {alias: "lists", domain: "cuwo-item-with-header-lists-components", slot_uri: "pixlnd:cuwo-item-with-header-lists-components/lists", range: "cuwo-item-with-header-list-components", required: true, multivalued: true, inlined: true, inlined_as_list: true, description: "Known vector of ItemWithHeaderList component entries; no fixed length selected."}
  cuwo-static-entity-components:
    class_uri: "pixlnd:cuwo-static-entity-components"
    description: "Third-party StaticEntity outer composition projection: header, nested item-header lists, nominal Item and seven source-declared u32 components. The unnamed components retain source names and have no inferred meanings. This is not a complete portable ABI, packet, save contract or authenticated client behavior."
    see_also: ["../domain/3_Classes.md#static-entity", "../instances/static-entities.json", "https://github.com/matpow2/cuwo/blob/240bb61ec42abb10a73d750ce72f243e04e55509/cuwo/tgen_wrap.pxd#L260-L292"]
    attributes:
      header: {alias: "header", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/header", range: "cuwo-static-header-components", required: true, inlined: true, description: "Nested source static-header component projection."}
      item-with-header-lists: {alias: "item-with-header-lists", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/item-with-header-lists", range: "cuwo-item-with-header-lists-components", required: true, inlined: true, description: "Nested source vector-of-lists component projection."}
      item: {alias: "item", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/item", range: "item", required: true, description: "Nominal Item reference only; full Item internals are not included."}
      something1: {alias: "something1", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something1", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
      something2: {alias: "something2", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something2", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
      something3: {alias: "something3", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something3", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
      something4: {alias: "something4", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something4", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
      something5: {alias: "something5", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something5", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
      something6: {alias: "something6", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something6", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
      something7: {alias: "something7", domain: "cuwo-static-entity-components", slot_uri: "pixlnd:cuwo-static-entity-components/something7", range: "uint32", required: true, description: "Source-declared u32 component; meaning remains unknown."}
  berld-static-header-components:
    class_uri: "pixlnd:berld-static-header-components"
    description: "Third-party static header component projection only, excluding padding and packet envelope. Not the complete logical static-entity family: the cuwo static struct additionally contains Item/list/opaque state. Source signedness, Boolean use and occupant identity remain distinct; native-memory generic codecs do not establish a portable ABI or authenticated original-client semantics."
    see_also: ["../domain/3_Classes.md#static-entity", "../instances/static-entities.json", "https://github.com/LastExceed/berld/blob/f5d3886ce06cde28cc66932f23eea85a05149bc7/protocol/src/packet/world_update.rs#L119-L135", "https://github.com/LastExceed/berld/blob/f5d3886ce06cde28cc66932f23eea85a05149bc7/protocol/src/packet/world_update/world_object.rs", "https://github.com/LastExceed/berld/blob/f5d3886ce06cde28cc66932f23eea85a05149bc7/protocol/src/packet/common.rs#L10"]
    attributes:
      kind: {"alias": "kind", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/kind", "range": "int32", "required": true, "description": "Source repr(i32) enum storage only; this component projection does not enforce Kind enum membership."}
      position: {"alias": "position", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/position", "range": "int64", "required": true, "description": "Source signed i64 native-position triple; not selected hybrid/save encoding.", "multivalued": true, "minimum_cardinality": 3, "maximum_cardinality": 3}
      orientation: {"alias": "orientation", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/orientation", "range": "i8", "required": true, "description": "Source storage component only; logical cardinal orientation remains 0..3, not yaw degrees. No portable ABI inferred."}
      size: {"alias": "size", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/size", "range": "berld-static-size-components", "required": true, "description": "Named source Hitbox width/depth/height f32 components, not a cuwo vec3 or selected active/save format.", "inlined": true}
      is-closed: {"alias": "is-closed", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/is-closed", "range": "boolean", "required": true, "description": "Source Boolean component, distinct from occupant/interactor identity."}
      transform-time: {"alias": "transform-time", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/transform-time", "range": "int32", "required": true, "description": "Source i32 transform component; no universal clock/unit selected."}
      unknown-b: {"alias": "unknown-b", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/unknown-b", "range": "int32", "required": true, "description": "Opaque source integer component; meaning remains unknown."}
      interactor: {"alias": "interactor", "domain": "berld-static-header-components", "slot_uri": "pixlnd:berld-static-header-components/interactor", "range": "int64", "required": true, "description": "Source signed i64 CreatureId component; no universal empty sentinel selected."}
  deposit-ingredient-yield:
    class_uri: pixlnd:deposit-ingredient-yield
    description: "Deposit-scoped logical ingredient yield interval, not an emitted quantity or distribution. The inherited ingredient reference and required minimum/maximum describe the fixed 1–3 interval. Raw deposit catalog yields remain ingredient strings; reference existence and midnight renewal remain separate."
    see_also: ["../domain/3_Classes.md#deposit", "../schema/associations.yaml#ingredient-yield", "../schema/world-catalog.yaml#deposit-yields"]
    is_a: ingredient-yield
    slot_usage:
      ingredient-yield-minimum: {equals_number: 1}
      ingredient-yield-maximum: {equals_number: 3}
