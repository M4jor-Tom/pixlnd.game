id: https://w3id.org/pixlnd/save-content/saved-props-traps
name: pixlnd-save-content-saved-props-traps
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
default_range: string
classes:
  saved-rubble:
    class_uri: pixlnd:saved-rubble
    see_also: &id001
    - ../domain/encounter-contracts.md#boss-specials-and-breakable-rubble
    slots:
    - saved-rubble-broken
    - saved-rubble-restore-at
    description: Breakable stone state and world-clock restoration deadline.
    rules:
    - postconditions:
        any_of:
        - slot_conditions:
            saved-rubble-broken:
              alias: broken
              equals_expression: 'False'
            saved-rubble-restore-at:
              alias: restore_at
              equals_number: 0
        - slot_conditions:
            saved-rubble-broken:
              alias: broken
              equals_expression: 'True'
            saved-rubble-restore-at:
              alias: restore_at
              minimum_value: 0
              none_of:
              - equals_number: 0
  saved-prop:
    class_uri: pixlnd:saved-prop
    see_also: &id002
    - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
    slots:
    - saved-prop-hp
    description: Remaining furnishing health.
  saved-trap:
    class_uri: pixlnd:saved-trap
    see_also: &id003
    - ../domain/encounter-contracts.md#spike-traps-and-furnishing-contents
    slots:
    - saved-trap-phase
    - saved-trap-left
    - saved-trap-hit
    description: Persisted spike phase, remaining time and identities already hit in the activation.
    rules:
    - preconditions:
        slot_conditions:
          saved-trap-phase:
            alias: phase
            equals_string_in:
            - idle
            - warning
      postconditions:
        slot_conditions:
          saved-trap-hit:
            alias: hit
            maximum_cardinality: 0
slots:
  saved-rubble-broken:
    slot_uri: pixlnd:saved-rubble/broken
    alias: broken
    domain: saved-rubble
    range: boolean
    required: true
    see_also: *id001
    description: Broken of the saved rubble.
  saved-rubble-restore-at:
    slot_uri: pixlnd:saved-rubble/restore_at
    alias: restore_at
    domain: saved-rubble
    range: double
    required: true
    see_also: *id001
    minimum_value: 0
    description: Restore at of the saved rubble.
  saved-prop-hp:
    slot_uri: pixlnd:saved-prop/hp
    alias: hp
    domain: saved-prop
    range: double
    required: true
    see_also: *id002
    minimum_value: 0
    description: Hp of the saved prop.
  saved-trap-phase:
    slot_uri: pixlnd:saved-trap/phase
    alias: phase
    domain: saved-trap
    range: trap-phase
    required: true
    see_also: *id003
    description: Phase of the saved trap.
  saved-trap-left:
    slot_uri: pixlnd:saved-trap/left
    alias: left
    domain: saved-trap
    range: double
    required: true
    see_also: *id003
    minimum_value: 0
    description: Left of the saved trap.
  saved-trap-hit:
    slot_uri: pixlnd:saved-trap/hit
    alias: hit
    domain: saved-trap
    range: string
    required: true
    see_also: *id003
    multivalued: true
    list_elements_unique: true
    description: Hit of the saved trap.
    pattern: ^[\s\S]+$
enums:
  trap-phase:
    enum_uri: pixlnd:trap-phase
    permissible_values:
      idle: {}
      warning: {}
      active: {}
      cooldown: {}
    description: Trap phase codes of persisted state.
