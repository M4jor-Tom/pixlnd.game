id: https://w3id.org/pixlnd/entities/entity
name: pixlnd-entities-entity
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- identity
- relations
- entities-appearance
- entities-entity-body
- entities-entity-vitals
default_range: string
classes:
  entity:
    description: "Logical entity definition; applicability follows the cited domain rules."
    class_uri: pixlnd:entity
    see_also: &id001
    - ../domain/3_Classes.md#entity
    slots:
    - id
    - entity-hostility
    - entity-species
    - entity-level
    - entity-xp
    - entity-power-base
    - entity-appearance
    - entity-mana-cubes
    - entity-skills
    - entity-parent-owner
    - entity-pos
    - entity-velocity
    - entity-accel
    - entity-body-roll
    - entity-body-pitch
    - entity-body-yaw
    - entity-class
    - entity-specialization
    - entity-hp
    - entity-mp
    - entity-stamina
    - entity-block-power
    - entity-stealth
    - entity-hp-multiplier
    - entity-damage-multiplier
    - entity-armor-multiplier
    - entity-resi-multiplier
    - entity-hit-counter
    - entity-last-hit-time
    - entity-stun-time
    - entity-slowed-time
    - entity-blue-time
    - entity-speed-up-time
    - entity-flags
    - entity-equipment
    - entity-name
    - entity-status-applications
    - equips
    - threat
    - current-target
  race-or-creature:
    class_uri: pixlnd:race-or-creature
    see_also:
    - ../domain/3_Classes.md#entity
    slots:
    - id
    union_of:
    - race
    - creature
    description: Species definition reference to race or creature.
slots:
  entity-hostility:
    description: "Entity hostility property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/hostility
    alias: hostility
    range: hostility
    required: true
    inlined: false
    see_also: *id001
  entity-species:
    description: "Entity species property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/species
    alias: species
    range: race-or-creature
    required: true
    inlined: false
    see_also: *id001
  entity-level:
    description: "Entity level property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/level
    alias: level
    range: integer
    required: true
    inlined: false
    see_also: *id001
  entity-xp:
    description: "Entity xp property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/xp
    alias: xp
    range: integer
    required: true
    inlined: false
    see_also: *id001
  entity-power-base:
    description: "Entity power base property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/power-base
    alias: power-base
    range: u8
    required: true
    inlined: false
    see_also: *id001
  entity-appearance:
    description: "Entity appearance property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/appearance
    alias: appearance
    range: appearance
    required: true
    inlined: true
    see_also: *id001
  entity-mana-cubes:
    description: "Entity mana cubes property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/mana-cubes
    alias: mana-cubes
    range: uint32
    required: true
    inlined: false
    see_also: *id001
  entity-skills:
    description: "Entity skills property; interpreted under its owning definition."
    slot_uri: pixlnd:entity/skills
    alias: skills
    range: uint32
    required: true
    multivalued: true
    minimum_cardinality: 11
    maximum_cardinality: 11
    see_also: *id001
  entity-parent-owner:
    slot_uri: pixlnd:entity/parent-owner
    alias: parent-owner
    range: entity
    description: Applies to pets, clones and bombs; owner-reference identity is distinct from species
      identity.
    see_also: *id001
