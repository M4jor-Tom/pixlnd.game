id: https://w3id.org/pixlnd/combat
name: pixlnd-combat
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- identity
- relations
- associations
- meta
- catalog-identity-combat
default_range: string
classes:
  resource:
    description: "Logical resource definition; applicability follows the cited domain rules."
    class_uri: pixlnd:resource
    see_also:
    - ../domain/3_Classes.md#resource
    attributes:
      name: {alias: name, slot_uri: "pixlnd:resource/name", range: string, description: "Display name for this definition."}
      range: {alias: range, slot_uri: "pixlnd:resource/range", range: double, description: "Described resource interval; no default amount.", multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2}
      gain: {alias: gain, slot_uri: "pixlnd:resource/gain", range: string, description: "Resource acquisition description."}
      spend: {alias: spend, slot_uri: "pixlnd:resource/spend", range: string, description: "Resource consumption description."}
      regen: {alias: regen, slot_uri: "pixlnd:resource/regen", range: string, description: "Resource regeneration description."}
    slots:
    - id
  stat:
    description: "Logical stat definition; applicability follows the cited domain rules."
    class_uri: pixlnd:stat
    see_also:
    - ../domain/3_Classes.md#stat
    attributes:
      name: {alias: name, slot_uri: "pixlnd:stat/name", range: string, description: "Display name for this definition."}
      source: {alias: source, slot_uri: "pixlnd:stat/source", range: string, description: "Contributors to the derived stat.", multivalued: true}
      formula: {alias: formula, slot_uri: "pixlnd:stat/formula", range: string, description: "Qualified formula text; structural typing does not execute it."}
      effect: {alias: effect, slot_uri: "pixlnd:stat/effect", range: string, description: "Meaning of the derived quantity."}
    slots:
    - id
  ability:
    description: "Logical ability definition; applicability follows the cited domain rules."
    class_uri: pixlnd:ability
    see_also: &id001
    - ../domain/3_Classes.md#ability
    attributes:
      name: {alias: name, slot_uri: "pixlnd:ability/name", range: string, description: "Ability display name."}
      owner: {alias: owner, slot_uri: "pixlnd:ability/owner", description: "Class, specialization or all-owner applicability.", any_of: [{range: specialization-or-character-class}, {range: string, equals_string: all}]}
      cost-records: {alias: cost-records, slot_uri: "pixlnd:ability/cost-records", range: resource-cost, description: "Logical amounts per resource and ruleset, not normalized historical prose.", multivalued: true, inlined: true, inlined_as_list: true}
      cooldown-s: {alias: cooldown-s, slot_uri: "pixlnd:ability/cooldown-s", range: double, description: "Selected numeric cooldown, distinct from qualified source timing text.", minimum_value: 0}
      duration-s: {alias: duration-s, slot_uri: "pixlnd:ability/duration-s", range: double, description: "Selected numeric duration, distinct from qualified source timing text.", minimum_value: 0}
      effect: {alias: effect, slot_uri: "pixlnd:ability/effect", range: string, description: "Effect summary; behavior and historical qualifications remain source-linked."}
      versions: {alias: versions, slot_uri: "pixlnd:ability/versions", range: SourceVersion, description: "Explicit source versions, not feature activation.", multivalued: true}
    slots:
    - id
    - ability-kind
    - ability-alpha-tree
    - ability-alpha-ability-id
    - ability-_controls
    - unlocks-next
    - applies
  weapon-type:
    description: "Logical weapon type definition; applicability follows the cited domain rules."
    class_uri: pixlnd:weapon-type
    see_also: &id002
    - ../domain/3_Classes.md#weapon-type
    attributes:
      name: {alias: name, slot_uri: "pixlnd:weapon-type/name", range: string, description: "Weapon family display name."}
      material: {alias: material, slot_uri: "pixlnd:weapon-type/material", range: material, description: "Resolved material references, not parsed source alternatives.", multivalued: true}
      m1: {alias: m1, slot_uri: "pixlnd:weapon-type/m1", range: string, description: "Basic-attack summary; not a physical binding."}
      m2: {alias: m2, slot_uri: "pixlnd:weapon-type/m2", range: string, description: "Special-attack summary; not a physical binding."}
    slots:
    - id
    - weapon-type-class
    - weapon-type-hands
    - weapon-type-damage-k
    - weapon-type-cube-capacity
    - weapon-type-combo-cap
  status-effect:
    description: "Logical status effect definition; applicability follows the cited domain rules."
    class_uri: pixlnd:status-effect
    see_also:
    - ../domain/3_Classes.md#status-effect
    attributes:
      name: {alias: name, slot_uri: "pixlnd:status-effect/name", range: string, description: "Display name for this definition."}
      kind: {alias: kind, slot_uri: "pixlnd:status-effect/kind", range: SourceStatusKind, description: "Source-qualified effect category."}
      visual: {alias: visual, slot_uri: "pixlnd:status-effect/visual", range: string, description: "Visible effect description."}
      effect: {alias: effect, slot_uri: "pixlnd:status-effect/effect", range: string, description: "Effect summary, not executable rules."}
      duration-s: {alias: duration-s, slot_uri: "pixlnd:status-effect/duration-s", range: double, description: "Duration where specified.", minimum_value: 0}
    slots:
    - id
  mob-strength-tier:
    description: "Logical mob strength tier definition; applicability follows the cited domain rules."
    class_uri: pixlnd:mob-strength-tier
    see_also:
    - ../domain/3_Classes.md#mob-strength-tier
    attributes:
      name: {alias: name, slot_uri: "pixlnd:mob-strength-tier/name", range: string, description: "Display name for this definition."}
      rarity: {alias: rarity, slot_uri: "pixlnd:mob-strength-tier/rarity", range: rarity, description: "Comparison rarity reference."}
      hp-range: {alias: hp-range, slot_uri: "pixlnd:mob-strength-tier/hp-range", range: double, description: "Source example HP interval, not a universal generated bound.", multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2}
    slots:
    - id
  ability-tree-position:
    class_uri: pixlnd:ability-tree-position
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
    slots:
    - ability-tree-column
    - ability-tree-needs
    - ability-tree-rank
    - ability-tree-skill-slot
    - ability-tree-class
    - ability-tree-also-ultimate
    description: Tree placement, not an extra ultimate for the Assassin's shared rank-3 skill.
slots:
  ability-alpha-tree:
    description: "Ability alpha tree property; interpreted under its owning definition."
    slot_uri: pixlnd:ability/alpha-tree
    alias: alpha-tree
    domain: ability
    range: ability-tree-position
    inlined: true
    see_also:
    - ../domain/3_Classes.md#ability
  ability-tree-column:
    description: "Ability tree column property; interpreted under its owning definition."
    slot_uri: pixlnd:ability-tree-position/column
    alias: column
    range: skill-column
    required: true
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
  ability-tree-needs:
    description: "Ability tree needs property; interpreted under its owning definition."
    slot_uri: pixlnd:ability-tree-position/needs
    alias: needs
    range: integer
    required: true
    minimum_value: 0
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
  ability-tree-rank:
    description: "Ability tree rank property; interpreted under its owning definition."
    slot_uri: pixlnd:ability-tree-position/rank
    alias: rank
    range: integer
    minimum_value: 1
    maximum_value: 3
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
  ability-tree-skill-slot:
    description: "Ability tree skill slot property; interpreted under its owning definition."
    slot_uri: pixlnd:ability-tree-position/skill-slot
    alias: skill-slot
    range: integer
    minimum_value: 0
    maximum_value: 10
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
  ability-tree-class:
    description: "Ability tree class property; interpreted under its owning definition."
    slot_uri: pixlnd:ability-tree-position/class
    alias: class
    range: character-class
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
  ability-tree-also-ultimate:
    description: "Ability tree also ultimate property; interpreted under its owning definition."
    slot_uri: pixlnd:ability-tree-position/also-ultimate
    alias: also-ultimate
    range: boolean
    see_also:
    - ../domain/3_Classes.md#skill-tree-a
  ability-kind:
    description: "Ability kind property; interpreted under its owning definition."
    slot_uri: pixlnd:ability/kind
    alias: kind
    range: ability-kind
    required: true
    see_also: *id001
  ability-alpha-ability-id:
    description: "Ability alpha ability id property; interpreted under its owning definition."
    slot_uri: pixlnd:ability/alpha-ability-id
    alias: alpha-ability-id
    range: integer
    see_also: *id001
  ability-_controls:
    description: "Ability _controls property; interpreted under its owning definition."
    slot_uri: pixlnd:ability/_controls
    alias: _controls
    range: control-action
    multivalued: true
    see_also: *id001
  weapon-type-class:
    description: "Weapon type class property; interpreted under its owning definition."
    slot_uri: pixlnd:weapon-type/class
    alias: class
    range: character-class
    required: true
    see_also: *id002
  weapon-type-hands:
    description: "Weapon type hands property; interpreted under its owning definition."
    slot_uri: pixlnd:weapon-type/hands
    alias: hands
    range: hands
    required: true
    see_also: *id002
  weapon-type-damage-k:
    description: "Weapon type damage k property; interpreted under its owning definition."
    slot_uri: pixlnd:weapon-type/damage-k
    alias: damage-k
    range: float
    required: true
    see_also: *id002
  weapon-type-cube-capacity:
    description: "Weapon type cube capacity property; interpreted under its owning definition."
    slot_uri: pixlnd:weapon-type/cube-capacity
    alias: cube-capacity
    range: integer
    required: true
    see_also: *id002
  weapon-type-combo-cap:
    description: "Weapon type combo cap property; interpreted under its owning definition."
    slot_uri: pixlnd:weapon-type/combo-cap
    alias: combo-cap
    range: integer
    required: true
    see_also: *id002
  unlocks-next:
    slot_uri: pixlnd:unlocks-next
    alias: unlocks-next
    range: ability
    domain: ability
    description: 'Cardinality 1→0..1. skill tree: 5 points'
    see_also:
    - ../domain/4_Relations.md
  applies:
    slot_uri: pixlnd:applies
    alias: applies
    range: status-effect
    multivalued: true
    domain: ability-or-weapon-type-or-hazard
    description: Cardinality n→n.
    see_also:
    - ../domain/4_Relations.md
enums:
  skill-column:
    description: "Skill column vocabulary."
    enum_uri: pixlnd:skill-column
    permissible_values:
      pets: {}
      climbing: {}
      water: {}
      class: {}
      ultimate: {}
  ability-kind:
    description: "Ability kind vocabulary."
    enum_uri: pixlnd:ability-kind
    permissible_values:
      active: {}
      passive: {}
      shared-passive: {}
      movement: {}
  hands:
    description: "Hands vocabulary."
    enum_uri: pixlnd:hands
    permissible_values:
      1h-dual: {}
      1h-with-shield: {}
      2h: {}
      offhand: {}
