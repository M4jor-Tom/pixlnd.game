        range: string
      dungeon:
        alias: dungeon
        slot_uri: pixlnd:generator-source-names/dungeon
        description: Source dungeon of generator-source-names.
        required: true
        range: string
      realm:
        alias: realm
        slot_uri: pixlnd:generator-source-names/realm
        description: Source realm of generator-source-names.
        required: true
        range: string
      item:
        alias: item
        slot_uri: pixlnd:generator-source-names/item
        description: Source item of generator-source-names.
        required: true
        range: string
      quarter:
        alias: quarter
        slot_uri: pixlnd:generator-source-names/quarter
        description: Source quarter of generator-source-names.
        required: true
        range: string
        multivalued: true
        minimum_cardinality: 0
      uniqueness:
        alias: uniqueness
        slot_uri: pixlnd:generator-source-names/uniqueness
        description: Source uniqueness of generator-source-names.
        required: true
        range: boolean
      examples:
        alias: examples
