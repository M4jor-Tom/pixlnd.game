id: https://w3id.org/pixlnd/catalog-crafting-social
name: pixlnd-catalog-crafting-social
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- entities
- identity
- items
default_range: string
classes:
  ingredient-refinement:
    class_uri: pixlnd:ingredient-refinement
    see_also:
    - ../domain/4_Relations.md
    - ../instances/ingredients.json
    slots:
    - ingredient-refinement-target
    - ingredient-refinement-process
    description: Container-keyed target and exact process text from the compact refines-to map; not a parsed recipe.
  npc-roles-source:
    description: "Source representation of npc-roles-source."
    class_uri: pixlnd:npc-roles-source
    annotations: {source-map-entries: entries}
    see_also: [../instances/npc-roles.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:npc-roles-source/schema, range: string, required: true, equals_string: npc-role, description: "The $schema field of npc-roles-source."}
      dialogue-corpus: {alias: dialogue-corpus, slot_uri: pixlnd:npc-roles-source/dialogue-corpus, range: npc-dialogue-corpus-source, required: true, inlined: true, description: "Dialogue reference corpus, separate from keyed NPC role rows."}
      entries: {alias: entries, slot_uri: pixlnd:npc-roles-source/entries, range: npc-role-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "The entries field of npc-roles-source."}
  npc-role-source-entry:
    description: "Source representation of npc-role-source-entry."
    slots: [recipe-map-key]
    attributes:
      value: {alias: value, slot_uri: pixlnd:npc-role-source-entry/value, range: npc-role-source-row, required: true, inlined: true, description: "The value field of npc-role-source-entry."}
  npc-role-source-row:
    description: "Source representation of npc-role-source-row."
    attributes:
      name: {alias: name, slot_uri: pixlnd:npc-role-source-row/name, range: string, required: true, description: "The name field of npc-role-source-row."}
      building: {alias: building, slot_uri: pixlnd:npc-role-source-row/building, range: string, description: "The building field of npc-role-source-row."}
      service: {alias: service, slot_uri: pixlnd:npc-role-source-row/service, range: string, description: "The service field of npc-role-source-row."}
      schedule: {alias: schedule, slot_uri: pixlnd:npc-role-source-row/schedule, range: string, description: "The schedule field of npc-role-source-row."}
      attackable: {alias: attackable, slot_uri: pixlnd:npc-role-source-row/attackable, range: string, description: "The attackable field of npc-role-source-row."}
      behaviour: {alias: behaviour, slot_uri: pixlnd:npc-role-source-row/behaviour, range: string, description: "The behaviour field of npc-role-source-row."}
      species: {alias: species, slot_uri: pixlnd:npc-role-source-row/species, range: string, description: "The species field of npc-role-source-row."}
      sign: {alias: sign, slot_uri: pixlnd:npc-role-source-row/sign, range: string, description: "The sign field of npc-role-source-row."}
      note: {alias: note, slot_uri: pixlnd:npc-role-source-row/note, range: string, description: "The note field of npc-role-source-row."}
      versions: {alias: versions, slot_uri: pixlnd:npc-role-source-row/versions, range: string, multivalued: true, description: "The versions field of npc-role-source-row."}
      dialogue: {alias: dialogue, slot_uri: pixlnd:npc-role-source-row/dialogue, range: string, multivalued: true, description: "The dialogue field of npc-role-source-row."}
  npc-dialogue-corpus-source:
    description: "Source representation of npc-dialogue-corpus-source."
    attributes:
      known-lines: {alias: known-lines, slot_uri: pixlnd:npc-dialogue-corpus-source/known-lines, range: string, required: true, multivalued: true, description: "The known-lines field of npc-dialogue-corpus-source."}
      mechanics: {alias: mechanics, slot_uri: pixlnd:npc-dialogue-corpus-source/mechanics, range: string, required: true, multivalued: true, description: "The mechanics field of npc-dialogue-corpus-source."}
slots:
  ingredient-kind:
    description: "The kind property of ingredient."
    slot_uri: pixlnd:ingredient/kind
    alias: kind
    domain: ingredient
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#ingredient
    - ../instances/ingredients.json
  ingredient-from:
    slot_uri: pixlnd:ingredient/from
    alias: from
    domain: ingredient
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#ingredient
    - ../instances/ingredients.json
    description: Exact qualified source description, not a resolved source reference.
  ingredient-sell:
    description: "The sell property of ingredient."
    slot_uri: pixlnd:ingredient/sell
    alias: sell
    domain: ingredient
    range: integer
    required: false
    see_also:
    - ../domain/3_Classes.md#ingredient
    - ../instances/ingredients.json
  ingredient-recipe:
    slot_uri: pixlnd:ingredient/recipe
    alias: recipe
    domain: ingredient
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#ingredient
    - ../instances/ingredients.json
    description: Exact preparation text, not an executable recipe or station reference.
  ingredient-refines-to:
    description: "The refines-to property of ingredient."
    slot_uri: pixlnd:ingredient/refines-to
    alias: refines-to
    domain: ingredient
    range: ingredient-refinement
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: false
    see_also:
    - ../domain/3_Classes.md#ingredient
    - ../domain/4_Relations.md
    - ../instances/ingredients.json
  ingredient-refinement-target:
    description: "The target property of ingredient-refinement."
    slot_uri: pixlnd:ingredient-refinement/target
    alias: target
    domain: ingredient-refinement
    range: ingredient
    key: true
    required: true
    see_also:
    - ../domain/4_Relations.md
    - ../instances/ingredients.json
  ingredient-refinement-process:
    description: "The process property of ingredient-refinement."
    slot_uri: pixlnd:ingredient-refinement/process
    alias: process
    domain: ingredient-refinement
    range: string
    required: true
    see_also:
    - ../domain/4_Relations.md
    - ../instances/ingredients.json
  material-class:
    slot_uri: pixlnd:material/class
    alias: class
    domain: material
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
    description: Qualified class applicability text, not a resolved class restriction.
  material-station:
    slot_uri: pixlnd:material/station
    alias: station
    domain: material
    required: false
    any_of:
    - range: crafting-station
    - range: string
      equals_string: none
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
    description: Station reference or the exact literal none; not null or a fabricated station identity.
  material-raw:
    slot_uri: pixlnd:material/raw
    alias: raw
    domain: material
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
    description: Exact qualified raw-material text; ingredient resolution is not asserted.
  material-alt-name:
    description: "The alt-name property of material."
    slot_uri: pixlnd:material/alt-name
    alias: alt-name
    domain: material
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
  material-effect:
    description: "The effect property of material."
    slot_uri: pixlnd:material/effect
    alias: effect
    domain: material
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
  material-price-s:
    description: "The price-s property of material."
    slot_uri: pixlnd:material/price-s
    alias: price-s
    domain: material
    range: integer
    required: false
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
  material-sell-s:
    description: "The sell-s property of material."
    slot_uri: pixlnd:material/sell-s
    alias: sell-s
    domain: material
    range: integer
    required: false
    see_also:
    - ../domain/3_Classes.md#material
    - ../instances/materials.json
  faction-alignment:
    description: "The alignment property of faction."
    slot_uri: pixlnd:faction/alignment
    alias: alignment
    domain: faction
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#faction
    - ../instances/factions.json
  faction-leader:
    slot_uri: pixlnd:faction/leader
    alias: leader
    domain: faction
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#faction
    - ../instances/factions.json
    description: Exact leader description, not a newly identified entity.
  faction-members:
    slot_uri: pixlnd:faction/members
    alias: members
    domain: faction
    range: creature
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#faction
    - ../instances/factions.json
    description: Species catalog references, not live entity membership enforcement.
  faction-presence:
    description: "The presence property of faction."
    slot_uri: pixlnd:faction/presence
    alias: presence
    domain: faction
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#faction
    - ../instances/factions.json
  npc-role-building:
    slot_uri: pixlnd:npc-role/building
    alias: building
    domain: npc-role
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#npc-role
    - ../instances/npc-roles.json
    description: Qualified building text, with null retained on roaming roles; not a building resolver.
  npc-role-species:
    description: "The species property of npc-role."
    slot_uri: pixlnd:npc-role/species
    alias: species
    domain: npc-role
    range: race-or-creature
    required: false
    see_also:
    - ../domain/3_Classes.md#npc-role
    - ../domain/3_Classes.md#entity
    - ../instances/npc-roles.json
  npc-role-service:
    description: "The service property of npc-role."
    slot_uri: pixlnd:npc-role/service
    alias: service
    domain: npc-role
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#npc-role
    - ../instances/npc-roles.json
  npc-role-schedule:
    description: "The schedule property of npc-role."
    slot_uri: pixlnd:npc-role/schedule
    alias: schedule
    domain: npc-role
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#npc-role
    - ../instances/npc-roles.json
  npc-role-attackable:
    slot_uri: pixlnd:npc-role/attackable
    alias: attackable
    domain: npc-role
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#npc-role
    - ../instances/npc-roles.json
    description: Exact conditional text, not a Boolean attack permission.
  npc-role-behaviour:
    description: "The behaviour property of npc-role."
    slot_uri: pixlnd:npc-role/behaviour
    alias: behaviour
    domain: npc-role
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#npc-role
    - ../instances/npc-roles.json
