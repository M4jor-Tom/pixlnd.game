  material-regen-bonus:
    description: "Material regen bonus property; interpreted under its owning definition."
    slot_uri: pixlnd:material/regen-bonus
    alias: regen-bonus
    domain: material
    range: double
    required: false
    see_also: *id007
  material-refined:
    description: "Material refined property; interpreted under its owning definition."
    slot_uri: pixlnd:material/refined
    alias: refined
    domain: material
    range: ingredient
    required: false
    see_also: *id007
  material-crafts-rarity:
    description: "Material crafts rarity property; interpreted under its owning definition."
    slot_uri: pixlnd:material/crafts-rarity
    alias: crafts-rarity
    domain: material
    range: rarity
    required: false
    see_also: *id007
  material-obtainable:
    description: "Material obtainable property; interpreted under its owning definition."
    slot_uri: pixlnd:material/obtainable
    alias: obtainable
    domain: material
    range: boolean
    required: false
    see_also: *id007
