id: https://w3id.org/pixlnd/catalog-properties/materials
name: pixlnd-catalog-properties-materials
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- items
default_range: string
slots:
  material-name:
    description: "Material name property; interpreted under its owning definition."
    slot_uri: pixlnd:material/name
    alias: name
    domain: material
    range: string
    required: false
    see_also: &id007
    - ../domain/3_Classes.md#material
  material-hp-bonus:
    description: "Material hp bonus property; interpreted under its owning definition."
    slot_uri: pixlnd:material/hp-bonus
    alias: hp-bonus
    domain: material
    range: double
    required: false
    see_also: *id007
  material-armor-mult:
    description: "Material armor mult property; interpreted under its owning definition."
    slot_uri: pixlnd:material/armor-mult
    alias: armor-mult
    domain: material
    range: double
    required: false
    see_also: *id007
  material-resi-mult:
    description: "Material resi mult property; interpreted under its owning definition."
    slot_uri: pixlnd:material/resi-mult
    alias: resi-mult
    domain: material
    range: double
    required: false
    see_also: *id007
  material-crit-bonus:
    description: "Material crit bonus property; interpreted under its owning definition."
    slot_uri: pixlnd:material/crit-bonus
    alias: crit-bonus
    domain: material
    range: double
    required: false
    see_also: *id007
  material-tempo-bonus:
    description: "Material tempo bonus property; interpreted under its owning definition."
    slot_uri: pixlnd:material/tempo-bonus
    alias: tempo-bonus
    domain: material
    range: double
    required: false
