    range: boolean
    required: true
    see_also: *id001
  gear-hp-design-curve-mult:
    slot_uri: pixlnd:gear-hp-design/curve-mult
    alias: curve-mult
    domain: gear-hp-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id002
    minimum_value: 5.0
    maximum_value: 5.0
  gear-hp-design-base:
    slot_uri: pixlnd:gear-hp-design/base
    alias: base
    domain: gear-hp-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id002
    minimum_value: 2.0
    maximum_value: 2.0
  gear-hp-design-upgrade-step:
    slot_uri: pixlnd:gear-hp-design/upgrade-step
    alias: upgrade-step
    domain: gear-hp-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id002
    minimum_value: 0.1
    maximum_value: 0.1
  artifact-design-first:
    slot_uri: pixlnd:artifact-design/first
    alias: first
    domain: artifact-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id003
    minimum_value: 0.05
    maximum_value: 0.05
  artifact-design-z:
    slot_uri: pixlnd:artifact-design/z
    alias: z
    domain: artifact-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id003
    minimum_value: 0
    none_of: [{equals_number: 0}]
  artifact-design-total-bonus:
    slot_uri: pixlnd:artifact-design/total-bonus
    alias: total-bonus
    domain: artifact-design
    description: Configuration field; applicability follows the linked rule.
    range: string
    required: true
    see_also: *id003
  artifact-design-stats:
