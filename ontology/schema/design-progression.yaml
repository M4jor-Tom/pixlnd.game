id: https://w3id.org/pixlnd/design-progression
name: pixlnd-design-progression
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
default_range: string
classes:
  progression-design:
    class_uri: pixlnd:progression-design
    see_also: &id001
    - ../domain/3_Classes.md#level-formula-a
    slots:
    - progression-design-kill-fraction
    - progression-design-gap-per-level
    - progression-design-gap-mult-range
    - progression-design-heal-on-level-up
    description: Current XP configuration; ordered gap range and exact settled progression remain linked
      constraints.
  gear-hp-design:
    class_uri: pixlnd:gear-hp-design
    see_also: &id002
    - ../domain/3_Classes.md#item
    slots:
    - gear-hp-design-curve-mult
    - gear-hp-design-base
    - gear-hp-design-upgrade-step
    description: Selected gear HP coefficients; exact approved values and material/slot agreement remain
      c-gear-hp.
  artifact-design:
    class_uri: pixlnd:artifact-design
    see_also: &id003
    - ../domain/3_Classes.md#artifact
    slots:
    - artifact-design-first
    - artifact-design-z
    - artifact-design-total-bonus
    - artifact-design-stats
    description: Normalized logarithm configuration, not generated artifact instances or a copied executable
      formula. Positive z and the exact approved formula/first value remain c-artifact-stat; no decay/floor
      alternate fields.
