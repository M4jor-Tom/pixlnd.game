slots:
  progression-design-kill-fraction:
    slot_uri: pixlnd:progression-design/kill-fraction
    alias: kill-fraction
    domain: progression-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id001
    minimum_value: 0
    maximum_value: 1
    none_of: [{equals_number: 0}]
  progression-design-gap-per-level:
    slot_uri: pixlnd:progression-design/gap-per-level
    alias: gap-per-level
    domain: progression-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id001
    minimum_value: 0
  progression-design-gap-mult-range:
    slot_uri: pixlnd:progression-design/gap-mult-range
    alias: gap-mult-range
    domain: progression-design
    description: Configuration field; applicability follows the linked rule.
    range: double
    required: true
    see_also: *id001
    multivalued: true
    minimum_cardinality: 2
    maximum_cardinality: 2
    minimum_value: 0
  progression-design-heal-on-level-up:
    slot_uri: pixlnd:progression-design/heal-on-level-up
    alias: heal-on-level-up
