  generator-progression-gap: {"class_uri": "pixlnd:generator-progression-gap", "description": "Configuration component generator-progression-gap; applicability follows the linked source rules.", "see_also": ["../domain/5_Constraints.md#required-inputs", "../domain/6_Generators.md"], "attributes": {"first": {"alias": "first", "slot_uri": "pixlnd:generator-progression-gap/first", "description": "Source first of generator-progression-gap.", "required": true, "range": "double", "minimum_value": 0, "maximum_value": 1}, "second": {"alias": "second", "slot_uri": "pixlnd:generator-progression-gap/second", "description": "Source second of generator-progression-gap.", "required": true, "range": "double", "minimum_value": 1}}}
slots:
  progression-design-kill-fraction:
