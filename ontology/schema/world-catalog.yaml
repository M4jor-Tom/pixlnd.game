id: https://w3id.org/pixlnd/world-catalog
name: pixlnd-world-catalog
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- identity
- items
- structured-world
default_range: string
classes:
  block-type:
    description: "Block type; interpreted under its linked source definition and context."
    class_uri: pixlnd:block-type
    see_also:
    - ../domain/3_Classes.md#block-type
    slots:
    - id
    - block-type-solid
  terrain-feature:
    description: "Terrain feature; interpreted under its linked source definition and context."
    class_uri: pixlnd:terrain-feature
    see_also:
    - ../domain/3_Classes.md#terrain-feature
    slots:
    - id
    - terrain-feature-name
    - terrain-feature-named
  flora:
    description: "Flora; interpreted under its linked source definition and context."
    class_uri: pixlnd:flora
    see_also:
    - ../domain/3_Classes.md#flora
    slots:
    - id
    - flora-name
    - flora-aid
    - flora-lands
    - flora-variants
    - flora-yields
  deposit:
    description: "Deposit; interpreted under its linked source definition and context."
    class_uri: pixlnd:deposit
    see_also:
    - ../domain/3_Classes.md#deposit
    slots:
    - id
    - deposit-aid
    - deposit-yields
    - deposit-lands
  dungeon-type:
    description: "Dungeon type; interpreted under its linked source definition and context."
    class_uri: pixlnd:dungeon-type
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    slots:
    - id
    - dungeon-type-name
    - dungeon-type-naming
    - dungeon-type-lands
    - dungeon-type-entrance
    - dungeon-type-rosters
    - dungeon-type-natural
    - dungeon-type-boss
    - dungeon-type-variants
  poi-type:
    description: "Poi type; interpreted under its linked source definition and context."
    class_uri: pixlnd:poi-type
    see_also:
    - ../domain/3_Classes.md#poi-type
    slots:
    - id
    - poi-type-name
    - poi-type-map
    - poi-type-contents
    - poi-type-lands
    - poi-type-variants
    - poi-type-static-id
    - poi-type-static-ids
    - poi-type-alpha-loc
    - poi-type-quarter
slots:
  block-type-solid:
    description: "Block type solid; interpreted under its linked source definition and context."
    slot_uri: pixlnd:block-type/solid
    alias: solid
    domain: block-type
    range: boolean
    required: false
    see_also:
    - ../domain/3_Classes.md#block-type
    - ../instances/block-types.json#alpha
  terrain-feature-name:
    description: "Terrain feature name; interpreted under its linked source definition and context."
    slot_uri: pixlnd:terrain-feature/name
    alias: name
    domain: terrain-feature
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#terrain-feature
    - ../instances/terrain-features.json
  terrain-feature-named:
    description: "Terrain feature named; interpreted under its linked source definition and context."
    slot_uri: pixlnd:terrain-feature/named
    alias: named
    domain: terrain-feature
    any_of:
    - range: boolean
    - range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#terrain-feature
    - ../instances/terrain-features.json
  flora-name:
    description: "Flora name; interpreted under its linked source definition and context."
    slot_uri: pixlnd:flora/name
    alias: name
    domain: flora
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#flora
    - ../instances/flora.json
  flora-aid:
    slot_uri: pixlnd:flora/aid
    alias: aid
    domain: flora
    range: integer
    required: false
    see_also:
    - ../domain/3_Classes.md#flora
    - ../instances/flora.json
    description: Numeric source index, not stable identity or a resolved entity reference.
  flora-lands:
    slot_uri: pixlnd:flora/lands
    alias: lands
    domain: flora
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#flora
    - ../instances/flora.json
    description: Exact qualified catalog text, not resolved spawns-in endpoints.
  flora-variants:
    slot_uri: pixlnd:flora/variants
    alias: variants
    domain: flora
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#flora
    - ../instances/flora.json
    description: Exact descriptive catalog text, not resolved flora references.
  deposit-aid:
    slot_uri: pixlnd:deposit/aid
    alias: aid
    domain: deposit
    range: integer
    required: false
    see_also:
    - ../domain/3_Classes.md#deposit
    - ../instances/deposits.json
    description: Numeric source index, not stable identity or a resolved entity reference.
  deposit-yields:
    slot_uri: pixlnd:deposit/yields
    alias: yields
    domain: deposit
    range: ingredient
    required: false
    see_also:
    - ../domain/3_Classes.md#deposit
    - ../domain/4_Relations.md
    - ../instances/deposits.json
    description: Ingredient ID only; count-range payload and target existence require separate validation.
  deposit-lands:
    slot_uri: pixlnd:deposit/lands
    alias: lands
    domain: deposit
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#deposit
    - ../instances/deposits.json
    description: Exact qualified catalog text, not resolved spawns-in endpoints.
  dungeon-type-name:
    description: "Dungeon type name; interpreted under its linked source definition and context."
    slot_uri: pixlnd:dungeon-type/name
    alias: name
    domain: dungeon-type
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
  dungeon-type-naming:
    description: "Dungeon type naming; interpreted under its linked source definition and context."
    slot_uri: pixlnd:dungeon-type/naming
    alias: naming
    domain: dungeon-type
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
  dungeon-type-lands:
    slot_uri: pixlnd:dungeon-type/lands
    alias: lands
    domain: dungeon-type
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
    description: Exact qualified placement text, not resolved placed-in endpoints.
  dungeon-type-entrance:
    slot_uri: pixlnd:dungeon-type/entrance
    alias: entrance
    domain: dungeon-type
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
    description: Exact descriptive text, not a resolved object or access rule.
  dungeon-type-rosters:
    slot_uri: pixlnd:dungeon-type/rosters
    alias: rosters
    domain: dungeon-type
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
    description: Exact race/family/species text, not uniformly resolved creature IDs.
  dungeon-type-natural:
    description: "Dungeon type natural; interpreted under its linked source definition and context."
    slot_uri: pixlnd:dungeon-type/natural
    alias: natural
    domain: dungeon-type
    range: boolean
    required: false
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
  dungeon-type-boss:
    slot_uri: pixlnd:dungeon-type/boss
    alias: boss
    domain: dungeon-type
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#dungeon-type
    - ../instances/dungeon-types.json
    description: Exact descriptive position text, not a creature reference.
  poi-type-name:
    description: "Poi type name; interpreted under its linked source definition and context."
    slot_uri: pixlnd:poi-type/name
    alias: name
    domain: poi-type
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
  poi-type-map:
    slot_uri: pixlnd:poi-type/map
    alias: map
    domain: poi-type
    range: string
    required: false
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
    description: Exact descriptive map text, not a resolved icon or object reference.
  poi-type-contents:
    slot_uri: pixlnd:poi-type/contents
    alias: contents
    domain: poi-type
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
    description: Exact qualified catalog text, not resolved static-entity references.
  poi-type-lands:
    slot_uri: pixlnd:poi-type/lands
    alias: lands
    domain: poi-type
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
    description: Exact qualified placement text, not resolved placed-in endpoints.
  poi-type-variants:
    slot_uri: pixlnd:poi-type/variants
    alias: variants
    domain: poi-type
    range: string
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
    description: Exact descriptive text, not resolved POI references.
  poi-type-alpha-loc:
    description: "Poi type alpha loc; interpreted under its linked source definition and context."
    slot_uri: pixlnd:poi-type/alpha-loc
    alias: alpha-loc
    domain: poi-type
    range: integer
    required: false
    multivalued: true
    minimum_cardinality: 2
    maximum_cardinality: 2
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
  poi-type-quarter:
    description: "Poi type quarter; interpreted under its linked source definition and context."
    slot_uri: pixlnd:poi-type/quarter
    alias: quarter
    domain: poi-type
    range: integer
    required: false
    multivalued: true
    minimum_cardinality: 2
    maximum_cardinality: 2
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
  poi-type-static-id:
    slot_uri: pixlnd:poi-type/static-id
    alias: static-id
    domain: poi-type
    range: integer
    required: false
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
    description: Source index including zero; not a stable ID or resolved static-entity reference.
  poi-type-static-ids:
    slot_uri: pixlnd:poi-type/static-ids
    alias: static-ids
    domain: poi-type
    range: integer
    required: false
    multivalued: true
    see_also:
    - ../domain/3_Classes.md#poi-type
    - ../instances/poi-types.json
    description: Source indices including zero; not stable IDs or resolved static-entity references.
