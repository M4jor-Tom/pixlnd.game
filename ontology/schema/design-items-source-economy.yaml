    range: generator-source-item
    inlined: true
  generators-source-field-loot:
    alias: loot
    slot_uri: pixlnd:generators-source/loot
    description: Source loot of generators-source.
    required: true
    range: string
  generators-source-field-key-items-s:
    alias: key-items-s
    slot_uri: pixlnd:generators-source/key-items-s
    description: Source key-items-s of generators-source.
    required: true
    range: generator-source-key-items-s
    inlined: true
  generators-source-field-level-formulas-alpha:
    alias: level-formulas-alpha
    slot_uri: pixlnd:generators-source/level-formulas-alpha
    description: Source level-formulas-alpha of generators-source.
    required: true
    range: string
