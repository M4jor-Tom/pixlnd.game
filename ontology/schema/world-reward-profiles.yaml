id: https://w3id.org/pixlnd/world/reward-profiles
name: pixlnd-world-reward-profiles
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
default_range: string
classes:
  initial-spirit-profile:
    class_uri: "pixlnd:initial-spirit-profile"
    description: "Fixed logical spirit acquisition parameters for the two ruins bosses (non-mission bosses), not a reward event, configuration or saved payload. At first logical generation each independently chooses one of four equally probable existing spirit types; that choice is permanent per logical boss. Each genuine ruins-boss death gives one cube and mission bosses give zero. Use canonical power(L) for the initial boss level L without spread, retaining its initial-level-derived power across daily renewal, not the current defeated boss level used by guaranteed gear. These are shared ground drops, not per-player copies, additive to ordinary rolls and guaranteed gear; unload/restart cannot reroll or re-award a death. This scope permits collecting and carrying only, no numerical effects or attachment behavior; retained bench restrictions and later customization remain distinct. No regional weakening or global spirit exclusion is added."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item", "../domain/3_Classes.md#spirit-cube", "../instances/generators.json#design.initial-encounters.spirits"]
    attributes:
      ruins-boss-count-per-death: {alias: "ruins-boss-count-per-death", slot_uri: "pixlnd:initial-spirit-profile/ruins-boss-count-per-death", range: integer, required: true, equals_number: 1, description: "One spirit cube per genuine death of either initial ruins boss, not per player or per whole site.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      mission-boss-count-per-death: {alias: "mission-boss-count-per-death", slot_uri: "pixlnd:initial-spirit-profile/mission-boss-count-per-death", range: integer, required: true, equals_number: 0, description: "Zero spirit cubes for the camp and four supplier rescue mission bosses; not a global removal of spirit sources.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      spirit-fire-probability: {alias: "spirit-fire-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-fire-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing fire spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-fire", "../instances/generators.json#design.initial-encounters.spirits"]}
      spirit-unholy-probability: {alias: "spirit-unholy-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-unholy-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing unholy spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-unholy", "../instances/generators.json#design.initial-encounters.spirits"]}
      spirit-ice-probability: {alias: "spirit-ice-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-ice-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing ice spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-ice", "../instances/generators.json#design.initial-encounters.spirits"]}
      spirit-wind-probability: {alias: "spirit-wind-probability", slot_uri: "pixlnd:initial-spirit-profile/spirit-wind-probability", range: double, required: true, minimum_value: 0.25, maximum_value: 0.25, description: "Dimensionless probability of the existing wind spirit type on first logical boss generation, independently per eligible boss; permanent thereafter, not per death. The catalog material identity retains its historical qualification, without selecting combat effects.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/materials.json#spirit-wind", "../instances/generators.json#design.initial-encounters.spirits"]}
      power-spread: {alias: "power-spread", slot_uri: "pixlnd:initial-spirit-profile/power-spread", range: integer, required: true, equals_number: 0, description: "No spread in power points after canonical power(L) conversion of INITIAL boss level L; renewal retains that power, unlike current-level guaranteed gear.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item"]}
      minimum-initial-boss-level: {alias: "minimum-initial-boss-level", slot_uri: "pixlnd:initial-spirit-profile/minimum-initial-boss-level", range: integer, required: true, equals_number: 1, description: "Minimum source-level context for the logical boss INITIAL level L used by spirit power(L), matching the existing saved initial-boss-level constraint; not an actual saved level, another level list or minimum item power.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "save-world.yaml#saved-spirit-level-level"]}
  supplier-gear-stock-ceiling-profile:
    class_uri: "pixlnd:supplier-gear-stock-ceiling-profile"
    description: "Fixed logical gear-stock ceiling parameters shared by all players in the same saved world for each land, not current progress, a completed-rescue counter or a stock payload. Starts common; four completed supplier rescues raise the ceiling to legendary. The raised ceiling applies at the next normal stock generation/restock, not an extra rescue-triggered reroll. This is the best quality shops may offer, not a guarantee every item has that quality. Existing quantities and prices remain unchanged; equipment keeps its strength when travelling. Rescue eligibility, completion and restocking follow the linked rules."
    see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s"]
    attributes:
      initial-rarity-index: {alias: "initial-rarity-index", slot_uri: "pixlnd:supplier-gear-stock-ceiling-profile/initial-rarity-index", range: integer, required: true, equals_number: 0, description: "Common initial land-local gear-stock ceiling index, not a stored current ceiling or a default stock item rarity.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s", "../instances/rarities.json#common"]}
      rarity-increment-per-completed-rescue: {alias: "rarity-increment-per-completed-rescue", slot_uri: "pixlnd:supplier-gear-stock-ceiling-profile/rarity-increment-per-completed-rescue", range: integer, required: true, equals_number: 1, description: "Ceiling rises one grade per completed supplier rescue, shared across players in that saved-world land, not a per-player benefit or an immediate stock reroll.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s"]}
      maximum-rarity-index: {alias: "maximum-rarity-index", slot_uri: "pixlnd:supplier-gear-stock-ceiling-profile/maximum-rarity-index", range: integer, required: true, equals_number: 4, description: "Legendary maximum gear-stock ceiling index, reached after four land-shared rescues; not guaranteed quality of every offer.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops", "../domain/3_Classes.md#shop", "../domain/3_Classes.md#gnome-supplier-s", "../instances/rarities.json#legendary"]}
  shared-mission-completion-profile:
    class_uri: "pixlnd:shared-mission-completion-profile"
    description: "Fixed logical delivery-height and extra-XP parameters for one shared package per camp/rescue completion cycle, not another reward event, receipt, configuration or package shape. Existing source level and class snapshot/fallback/deferred choice remain unchanged. Delivery at camp centre or captive feet follows camp final-death or rescue conversation/last-player-exit completion timing, once per cycle. Issuance and undelivered payload persist without duplicate rewards; ordinary ground pickup and lifetime apply, including later visitors. Existing kill XP and other future currency contracts remain unchanged; no additional completion currency is introduced."
    see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops"]
    attributes:
      delivery-height-above-floor-blocks: {alias: "delivery-height-above-floor-blocks", slot_uri: "pixlnd:shared-mission-completion-profile/delivery-height-above-floor-blocks", range: double, required: true, minimum_value: 0.5, maximum_value: 0.5, description: "Shared package delivery height in blocks above the floor at camp centre/captive feet, not an absolute position or a changed completion time.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops"]}
      extra-completion-xp: {alias: "extra-completion-xp", slot_uri: "pixlnd:shared-mission-completion-profile/extra-completion-xp", range: integer, required: true, equals_number: 0, description: "Zero extra completion XP, not removal of kill XP or a replacement XP reward event.", see_also: ["../domain/encounter-contracts.md#shared-mission-packages-and-supplier-shops"]}
  initial-permanent-source-profile:
    class_uri: "pixlnd:initial-permanent-source-profile"
    description: "Fixed logical artifact and one-time book source counts across only the six initial sites, including their alcove, bosses, props and packages; not full-land permanent-content coverage and not a permanent or global content exclusion. Personal claims per saved world and existing artifact allocation remain unchanged. Historical Steam book counts and recipe quantities are not hybrid selections. Later full-land sources and spirit customization remain deferred beyond the initial playable scope, not prerequisites or removed content."
    see_also: ["../domain/encounter-contracts.md#initial-permanent-source-scope", "../domain/3_Classes.md#artifact", "../domain/3_Classes.md#book-of-crafting"]
    attributes:
      artifact-source-count: {alias: "artifact-source-count", slot_uri: "pixlnd:initial-permanent-source-profile/artifact-source-count", range: integer, required: true, equals_number: 0, description: "Zero artifact sources across only the six initial sites including alcove, bosses, props and packages; not a full-land allocation or removal of retained artifacts or personal claims.", see_also: ["../domain/encounter-contracts.md#initial-permanent-source-scope", "../domain/3_Classes.md#artifact"]}
      one-time-book-source-count: {alias: "one-time-book-source-count", slot_uri: "pixlnd:initial-permanent-source-profile/one-time-book-source-count", range: integer, required: true, equals_number: 0, description: "Zero one-time book sources across only the six initial sites including alcove, bosses, props and packages; not a global book exclusion, historical quantity selection or removal of recipe knowledge or personal claims.", see_also: ["../domain/encounter-contracts.md#initial-permanent-source-scope", "../domain/3_Classes.md#book-of-crafting"]}
  ordinary-site-kill-loot-profile:
    class_uri: "pixlnd:ordinary-site-kill-loot-profile"
    description: "Fixed logical parameters for ordinary site-kill loot, not a drop event, configuration or saved reward payload. Per-kill rolls are independent and additive, not mutually exclusive: coins, one gear, one consumable and each defined species ingredient. Gear and consumables convert power(enemy level) first, then choose an equal-weight integer offset, then clamp to 1..100. Copper is 1 + 2 times enemy level; kill XP also uses enemy level, not item power. Ordinary rarity, kind and consumable pools and species ingredient selection/quantity reuse the linked inputs. Shared pickup, additivity with boss rewards and mission packages, and no reroll or re-award across unload/restart follow the linked rules."
    see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#loot-rule", "../domain/3_Classes.md#item", "../instances/generators.json#design.loot"]
    attributes:
      coin-probability: {alias: "coin-probability", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/coin-probability", range: double, required: true, minimum_value: 0.6, maximum_value: 0.6, description: "Dimensionless independent per-kill probability of copper, not a relative weight or the gear chance.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      gear-probability: {alias: "gear-probability", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/gear-probability", range: double, required: true, minimum_value: 0.2, maximum_value: 0.2, description: "Dimensionless independent per-kill probability of one gear item, not the coin chance.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      consumable-probability: {alias: "consumable-probability", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/consumable-probability", range: double, required: true, minimum_value: 0.15, maximum_value: 0.15, description: "Dimensionless independent per-kill probability of one consumable.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      each-species-ingredient-probability: {alias: "each-species-ingredient-probability", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/each-species-ingredient-probability", range: double, required: true, minimum_value: 0.5, maximum_value: 0.5, description: "Dimensionless independent per-kill probability for EACH defined species ingredient, not one roll for the entire ingredient pool; quantities remain species-defined.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      copper-base: {alias: "copper-base", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/copper-base", range: integer, required: true, equals_number: 1, description: "Base copper on a successful coin roll in 1 + 2 times enemy level, not converted item power.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      copper-per-enemy-level: {alias: "copper-per-enemy-level", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/copper-per-enemy-level", range: integer, required: true, equals_number: 2, description: "Linear coefficient in copper per enemy level on a successful coin roll; no item-power conversion applies to income.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      gear-count-per-success: {alias: "gear-count-per-success", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/gear-count-per-success", range: integer, required: true, equals_number: 1, description: "Gear quantity per successful ordinary gear roll, additional to other reward sources.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      consumable-count-per-success: {alias: "consumable-count-per-success", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/consumable-count-per-success", range: integer, required: true, equals_number: 1, description: "Consumable quantity per successful ordinary consumable roll, not an ingredient quantity.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot"]}
      power-offset-low: {alias: "power-offset-low", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/power-offset-low", range: integer, required: true, equals_number: -1, description: "Lower integer power-point offset for gear and consumables, applied after conversion of enemy level to power and before clamping, not to source level.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      power-offset-zero: {alias: "power-offset-zero", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/power-offset-zero", range: integer, required: true, equals_number: 0, description: "Middle integer power-point offset for gear and consumables, applied after conversion of enemy level to power and before clamping.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      power-offset-high: {alias: "power-offset-high", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/power-offset-high", range: integer, required: true, equals_number: 1, description: "Upper integer power-point offset for gear and consumables, applied after conversion of enemy level to power and before clamping.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      power-offset-low-relative-weight: {alias: "power-offset-low-relative-weight", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/power-offset-low-relative-weight", range: integer, required: true, equals_number: 1, description: "Exact equal relative weight of the lower offset among the three integer offsets; not a rounded probability or a weight for independent drop rolls.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      power-offset-zero-relative-weight: {alias: "power-offset-zero-relative-weight", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/power-offset-zero-relative-weight", range: integer, required: true, equals_number: 1, description: "Exact equal relative weight of the zero offset among the three integer offsets.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      power-offset-high-relative-weight: {alias: "power-offset-high-relative-weight", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/power-offset-high-relative-weight", range: integer, required: true, equals_number: 1, description: "Exact equal relative weight of the upper offset among the three integer offsets.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      minimum-item-power: {alias: "minimum-item-power", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/minimum-item-power", range: integer, required: true, equals_number: 1, description: "Inclusive lower item-power clamp bound after conversion and offset, not a source-level bound.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
      maximum-item-power: {alias: "maximum-item-power", slot_uri: "pixlnd:ordinary-site-kill-loot-profile/maximum-item-power", range: integer, required: true, equals_number: 100, description: "Inclusive upper item-power clamp bound after conversion and offset, not a source-level bound.", see_also: ["../domain/encounter-contracts.md#ordinary-kill-loot", "../domain/3_Classes.md#item"]}
  guaranteed-boss-gear-profile:
    class_uri: "pixlnd:guaranteed-boss-gear-profile"
    description: "Fixed logical guaranteed-gear parameters, not a reward event, configuration or saved payload. All seven initial site bosses independently guarantee one additional gear item, not replacement normal rolls or per-player copies. Gear uses power(L) for the defeated boss current saved level L, minimum 1, not the initial spirit level, current HP or boss power; no spread and zero upgrades. Rarity is tier + 1 capped at legendary, not a random rarity roll. Kind uses relative weights and the four current character classes are equally likely; legal class materials/weapons and subtype/modifier/name choices reuse linked inputs. New genuine deaths may reroll those choices, not tier-based rarity. Reloads cannot reroll the same death rewards. Shared pickup and reward lifecycle follow the linked rules; spirit applicability and initial-level power are distinct."
    see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#loot-rule", "../domain/3_Classes.md#item", "../instances/generators.json#design.loot"]
    attributes:
      additional-gear-count-per-boss: {alias: "additional-gear-count-per-boss", slot_uri: "pixlnd:guaranteed-boss-gear-profile/additional-gear-count-per-boss", range: integer, required: true, equals_number: 1, description: "One additional gear item per defeated initial site boss, independently guaranteed alongside ordinary rolls, not per player.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      minimum-current-defeated-boss-level: {alias: "minimum-current-defeated-boss-level", slot_uri: "pixlnd:guaranteed-boss-gear-profile/minimum-current-defeated-boss-level", range: integer, required: true, equals_number: 1, description: "Minimum context level for the currently defeated boss saved level L before canonical power(L) conversion; not an actual level, initial spirit level or source-level clipping offset.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      power-spread: {alias: "power-spread", slot_uri: "pixlnd:guaranteed-boss-gear-profile/power-spread", range: integer, required: true, equals_number: 0, description: "No spread in power points after conversion of current defeated boss saved level L: use power(L) directly, not initial spirit power.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item"]}
      upgrades: {alias: "upgrades", slot_uri: "pixlnd:guaranteed-boss-gear-profile/upgrades", range: integer, required: true, equals_number: 0, description: "Guaranteed boss gear upgrade count, not rarity or power.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      rarity-tier-increment: {alias: "rarity-tier-increment", slot_uri: "pixlnd:guaranteed-boss-gear-profile/rarity-tier-increment", range: integer, required: true, equals_number: 1, description: "Fixed increment above defeated boss tier before capping at legendary; not an additional random rarity roll.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits"]}
      maximum-rarity-index: {alias: "maximum-rarity-index", slot_uri: "pixlnd:guaranteed-boss-gear-profile/maximum-rarity-index", range: integer, required: true, equals_number: 4, description: "Legendary cap on boss tier plus increment; mythical is not admitted by this reward rule.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/rarities.json#legendary"]}
      minimum-item-power: {alias: "minimum-item-power", slot_uri: "pixlnd:guaranteed-boss-gear-profile/minimum-item-power", range: integer, required: true, equals_number: 1, description: "Inclusive canonical item-power lower bound, not a replacement for current defeated boss source level.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item"]}
      maximum-item-power: {alias: "maximum-item-power", slot_uri: "pixlnd:guaranteed-boss-gear-profile/maximum-item-power", range: integer, required: true, equals_number: 100, description: "Inclusive canonical item-power upper bound, not source-level clipping before conversion.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#item"]}
      weapon-relative-weight: {alias: "weapon-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/weapon-relative-weight", range: integer, required: true, equals_number: 4, description: "Weapon relative integer weight, not a percentage, in the existing gear-kind pool.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/generators.json#design.loot"]}
      chest-relative-weight: {alias: "chest-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/chest-relative-weight", range: integer, required: true, equals_number: 2, description: "Chest relative integer weight, not a percentage; the existing gear-kind key is chest-armor.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/generators.json#design.loot"]}
      gloves-relative-weight: {alias: "gloves-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/gloves-relative-weight", range: integer, required: true, equals_number: 2, description: "Gloves relative integer weight, not a percentage, in the existing gear-kind pool.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/generators.json#design.loot"]}
      boots-relative-weight: {alias: "boots-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/boots-relative-weight", range: integer, required: true, equals_number: 2, description: "Boots relative integer weight, not a percentage, in the existing gear-kind pool.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/generators.json#design.loot"]}
      shoulders-relative-weight: {alias: "shoulders-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/shoulders-relative-weight", range: integer, required: true, equals_number: 2, description: "Shoulders relative integer weight, not a percentage; the existing gear-kind key is shoulder-armor.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../instances/generators.json#design.loot"]}
      warrior-class-relative-weight: {alias: "warrior-class-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/warrior-class-relative-weight", range: integer, required: true, equals_number: 1, description: "Warrior equal relative integer weight among the four current character-class identities; no new class pool.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#character-class"]}
      ranger-class-relative-weight: {alias: "ranger-class-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/ranger-class-relative-weight", range: integer, required: true, equals_number: 1, description: "Ranger equal relative integer weight among the four current character-class identities; legal class choices remain linked.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#character-class"]}
      mage-class-relative-weight: {alias: "mage-class-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/mage-class-relative-weight", range: integer, required: true, equals_number: 1, description: "Mage equal relative integer weight among the four current character-class identities; legal class choices remain linked.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#character-class"]}
      rogue-class-relative-weight: {alias: "rogue-class-relative-weight", slot_uri: "pixlnd:guaranteed-boss-gear-profile/rogue-class-relative-weight", range: integer, required: true, equals_number: 1, description: "Rogue equal relative integer weight among the four current character-class identities; legal class choices remain linked.", see_also: ["../domain/encounter-contracts.md#guaranteed-boss-gear-and-spirits", "../domain/3_Classes.md#character-class"]}
