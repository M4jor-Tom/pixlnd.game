slots:
  item-type:
    description: "The type property of items."
    slot_uri: pixlnd:item/type
    alias: type
    range: item-type
    required: true
    see_also: *id001
  item-sub-type:
    description: "The sub-type property of items."
    slot_uri: pixlnd:item/sub-type
    alias: sub-type
    range: item-type
    required: true
    see_also: *id001
  item-modifier:
    description: "The modifier property of items."
    slot_uri: pixlnd:item/modifier
    alias: modifier
    range: uint32
    required: true
    see_also: *id001
  item-minus-modifier:
    description: "The minus-modifier property of items."
    slot_uri: pixlnd:item/minus-modifier
    alias: minus-modifier
    range: uint32
    required: true
    see_also: *id001
  item-rarity:
    description: "The rarity property of items."
    slot_uri: pixlnd:item/rarity
    alias: rarity
    range: rarity
    required: true
    see_also: *id001
  item-material:
    description: "The material property of items."
    slot_uri: pixlnd:item/material
    alias: material
    range: material
    required: true
    see_also: *id001
  item-flags:
    description: "The flags property of items."
    slot_uri: pixlnd:item/flags
    alias: flags
    range: u8
    required: true
    see_also: *id001
  item-level:
    description: "The level property of items."
    slot_uri: pixlnd:item/level
    alias: level
    range: i16
    required: true
    see_also:
    - ../domain/3_Classes.md#item
    minimum_value: 1
    maximum_value: 100
  item-weapon-type:
    slot_uri: pixlnd:item/weapon-type
    alias: weapon-type
    domain: item
    range: weapon-type
    required: false
    multivalued: false
    inlined: false
    exactly_one_of: [{range: weapon-type}]
    description: Scalar logical weapon-family reference for weapon items only, agreeing with existing type/sub-type meaning. No numeric-source conversion, global subtype narrowing, implicit foreign-key resolution or saved-wire representation is selected.
    see_also:
    - ../domain/3_Classes.md#item
    - ../domain/5_Constraints.md#constraint-catalog
  item-upgrade-count:
    description: Number of active placed cubes, exactly the length of logical upgrades, including zero. Existing uint32 information and stat equations are unchanged; no historical inactive-slot layout is selected.
    slot_uri: pixlnd:item/upgrade-count
    alias: upgrade-count
    range: uint32
    required: true
    maximum_value: 32
    equals_expression: len({upgrades})
    see_also: *id001
  item-upgrade-x:
    description: "The x property of items."
    slot_uri: pixlnd:item-upgrade/x
    alias: x
    range: i8
    required: true
    see_also: *id002
  item-upgrade-y:
    description: "The y property of items."
    slot_uri: pixlnd:item-upgrade/y
    alias: y
    range: i8
    required: true
    see_also: *id002
  item-upgrade-z:
    description: "The z property of items."
    slot_uri: pixlnd:item-upgrade/z
    alias: z
    range: i8
    required: true
    see_also: *id002
  item-upgrade-material:
    description: "The material property of items."
    slot_uri: pixlnd:item-upgrade/material
    alias: material
    range: material
    required: true
    see_also: *id002
  item-upgrade-level:
    slot_uri: pixlnd:item-upgrade/level
    alias: level
    domain: item-upgrade
    range: integer
    required: true
    description: Recorded per-cube level value; it is not character level or a selected power conversion.
    see_also: *id002
  item-upgrades:
    slot_uri: pixlnd:item/upgrades
    alias: upgrades
    range: item-upgrade
    required: true
    multivalued: true
    maximum_cardinality: 32
    inlined: true
    inlined_as_list: true
    description: Active placed item-upgrade entries only, at most 32 globally and exactly upgrade-count in number; linked 1H weapon families allow at most 16, 2H and shield 32. Wood cubes require a weapon with concrete wood material, iron cubes a weapon with concrete metal material; other materials are not universally restricted.
    see_also: *id001
  pet-food-tames:
    slot_uri: pixlnd:pet-food/tames
    alias: tames
    range: creature
    required: true
    multivalued: true
    minimum_cardinality: 1
    description: Explicit species pairings; Bubble Gum may name Collie and Skeleton Dog. Numeric source
      identity remains separate.
    see_also: *id003
  equipment-slot-index:
    description: "The index property of items."
    slot_uri: pixlnd:equipment-slot/index
    alias: index
    range: integer
    required: true
    minimum_value: 0
    maximum_value: 12
    see_also: *id004
  equipment-slot-accepts:
    slot_uri: pixlnd:equipment-slot/accepts
    alias: accepts
    range: item-type
    required: true
    multivalued: true
    description: Reserved unknown-0 accepts nothing. Usable-slot and subtype restrictions remain canonical.
    see_also: *id004
  inventory-entry-item:
    description: "The item property of items."
    slot_uri: pixlnd:inventory-entry/item
    alias: item
    range: item
    required: true
    inlined: true
    see_also: *id005
  inventory-entry-count:
    description: "The count property of items."
    slot_uri: pixlnd:inventory-entry/count
    alias: count
    range: integer
    required: true
    minimum_value: 1
    see_also: *id005
  inventory-entries:
    description: "The entries property of items."
    slot_uri: pixlnd:inventory/entries
    alias: entries
    range: inventory-entry
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    see_also: *id006
  inventory-coins:
    description: "The coins property of items."
    slot_uri: pixlnd:inventory/coins
    alias: coins
    range: uint32
    required: true
    see_also: *id006
  equipment-assignment-slot:
    description: "The slot property of items."
    slot_uri: pixlnd:equipment-assignment/slot
    alias: slot
    range: equipment-slot
    required: true
    see_also: *id007
  equipment-assignment-item:
    description: "The item property of items."
    slot_uri: pixlnd:equipment-assignment/item
    alias: item
    range: item
    required: true
    inlined: true
    see_also: *id007
  inventory-equipment:
    slot_uri: pixlnd:inventory/equipment
    alias: equipment
    range: equipment-assignment
    required: true
    multivalued: true
    maximum_cardinality: 12
    inlined: true
    inlined_as_list: true
    description: Logical slot/item associations, not a selected persisted JSON map encoding; uniqueness
      and slot legality need extra validation.
    see_also: *id006
  item-land:
    slot_uri: pixlnd:item/land
    alias: land
    range: land
    required: true
    domain: item
    see_also:
    - ../domain/3_Classes.md#item
    description: Context-qualified declaration; applicability is defined by canonical prose.
  item-plus:
    slot_uri: pixlnd:item/plus
    alias: plus
    range: boolean
    required: true
    domain: item
    see_also:
    - ../domain/3_Classes.md#item
    description: Context-qualified declaration; applicability is defined by canonical prose.
  recipe-map-key:
    alias: key
    slot_uri: pixlnd:recipe-source/key
    range: string
    required: true
    key: true
    pattern: '^[a-z0-9][a-z0-9|.-]*$'
    description: Original key in a recipe source map, including grouped weapon labels; not a global identity or resolved catalog reference.
  item-type-subtype-key:
    alias: key
    slot_uri: pixlnd:item-type-source/subtype-key
    range: string
    required: true
    key: true
    pattern: '^[0-9]+$'
    description: Original numeric subtype string key, retained as source data rather than catalog identity.
  item-name:
    slot_uri: pixlnd:item/name
    alias: name
    domain: item
    range: string
    required: false
    readonly: 'true'
    description: Derived item-name generator projection; canonical gen-name item forms, not a naming algorithm, stored save field or writable input.
    see_also:
    - ../domain/3_Classes.md#item
    - ../domain/6_Generators.md
  recipe-required-power:
    slot_uri: pixlnd:recipe/required-power
    alias: required-power
    domain: recipe
    range: integer
    required: true
    minimum_value: 1
    maximum_value: 100
    description: Required item-power points +1..+100, not character level. Known recipes can remain power-locked; no default, generated value or equality with formula power is asserted.
    see_also:
    - ../domain/3_Classes.md#item
    - ../domain/3_Classes.md#power-gate-a
  formula-recipe:
    slot_uri: pixlnd:formula/recipe
    alias: recipe
    domain: formula
    range: recipe
    required: true
    description: Single Recipe taught by this scroll; acquisition feeds the character's shared knows-recipe relation, not a second learned collection. Scroll +N remains Item power independently of recipe required-power.
    see_also:
    - ../domain/3_Classes.md#formula
    - ../domain/3_Classes.md#recipe
  book-recipes:
    slot_uri: pixlnd:book-of-crafting/recipes
    alias: recipes
    domain: book-of-crafting
    range: recipe
    required: true
    multivalued: true
    minimum_cardinality: 1
    description: Recipe content taught into shared knows-recipe, not player knowledge itself. Historical S has 3–4 recipes per book and four books per land; neither count nor land scope is a hybrid cardinality or default. Only unknown recipes are taught, without rerolls or compensation.
    see_also:
    - ../domain/3_Classes.md#book-of-crafting
    - ../domain/3_Classes.md#recipe
  artifact-name:
    slot_uri: pixlnd:artifact/name
    alias: name
    domain: artifact
    range: string
    required: false
    readonly: 'true'
    description: 'Derived relic name, source forms "<Ring|Stone|Gem…> of <Name>" and "<Name> Stone" (e.g. Ring of Momuna, Sirazyna Stone). No naming algorithm or stored-name requirement is selected.'
    see_also:
