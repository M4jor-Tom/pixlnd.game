id: https://w3id.org/pixlnd/items
name: pixlnd-items
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- relations
- catalog-crafting-social
- catalog-properties
- identity
default_range: string
classes:
  item:
    class_uri: pixlnd:item
    description: Logical item definition. Display name is an optional read-only derived projection, not a stored or writable input requirement.
    see_also: &id001
    - ../domain/3_Classes.md#item
    slots:
    - id
    - item-type
    - item-sub-type
    - item-modifier
    - item-minus-modifier
    - item-rarity
    - item-material
    - item-flags
    - item-level
    - item-upgrade-count
    - item-upgrades
    - item-name
    - item-land
    - item-plus
    - item-weapon-type
    rules:
    - preconditions:
        slot_conditions:
          item-type: {alias: type, equals_string: weapon}
      postconditions:
        slot_conditions:
          item-weapon-type: {alias: weapon-type, value_presence: PRESENT}
      elseconditions:
        slot_conditions:
          item-weapon-type: {alias: weapon-type, value_presence: ABSENT}
    - preconditions:
        slot_conditions:
          item-weapon-type:
            alias: weapon-type
            equals_string_in: [sword, axe, mace, dagger, fist, bracelet]
      postconditions:
        slot_conditions:
          item-upgrade-count: {alias: upgrade-count, maximum_value: 16}
    all_of:
    - any_of:
      - none_of:
        - slot_conditions:
            item-weapon-type:
              alias: weapon-type
              equals_string_in: [sword, axe, mace, dagger, fist, bracelet]
      - slot_conditions:
          item-upgrades: {alias: upgrades, multivalued: true, maximum_cardinality: 16}
    - any_of:
      - slot_conditions:
          item-upgrades:
            alias: upgrades
            multivalued: true
            all_members:
              range_expression:
                slot_conditions:
                  item-upgrade-material:
                    alias: material
                    none_of: [{equals_string: wood}]
      - slot_conditions:
          item-type: {alias: type, equals_string: weapon}
          item-material: {alias: material, equals_string_in: [wood]}
    - any_of:
      - slot_conditions:
          item-upgrades:
            alias: upgrades
            multivalued: true
            all_members:
              range_expression:
                slot_conditions:
                  item-upgrade-material:
                    alias: material
                    none_of: [{equals_string: iron}]
      - slot_conditions:
          item-type: {alias: type, equals_string: weapon}
          item-material: {alias: material, equals_string_in: [iron, copper, gold, silver, bronze]}
    slot_usage:
      item-land:
        required: false
        description: Origin region in historical S only; inert hybrid metadata, never regional power weakening or a mandatory hybrid input.
      item-plus:
        required: false
        description: Adjacent-land suffix applicability in historical S only; inert hybrid metadata, never a regional effect gate.
  item-type:
    description: "Logical item-type definition; applicability follows the cited domain rules."
    class_uri: pixlnd:item-type
    see_also:
    - ../domain/3_Classes.md#item-type
    slots:
    - id
  material:
    description: "Logical material definition; applicability follows the cited domain rules."
    class_uri: pixlnd:material
    see_also:
    - ../domain/3_Classes.md#material
    slots:
    - id
    - material-name
    - material-kind
    - material-hp-bonus
    - material-armor-mult
    - material-resi-mult
    - material-crit-bonus
    - material-tempo-bonus
    - material-regen-bonus
    - material-refined
    - material-crafts-rarity
    - material-obtainable
    - material-class
    - material-station
    - material-raw
    - material-alt-name
    - material-effect
    - material-price-s
    - material-sell-s
  rarity:
    description: "Logical rarity definition; applicability follows the cited domain rules."
    class_uri: pixlnd:rarity
    see_also:
    - ../domain/3_Classes.md#rarity
    slots:
    - id
    - rarity-name
    - rarity-color
    - rarity-index
    - rarity-hex
    - rarity-stars
    - rarity-gem
    - rarity-named
  affix:
    description: "Logical affix definition; applicability follows the cited domain rules."
    class_uri: pixlnd:affix
    see_also:
    - ../domain/3_Classes.md#affix
    slots:
    - id
  equipment-slot:
    description: "Logical equipment-slot definition; applicability follows the cited domain rules."
    class_uri: pixlnd:equipment-slot
    see_also: &id004
    - ../domain/3_Classes.md#equipment-slot
    slots:
    - id
    - equipment-slot-index
    - equipment-slot-accepts
    - equipment-slot-hp-mult
    - equipment-slot-accepts-conditions
  consumable:
    description: "Logical consumable definition; applicability follows the cited domain rules."
    class_uri: pixlnd:consumable
    see_also:
    - ../domain/3_Classes.md#consumable
    slots:
    - id
  ingredient:
    description: "Logical ingredient definition; applicability follows the cited domain rules."
    class_uri: pixlnd:ingredient
    see_also:
    - ../domain/3_Classes.md#ingredient
    slots:
    - id
    - ingredient-name
    - ingredient-alpha-subtype
    - ingredient-kind
    - ingredient-from
    - ingredient-sell
    - ingredient-recipe
    - ingredient-refines-to
  recipe:
    description: "Logical recipe definition; applicability follows the cited domain rules."
    class_uri: pixlnd:recipe
    see_also:
    - ../domain/3_Classes.md#recipe
    slots:
    - id
    - crafted-at
    - consumes
    - produces
    - recipe-required-power
  crafting-station:
    description: "Logical crafting-station definition; applicability follows the cited domain rules."
    class_uri: pixlnd:crafting-station
    see_also:
    - ../domain/3_Classes.md#crafting-station
    slots:
    - id
    - crafting-station-name
    - crafting-station-static-id
  formula:
    class_uri: pixlnd:formula
    is_a: item
    description: Formula scroll is an item; its +N uses the shared item power field and formula learning targets the character's shared knows-recipe relation.
    see_also:
    - ../domain/3_Classes.md#formula
    - ../domain/3_Classes.md#item
    slots:
    - formula-recipe
  book-of-crafting:
    class_uri: pixlnd:book-of-crafting
    description: Book recipe source identity and content, not an assertion of Item power or upgrade payload. Duplicate handling and character/world claims remain distinct canonical rules.
    slots:
    - id
    - book-recipes
    see_also:
    - ../domain/3_Classes.md#book-of-crafting
    - ../domain/3_Classes.md#recipe
  spirit-cube:
    description: "Logical spirit-cube definition; applicability follows the cited domain rules."
    class_uri: pixlnd:spirit-cube
    see_also:
    - ../domain/3_Classes.md#spirit-cube
    slots:
    - id
  leftovers:
    description: "Logical leftovers definition; applicability follows the cited domain rules."
    class_uri: pixlnd:leftovers
    see_also:
    - ../domain/3_Classes.md#leftovers
    slots:
    - id
  pet-food:
    description: "Logical pet-food definition; applicability follows the cited domain rules."
    class_uri: pixlnd:pet-food
    see_also: &id003
    - ../domain/3_Classes.md#pet-food
    slots:
    - id
    - pet-food-tames
  key-item:
    description: "Logical key-item definition; applicability follows the cited domain rules."
    class_uri: pixlnd:key-item
    see_also:
    - ../domain/3_Classes.md#key-item
    slots:
    - id
  artifact:
    description: "Logical artifact definition; applicability follows the cited domain rules."
    class_uri: pixlnd:artifact
    see_also:
    - ../domain/3_Classes.md#artifact
    slots:
    - id
    - traversal-kind
    - raises-stat
    - artifact-name
    - artifact-origin-realm
    slot_usage:
      raises-stat:
        required: true
        minimum_cardinality: 3
        maximum_cardinality: 3
        list_elements_unique: true
        has_member: {equals_string: attack-power}
        description: "Exactly one traversal stat plus attack and maximum HP: three distinct existing Stat references, including attack-power and hp (maximum HP), plus the selector's matching traversal Stat. Class rules declare the remaining membership constraints; JSON Schema does not enforce all of them."
    rules:
    - postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: hp}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: climb_speed}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: climb-speed}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: swim_speed}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: swim-speed}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: diving_skill}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: diving-skill}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: ride_speed}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: ride-speed}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: glide_speed}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: glide-speed}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: sail_speed}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: sail-speed}}
    - preconditions:
        slot_conditions:
          traversal-kind: {equals_string: light_radius}
      postconditions:
        slot_conditions:
          raises-stat: {has_member: {equals_string: light-radius}}
    attributes:
      traversal-kind: {alias: traversal-kind, slot_uri: pixlnd:artifact/traversal-kind, range: ArtifactTraversalKind, required: true, description: 'Exactly one of the seven approved traversal bonus kinds; stat targets, equal-share accumulation and logarithmic behavior remain governed by raises-stat and c-artifact-stat.'}
  currency:
    description: "Logical currency definition; applicability follows the cited domain rules."
    class_uri: pixlnd:currency
    see_also:
    - ../domain/3_Classes.md#currency
    slots:
    - id
  shop:
    description: "Logical shop definition; applicability follows the cited domain rules."
    class_uri: pixlnd:shop
    see_also:
    - ../domain/3_Classes.md#shop
    slots:
    - id
  inventory:
    class_uri: pixlnd:inventory
    description: Logical per-character bag, equipment and coin holdings; this is not a selected save-wire format. Starting contents remain a generator configuration reference.
    see_also: &id006
    - ../domain/3_Classes.md#inventory
    slots:
    - id
    - inventory-entries
    - inventory-coins
    - inventory-equipment
  item-upgrade:
    class_uri: pixlnd:item-upgrade
    description: Placed item cube with explicit coordinates, material and integer level; cube capacity and count agreement remain coupled rules.
    see_also: &id002
    - ../domain/3_Classes.md#item
    slots:
    - item-upgrade-x
    - item-upgrade-y
    - item-upgrade-z
    - item-upgrade-material
    - item-upgrade-level
  inventory-entry:
    class_uri: pixlnd:inventory-entry
    description: One item/count association; stack eligibility is governed by c-stack-rule, not a count cap here.
    see_also: &id005
    - ../domain/3_Classes.md#inventory
    slots:
    - inventory-entry-item
    - inventory-entry-count
  equipment-assignment:
    description: "Logical equipment-assignment definition; applicability follows the cited domain rules."
    class_uri: pixlnd:equipment-assignment
    see_also: &id007
    - ../domain/3_Classes.md#inventory
    slots:
    - equipment-assignment-slot
    - equipment-assignment-item
    unique_keys:
      slot:
        unique_key_slots:
        - equipment-assignment-slot
  key-items-source:
    description: "Source representation of key-items-source."
    class_uri: pixlnd:key-items-source
    annotations: {source-map-entries: entries}
    see_also: [../instances/key-items.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:key-items-source/schema, range: string, required: true, equals_string: key-item, description: "The $schema field of key-items-source."}
      documentation: {alias: _doc, slot_uri: pixlnd:key-items-source/doc, range: string, required: true, description: "The _doc field of key-items-source."}
      counts-per-land-s: {alias: counts-per-land-s, slot_uri: pixlnd:key-items-source/counts-per-land-s, range: key-item-counts-source, required: true, inlined: true, description: "Historical S summary configuration, not a key-item row or hybrid quantity default."}
      special-accessories-x: {alias: special-accessories-x, slot_uri: pixlnd:key-items-source/special-accessories-x, range: key-item-cut-summary-source, required: true, inlined: true, description: "Grouped alpha special-accessory data, X/cut reference configuration rather than an item row."}
      entries: {alias: entries, slot_uri: pixlnd:key-items-source/entries, range: key-items-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "The entries field of key-items-source."}
  key-items-source-entry:
    description: "Source representation of key-items-source-entry."
    slots: [recipe-map-key]
    attributes:
      value: {alias: value, slot_uri: pixlnd:key-items-source-entry/value, any_of: [{range: key-item-source-row}, {range: key-item-artifact-source}], required: true, inlined: true, description: "The value field of key-items-source-entry."}
  key-item-source-row:
    description: "Source representation of key-item-source-row."
    attributes:
      name: {alias: name, slot_uri: pixlnd:key-item-source-row/name, range: string, required: true, description: "The name field of key-item-source-row."}
      group: {alias: group, slot_uri: pixlnd:key-item-source-row/group, range: string, description: "The group field of key-item-source-row."}
      alpha-type: {alias: alpha-type, slot_uri: pixlnd:key-item-source-row/alpha-type, any_of: [{range: integer}, {range: integer, multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2}], description: "The alpha-type field of key-item-source-row."}
      acquire: {alias: acquire, slot_uri: pixlnd:key-item-source-row/acquire, range: key-item-acquire-source, inlined: true, description: "The acquire field of key-item-source-row."}
      opens: {alias: opens, slot_uri: pixlnd:key-item-source-row/opens, range: string, description: "The opens field of key-item-source-row."}
      effect: {alias: effect, slot_uri: pixlnd:key-item-source-row/effect, range: string, description: "The effect field of key-item-source-row."}
      message: {alias: message, slot_uri: pixlnd:key-item-source-row/message, range: string, description: "The message field of key-item-source-row."}
      rules: {alias: rules, slot_uri: pixlnd:key-item-source-row/rules, range: string, multivalued: true, description: "The rules field of key-item-source-row."}
      controls: {alias: _controls, slot_uri: pixlnd:key-item-source-row/controls, range: string, multivalued: true, description: "The _controls field of key-item-source-row."}
      speed-stat: {alias: speed-stat, slot_uri: pixlnd:key-item-source-row/speed-stat, range: string, description: "The speed-stat field of key-item-source-row."}
      versions: {alias: versions, slot_uri: pixlnd:key-item-source-row/versions, range: string, multivalued: true, description: "The versions field of key-item-source-row."}
      a-equivalent: {alias: a-equivalent, slot_uri: pixlnd:key-item-source-row/a-equivalent, range: string, description: "The a-equivalent field of key-item-source-row."}
      s-equivalent: {alias: s-equivalent, slot_uri: pixlnd:key-item-source-row/s-equivalent, range: string, description: "The s-equivalent field of key-item-source-row."}
  key-item-cut-summary-source:
    description: "Exact grouped cut/reference accessory data; member names remain data, not model properties or active item availability."
    see_also: [../instances/key-items.json#special-accessories-x, ../domain/5_Constraints.md#required-inputs]
    attributes:
      name: {alias: name, slot_uri: pixlnd:key-item-cut-summary-source/name, range: string, required: true, description: "Source summary name."}
      alpha-type: {alias: alpha-type, slot_uri: pixlnd:key-item-cut-summary-source/alpha-type, range: integer, required: true, description: "Historical alpha type number, not allocated item identity."}
      list: {alias: list, slot_uri: pixlnd:key-item-cut-summary-source/list, range: string, required: true, multivalued: true, description: "Exact cut accessory names, not individual schema slots."}
      versions: {alias: versions, slot_uri: pixlnd:key-item-cut-summary-source/versions, range: string, required: true, multivalued: true, description: "Explicit source provenance, retaining X/cut status."}
  key-item-acquire-source:
    description: "Source representation of key-item-acquire-source."
    attributes:
      alpha: {alias: A, slot_uri: pixlnd:key-item-acquire-source/alpha, range: string, description: "The A field of key-item-acquire-source."}
      steam: {alias: S, slot_uri: pixlnd:key-item-acquire-source/steam, range: string, description: "The S field of key-item-acquire-source."}
  key-item-artifact-source:
    description: "Source representation of key-item-artifact-source."
    attributes:
      name: {alias: name, slot_uri: pixlnd:key-item-artifact-source/name, range: string, required: true, description: "The name field of key-item-artifact-source."}
      group: {alias: group, slot_uri: pixlnd:key-item-artifact-source/group, range: string, required: true, description: "The group field of key-item-artifact-source."}
      versions: {alias: versions, slot_uri: pixlnd:key-item-artifact-source/versions, range: string, required: true, multivalued: true, description: "The versions field of key-item-artifact-source."}
      rules: {alias: rules, slot_uri: pixlnd:key-item-artifact-source/rules, range: string, required: true, multivalued: true, description: "The rules field of key-item-artifact-source."}
      stat-kinds: {alias: stat-kinds, slot_uri: pixlnd:key-item-artifact-source/stat-kinds, range: string, required: true, multivalued: true, description: "The stat-kinds field of key-item-artifact-source."}
      name-forms: {alias: name-forms, slot_uri: pixlnd:key-item-artifact-source/name-forms, range: string, required: true, multivalued: true, description: "The name-forms field of key-item-artifact-source."}
      examples: {alias: examples, slot_uri: pixlnd:key-item-artifact-source/examples, range: string, required: true, multivalued: true, description: "The examples field of key-item-artifact-source."}
      found-in: {alias: found-in, slot_uri: pixlnd:key-item-artifact-source/found-in, range: string, required: true, multivalued: true, description: "The found-in field of key-item-artifact-source."}
      count-per-land: {alias: count-per-land, slot_uri: pixlnd:key-item-artifact-source/count-per-land, range: string, required: true, description: "The count-per-land field of key-item-artifact-source."}
      alpha-static-entity: {alias: alpha-static-entity, slot_uri: pixlnd:key-item-artifact-source/alpha-static-entity, range: integer, required: true, description: "The alpha-static-entity field of key-item-artifact-source."}
  key-item-counts-source:
    description: "Source representation of key-item-counts-source."
    attributes:
      movement: {alias: movement, slot_uri: pixlnd:key-item-counts-source/movement, range: integer, required: true, description: "The movement field of key-item-counts-source."}
      ticket: {alias: ticket, slot_uri: pixlnd:key-item-counts-source/ticket, range: integer, required: true, description: "The ticket field of key-item-counts-source."}
      total-max: {alias: total-max, slot_uri: pixlnd:key-item-counts-source/total-max, range: integer, required: true, description: "The total-max field of key-item-counts-source."}
      gnome-suppliers: {alias: gnome-suppliers, slot_uri: pixlnd:key-item-counts-source/gnome-suppliers, range: integer, required: true, description: "The gnome-suppliers field of key-item-counts-source."}
      books: {alias: books, slot_uri: pixlnd:key-item-counts-source/books, range: integer, required: true, description: "The books field of key-item-counts-source."}
  recipes-source:
    class_uri: pixlnd:recipes-source
    description: Literal recipes.json configuration; symbolic counts are not executable relations.
    see_also: [../instances/recipes.json, ../domain/5_Constraints.md#required-inputs]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:recipes-source/schema, range: string, required: true, equals_string: recipe, description: "The $schema field of recipes-source."}
      documentation: {alias: _doc, slot_uri: pixlnd:recipes-source/doc, range: string, required: true, description: "The _doc field of recipes-source."}
      gear-armor-quantities: {alias: gear-armor-quantities, slot_uri: pixlnd:recipes-source/armor, range: recipe-armor, required: true, inlined: true, description: "The gear-armor-quantities field of recipes-source."}
      gear-weapons: {alias: gear-weapons, slot_uri: pixlnd:recipes-source/weapons, range: recipe-weapons, required: true, inlined: true, description: "The gear-weapons field of recipes-source."}
      refining: {alias: refining, slot_uri: pixlnd:recipes-source/refining, range: recipe-refining, required: true, inlined: true, description: "The refining field of recipes-source."}
      cooking: {alias: cooking, slot_uri: pixlnd:recipes-source/cooking, range: recipe-reference, required: true, inlined: true, description: "The cooking field of recipes-source."}
      alchemy: {alias: alchemy, slot_uri: pixlnd:recipes-source/alchemy, range: recipe-reference, required: true, inlined: true, description: "The alchemy field of recipes-source."}
      crafting-tabs-a: {alias: crafting-tabs-a, slot_uri: pixlnd:recipes-source/crafting-tabs-a, range: string, required: true, multivalued: true, description: "The crafting-tabs-a field of recipes-source."}
      recipe-sources: {alias: recipe-sources, slot_uri: pixlnd:recipes-source/sources, range: recipe-sources, required: true, inlined: true, description: "The recipe-sources field of recipes-source."}
      customization: {alias: customization, slot_uri: pixlnd:recipes-source/customization, range: recipe-customization, required: true, inlined: true, description: "The customization field of recipes-source."}
  recipe-armor:
    description: "Source representation of recipe-armor."
    attributes:
      unit: {alias: unit, slot_uri: pixlnd:recipe-armor/unit, range: string, required: true, description: "The unit field of recipe-armor."}
      common: {alias: common, slot_uri: pixlnd:recipe-armor/common, range: recipe-armor-common, required: true, inlined: true, description: "The common field of recipe-armor."}
      uncommon: {alias: uncommon, slot_uri: pixlnd:recipe-armor/uncommon, range: recipe-armor-tier, required: true, inlined: true, description: "The uncommon field of recipe-armor."}
      rare: {alias: rare, slot_uri: pixlnd:recipe-armor/rare, range: recipe-armor-tier, required: true, inlined: true, description: "The rare field of recipe-armor."}
      epic: {alias: epic, slot_uri: pixlnd:recipe-armor/epic, range: recipe-armor-tier, required: true, inlined: true, description: "The epic field of recipe-armor."}
      legendary: {alias: legendary, slot_uri: pixlnd:recipe-armor/legendary, range: recipe-armor-tier, required: true, inlined: true, description: "The legendary field of recipe-armor."}
      stations: {alias: stations, slot_uri: pixlnd:recipe-armor/stations, range: recipe-stations, required: true, inlined: true, description: "The stations field of recipe-armor."}
  recipe-armor-common:
    description: "Source representation of recipe-armor-common."
    attributes:
      chest: {alias: chest, slot_uri: pixlnd:recipe-armor-common/chest, range: recipe-base, required: true, inlined: true, description: "The chest field of recipe-armor-common."}
      shoulders: {alias: shoulders, slot_uri: pixlnd:recipe-armor-common/shoulders, range: recipe-base, required: true, inlined: true, description: "The shoulders field of recipe-armor-common."}
      gloves: {alias: gloves, slot_uri: pixlnd:recipe-armor-common/gloves, range: recipe-base, required: true, inlined: true, description: "The gloves field of recipe-armor-common."}
      boots: {alias: boots, slot_uri: pixlnd:recipe-armor-common/boots, range: recipe-base, required: true, inlined: true, description: "The boots field of recipe-armor-common."}
      gem: {alias: gem, slot_uri: pixlnd:recipe-armor-common/gem, range: recipe-null-marker, required: true, inlined: true, annotations: {source-literal-null: true}, description: "The gem field of recipe-armor-common."}
