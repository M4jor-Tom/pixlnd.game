enums:
  ability-runtime-kind:
    enum_uri: pixlnd:ability-runtime-kind
    permissible_values:
      dash: {}
      channel: {}
      burst: {}
      buff: {}
      heal: {}
      projectile: {}
  dash-direction:
    enum_uri: pixlnd:dash-direction
    permissible_values:
      target: {}
      forward: {}
      back: {}
