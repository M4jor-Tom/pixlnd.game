id: https://w3id.org/pixlnd/associations/realm-history
name: pixlnd-associations-realm-history
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- world
- entities
- relation-types
default_range: string
classes:
  realm-leader:
    class_uri: pixlnd:realm-leader
    see_also: &id004
    - ../domain/3_Classes.md#realm
    slots:
    - realm-leader-name
    - realm-leader-personality-trait
    - realm-leader-birth-year
    - realm-leader-hometown
    - realm-leader-tomb-location
    description: Logical named leader with numeric birth year and identified places; no calendar, epoch or historical wire encoding is implied.
  realm-capital:
    class_uri: pixlnd:realm-capital
    see_also: &id005
    - ../domain/3_Classes.md#realm
    slots:
    - realm-capital-name
    - realm-capital-founding-year
    - realm-capital-destruction-date
    description: Logical named capital with numeric founding year and optional destruction year; no calendar, epoch or historical wire encoding is implied.
  realm-knowledge:
    class_uri: pixlnd:realm-knowledge
    see_also: &id006
    - ../domain/3_Classes.md#save-data
    slots:
    - realm-knowledge-character
    - realm-knowledge-realm
    - realm-knowledge-world
    - realm-knowledge-percent
    description: Logical personal knowledge, not a current serialized save payload. World means saved-world
      identity, never seed. Reveal eligibility remains canonical prose.
    unique_keys:
      character-realm-world:
        unique_key_slots:
        - realm-knowledge-character
        - realm-knowledge-realm
        - realm-knowledge-world
slots:
  realm-leader-name:
    description: "Realm leader name property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-leader/name
    alias: name
    domain: realm-leader
    range: string
    required: false
    see_also: *id004
  realm-leader-personality-trait:
    description: "Realm leader personality trait property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-leader/personality-trait
    alias: personality-trait
    domain: realm-leader
    range: string
    required: false
    see_also: *id004
  realm-capital-name:
    description: "Realm capital name property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-capital/name
    alias: name
    domain: realm-capital
    range: string
    required: false
    see_also: *id005
  realm-knowledge-character:
    description: "Realm knowledge character property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-knowledge/character
    alias: character
    domain: realm-knowledge
    range: player-character
    required: true
    see_also: *id006
  realm-knowledge-realm:
    description: "Realm knowledge realm property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-knowledge/realm
    alias: realm
    domain: realm-knowledge
    range: realm
    required: true
    see_also: *id006
  realm-knowledge-world:
    description: "Realm knowledge world property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-knowledge/world
    alias: world
    domain: realm-knowledge
    range: world
    required: true
    see_also: *id006
  realm-knowledge-percent:
    description: "Realm knowledge percent property; interpreted under its owning definition."
    slot_uri: pixlnd:realm-knowledge/percent
    alias: percent
    domain: realm-knowledge
    range: float
    required: true
    see_also: *id006
    minimum_value: 0
    maximum_value: 100
  realm-leader-birth-year:
    alias: birth-year
    slot_uri: pixlnd:realm-leader/birth-year
    domain: realm-leader
    range: integer
    description: "Numeric birth year; no epoch, calendar, bounds, default or derived stored age is selected."
    see_also: [../domain/3_Classes.md#realm]
  realm-leader-hometown:
    alias: hometown
    slot_uri: pixlnd:realm-leader/hometown
    domain: realm-leader
    range: settlement
    description: "Identified hometown settlement, not copied display-name text."
    see_also: [../domain/3_Classes.md#realm]
  realm-leader-tomb-location:
    alias: tomb-location
    slot_uri: pixlnd:realm-leader/tomb-location
    domain: realm-leader
    range: poi
    description: "Identified tomb place, not a POI catalog type, active settlement or guessed coordinates; historical geometry and generated availability remain unqualified."
    see_also: [../domain/3_Classes.md#realm]
  realm-capital-founding-year:
    alias: founding-year
    slot_uri: pixlnd:realm-capital/founding-year
    domain: realm-capital
    range: integer
    description: "Numeric founding year with no invented epoch, calendar, bounds or default."
    see_also: [../domain/3_Classes.md#realm]
  realm-capital-destruction-date:
    alias: destruction-date
    slot_uri: pixlnd:realm-capital/destruction-date
    domain: realm-capital
    range: integer
    required: false
    description: "Optional numeric destruction year; no calendar, epoch, bounds, default or chronology is selected."
    see_also: [../domain/3_Classes.md#realm]

