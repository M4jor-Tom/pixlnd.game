id: https://w3id.org/pixlnd/catalog-meta
name: pixlnd-catalog-meta
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- meta
default_range: string
classes:
  rulesets-source:
    description: Whole source rulesets document; named bundles and flag maps are losslessly bound entries, not model slots.
    class_uri: pixlnd:rulesets-source
    annotations: {source-map-entries: entries}
    see_also: [../instances/rulesets.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:rulesets-source/schema, range: string, required: true, equals_string: ruleset, description: Source schema marker.}
      controls-note: {alias: _controls, slot_uri: pixlnd:rulesets-source/controls-note, range: string, required: true, description: Original controls qualification.}
      documentation: {alias: _doc, slot_uri: pixlnd:rulesets-source/doc, range: string, required: true, description: Original ruleset source note.}
      entries: {alias: entries, slot_uri: pixlnd:rulesets-source/entries, range: ruleset-source-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original named ruleset bundles.}
  ruleset-source-entry:
    description: Key/value binding for one original ruleset bundle.
    class_uri: pixlnd:ruleset-source-entry
    see_also: [../instances/rulesets.json]
    attributes:
      key: {alias: key, slot_uri: pixlnd:ruleset-source-entry/key, range: string, key: true, required: true, description: Original ruleset map key.}
      value: {alias: value, slot_uri: pixlnd:ruleset-source-entry/value, range: ruleset-source-row, inlined: true, required: true, description: Original ruleset bundle value.}
  ruleset-source-row:
    description: Complete source ruleset bundle without interpreted availability defaults.
    class_uri: pixlnd:ruleset-source-row
    annotations: {source-map-paths: flags}
    see_also: [../instances/rulesets.json]
    attributes:
      name: {alias: name, slot_uri: pixlnd:ruleset-source-row/name, range: string, required: true, description: Original bundle name.}
      versions: {alias: versions, slot_uri: pixlnd:ruleset-source-row/versions, range: string, multivalued: true, required: true, description: Original version labels.}
      progression: {alias: progression, slot_uri: pixlnd:ruleset-source-row/progression, range: string, required: true, description: Original progression label.}
      default: {alias: default, slot_uri: pixlnd:ruleset-source-row/default, range: boolean, description: Original default marker.}
      flags: {alias: flags, slot_uri: pixlnd:ruleset-source-row/flags, range: ruleset-source-flag-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original heterogeneous flag map.}
      rule-note: {alias: _rule, slot_uri: pixlnd:ruleset-source-row/rule-note, range: string, description: Original rule qualification.}
      note: {alias: _note, slot_uri: pixlnd:ruleset-source-row/note, range: string, description: Original source note.}
  ruleset-source-flag-entry:
    description: Original heterogeneous ruleset flag value keyed by its unchanged literal name.
    class_uri: pixlnd:ruleset-source-flag-entry
    see_also: [../instances/rulesets.json]
    attributes:
      key: {alias: key, slot_uri: pixlnd:ruleset-source-flag-entry/key, range: string, key: true, required: true, description: Original flag key.}
      value:
        alias: value
        slot_uri: pixlnd:ruleset-source-flag-entry/value
        required: true
        any_of:
        - {range: boolean}
        - {range: integer}
        - {range: string}
        - {range: string, multivalued: true}
        description: Original Boolean, integer, string or ordered string-list flag value.
  controller-profiles-source:
    description: Whole source controller-profile document, retaining profile IDs as bound keys.
    class_uri: pixlnd:controller-profiles-source
    annotations: {source-map-entries: entries}
    see_also: [../instances/controller-profiles.json]
    attributes:
      entries: {alias: entries, slot_uri: pixlnd:controller-profiles-source/entries, range: controller-profile-source-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original named profile map.}
  controller-profile-source-entry:
    description: Key/value binding for one source controller profile.
    class_uri: pixlnd:controller-profile-source-entry
    see_also: [../instances/controller-profiles.json]
    attributes:
      key: {alias: key, slot_uri: pixlnd:controller-profile-source-entry/key, range: string, key: true, required: true, description: Original profile key.}
      value: {alias: value, slot_uri: pixlnd:controller-profile-source-entry/value, range: android-profile-source-row, inlined: true, required: true, description: Original Android profile parameters and action references.}
  android-profile-source-row:
    description: Current Android source profile values, reusing the Android-only parameter refinements without adding a body ID.
    class_uri: pixlnd:android-profile-source-row
    mixins: [android-profile-parameters]
    see_also: [../instances/controller-profiles.json, ../domain/controller-profiles.md#android]
    attributes:
      actions: {alias: actions, slot_uri: pixlnd:android-profile-source-row/actions, range: ControlActionId, multivalued: true, required: true, description: Original selected canonical action identifiers from the closed canonical vocabulary.}
  keybinds-source:
    description: Whole keyboard/mouse adapter document; dynamic profile IDs are reversible local entries.
    class_uri: pixlnd:keybinds-source
    annotations: {source-map-entries: entries}
    see_also: [../instances/keybinds.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:keybinds-source/schema, range: string, required: true, equals_string: input-binding, description: Source schema marker.}
      documentation: {alias: _doc, slot_uri: pixlnd:keybinds-source/doc, range: string, required: true, description: Original adapter note.}
      controls-note: {alias: _controls, slot_uri: pixlnd:keybinds-source/controls-note, range: string, required: true, description: Original canonical controls reference.}
      profile-note: {alias: _profile, slot_uri: pixlnd:keybinds-source/profile-note, range: string, required: true, description: Original profile reference.}
      entries: {alias: entries, slot_uri: pixlnd:keybinds-source/entries, range: keybinds-source-profile-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original adapter profile map.}
  keybinds-source-profile-entry:
    description: Key/value binding for one original keybind profile.
    class_uri: pixlnd:keybinds-source-profile-entry
    see_also: [../instances/keybinds.json]
    attributes:
      key: {alias: key, slot_uri: pixlnd:keybinds-source-profile-entry/key, range: string, key: true, required: true, description: Original profile key.}
      value: {alias: value, slot_uri: pixlnd:keybinds-source-profile-entry/value, range: keybinds-source-profile, inlined: true, required: true, description: Original profile adapter map.}
  keybinds-source-profile:
    description: Complete source keyboard/mouse adapter rows including metadata and literal bindings.
    class_uri: pixlnd:keybinds-source-profile
    annotations: {source-map-entries: entries}
    see_also: [../instances/keybinds.json]
    attributes:
      documentation: {alias: _doc, slot_uri: pixlnd:keybinds-source-profile/doc, range: string, required: true, description: Original adapter-profile note.}
      entries: {alias: entries, slot_uri: pixlnd:keybinds-source-profile/entries, range: keybinds-source-binding-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original physical binding-key map.}
  keybinds-source-binding-entry:
    description: Original literal adapter binding name/value pair.
    class_uri: pixlnd:keybinds-source-binding-entry
    see_also: [../instances/keybinds.json]
    attributes:
      key: {alias: key, slot_uri: pixlnd:keybinds-source-binding-entry/key, range: string, key: true, required: true, description: Original binding key.}
      value: {alias: value, slot_uri: pixlnd:keybinds-source-binding-entry/value, range: string, required: true, description: Original physical binding label.}
  ui-source:
    description: Complete original UI source document, not a selected presentation projection or runtime policy.
    class_uri: pixlnd:ui-source
    see_also: [../instances/ui.json, ../domain/controls.md]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:ui-source/schema, range: string, required: true, equals_string: hud-element, description: Original source marker.}
      controls-note: {alias: _controls, slot_uri: pixlnd:ui-source/controls-note, range: string, required: true, description: Original controls reference.}
      profiles-note: {alias: _profiles, slot_uri: pixlnd:ui-source/profiles-note, range: string, required: true, description: Original profiles reference.}
      hud: {alias: hud, slot_uri: pixlnd:ui-source/hud, range: ui-source-hud-row, multivalued: true, inlined: true, required: true, description: Full keyed HUD source rows.}
      screens: {alias: screens, slot_uri: pixlnd:ui-source/screens, range: ui-source-screen-row, multivalued: true, inlined: true, required: true, description: Full keyed screen source rows.}
      options: {alias: options, slot_uri: pixlnd:ui-source/options, range: ui-source-options, inlined: true, required: true, description: Full option payloads and the unchanged missing-options list.}
      camera: {alias: camera, slot_uri: pixlnd:ui-source/camera, range: ui-source-camera, inlined: true, required: true, description: Complete camera presentation text.}
  ui-source-options:
    description: Fixed missing-options list plus keyed option objects, preserving their distinct source forms.
    class_uri: pixlnd:ui-source-options
    annotations: {source-map-entries: entries}
    see_also: [../instances/ui.json#options]
    attributes:
      missing: {alias: missing, slot_uri: pixlnd:ui-source-options/missing, range: string, multivalued: true, required: true, description: Original missing-options string list.}
      entries: {alias: entries, slot_uri: pixlnd:ui-source-options/entries, range: ui-source-option-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original keyed option objects other than the fixed missing list.}
  ui-source-hud-row:
    description: Full HUD source row; container key is not duplicated as a body identifier.
    class_uri: pixlnd:ui-source-hud-row
    see_also: [../instances/ui.json#hud]
    attributes:
      key: {alias: key, slot_uri: pixlnd:ui-source-hud-row/key, range: string, key: true, required: true, description: Original HUD map key.}
      pos: {alias: pos, slot_uri: pixlnd:ui-source-hud-row/pos, range: string, description: Original placement label.}
      shows:
        alias: shows
        slot_uri: pixlnd:ui-source-hud-row/shows
        any_of: [{range: string}, {range: string, multivalued: true}]
        description: Original scalar or ordered-list presentation contents.
      desc: {alias: desc, slot_uri: pixlnd:ui-source-hud-row/desc, range: string, description: Original descriptive text.}
      default: {alias: default, slot_uri: pixlnd:ui-source-hud-row/default, range: string, description: Original textual default.}
      versions: {alias: versions, slot_uri: pixlnd:ui-source-hud-row/versions, range: string, multivalued: true, description: Original version labels.}
      controls: {alias: _controls, slot_uri: pixlnd:ui-source-hud-row/controls, range: string, multivalued: true, description: Original control-reference strings.}
      design: {alias: design, slot_uri: pixlnd:ui-source-hud-row/design, range: string, description: Original design note.}
  ui-source-screen-row:
    description: Full screen source row with literal contextual lists and no copied map-key identity.
    class_uri: pixlnd:ui-source-screen-row
    see_also: [../instances/ui.json#screens]
    attributes:
      key: {alias: key, slot_uri: pixlnd:ui-source-screen-row/key, range: string, key: true, required: true, description: Original screen map key.}
      controls: {alias: _controls, slot_uri: pixlnd:ui-source-screen-row/controls, range: string, multivalued: true, description: Original control-reference strings.}
      desc: {alias: desc, slot_uri: pixlnd:ui-source-screen-row/desc, range: string, description: Original descriptive text.}
      versions: {alias: versions, slot_uri: pixlnd:ui-source-screen-row/versions, range: string, multivalued: true, description: Original version labels.}
      shows:
        alias: shows
        slot_uri: pixlnd:ui-source-screen-row/shows
        any_of: [{range: string}, {range: string, multivalued: true}]
        description: Original scalar or ordered-list presentation contents.
      extras: {alias: extras, slot_uri: pixlnd:ui-source-screen-row/extras, range: string, multivalued: true, description: Original additional presentation labels.}
      tabs:
        alias: tabs
        slot_uri: pixlnd:ui-source-screen-row/tabs
        any_of: [{range: string, multivalued: true}, {range: ui-source-context-lists, inlined: true}]
        description: Original string-list or A/S contextual tab groups.
      stats: {alias: stats, slot_uri: pixlnd:ui-source-screen-row/stats, range: ui-source-context-lists, inlined: true, description: Original contextual statistics lists.}
      fields: {alias: fields, slot_uri: pixlnd:ui-source-screen-row/fields, range: ui-source-context-lists, inlined: true, description: Original contextual field lists.}
  ui-source-context-lists:
    description: Literal A/S string-list object retained in its source context.
    class_uri: pixlnd:ui-source-context-lists
    see_also: [../instances/ui.json#screens]
    attributes:
      alpha: {alias: A, slot_uri: pixlnd:ui-source-context-lists/A, range: string, multivalued: true, description: Original A list.}
      steam: {alias: S, slot_uri: pixlnd:ui-source-context-lists/S, range: string, multivalued: true, description: Original S list.}
  ui-source-option-entry:
    description: Key/value binding for one ordinary keyed UI option object.
    class_uri: pixlnd:ui-source-option-entry
    see_also: [../instances/ui.json#options]
    attributes:
      key: {alias: key, slot_uri: pixlnd:ui-source-option-entry/key, range: string, key: true, required: true, description: Original option key.}
      value: {alias: value, slot_uri: pixlnd:ui-source-option-entry/value, range: ui-source-option-row, inlined: true, required: true, description: Original ordinary option body; the missing list is a fixed sibling field.}
  ui-source-option-row:
    description: Complete keyed UI option body with its original heterogeneous descriptive fields.
    class_uri: pixlnd:ui-source-option-row
    see_also: [../instances/ui.json#options]
    attributes:
      default: {alias: default, slot_uri: pixlnd:ui-source-option-row/default, range: integer, description: Original numeric option default.}
      cfg: {alias: cfg, slot_uri: pixlnd:ui-source-option-row/cfg, range: string, description: Original configuration text.}
      since: {alias: since, slot_uri: pixlnd:ui-source-option-row/since, range: string, description: Original release/date string without normalization.}
      note: {alias: note, slot_uri: pixlnd:ui-source-option-row/note, range: string, description: Original note.}
      versions: {alias: versions, slot_uri: pixlnd:ui-source-option-row/versions, range: string, multivalued: true, description: Original qualified version labels.}
  ui-source-camera:
    description: Complete camera source strings; map text is retained without selecting map behavior.
    class_uri: pixlnd:ui-source-camera
    see_also: [../instances/ui.json#camera, ../domain/controls.md]
    attributes:
      mode: {alias: mode, slot_uri: pixlnd:ui-source-camera/mode, range: string, required: true, description: Original camera-mode text.}
      aim: {alias: aim, slot_uri: pixlnd:ui-source-camera/aim, range: string, required: true, description: Original aim text.}
      map: {alias: map, slot_uri: pixlnd:ui-source-camera/map, range: string, required: true, description: Original map text.}
  audio-source:
    description: Whole audio source document including historical notes, tracks, music rules, IDs and ambient groups.
    class_uri: pixlnd:audio-source
    annotations: {source-map-paths: tracks}
    see_also: [../instances/audio.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:audio-source/schema, range: string, required: true, equals_string: audio, description: Original schema marker.}
      composer: {alias: composer, slot_uri: pixlnd:audio-source/composer, range: string, required: true, description: Original composer note.}
      tracks: {alias: tracks, slot_uri: pixlnd:audio-source/tracks, range: audio-source-track-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original track map and gap note.}
      music-rules: {alias: music-rules, slot_uri: pixlnd:audio-source/music-rules, range: audio-source-music-rules, inlined: true, required: true, description: Original music rules.}
      sfx-alpha-ids: {alias: sfx-alpha-ids, slot_uri: pixlnd:audio-source/sfx-alpha-ids, range: string, multivalued: true, required: true, description: Original ordered alpha sound ID and note list.}
      voices: {alias: voices, slot_uri: pixlnd:audio-source/voices, range: string, required: true, description: Original voice note.}
      ambient: {alias: ambient, slot_uri: pixlnd:audio-source/ambient, range: audio-source-ambient, inlined: true, required: true, description: Original version-keyed ambient lists.}
  audio-source-track-entry:
    description: Key/value binding for a source music track or the literal track-gap note.
    class_uri: pixlnd:audio-source-track-entry
    see_also: [../instances/audio.json#tracks]
    attributes:
      key: {alias: key, slot_uri: pixlnd:audio-source-track-entry/key, range: string, key: true, required: true, description: Original track key.}
      value:
        alias: value
        slot_uri: pixlnd:audio-source-track-entry/value
        any_of: [{range: audio-source-track-row, inlined: true}, {range: string}]
        annotations: {source-map-union-range: audio-source-track-row}
        required: true
        description: Original track fields or literal gap note.
  audio-source-track-row:
    description: Optional historical track metadata as recorded; no identity, availability or provenance is inferred.
    class_uri: pixlnd:audio-source-track-row
    see_also: [../instances/audio.json#tracks]
    attributes:
      date: {alias: date, slot_uri: pixlnd:audio-source-track-row/date, range: string, description: Original date label.}
      role: {alias: role, slot_uri: pixlnd:audio-source-track-row/role, range: string, description: Original role note.}
      length: {alias: length, slot_uri: pixlnd:audio-source-track-row/length, range: string, description: Original duration text.}
      faction: {alias: faction, slot_uri: pixlnd:audio-source-track-row/faction, range: string, description: Original faction label.}
  audio-source-music-rules:
    description: Original music-option and backend text without runtime selection.
    class_uri: pixlnd:audio-source-music-rules
    see_also: [../instances/audio.json#music-rules]
    attributes:
      loop-option: {alias: loop-option, slot_uri: pixlnd:audio-source-music-rules/loop-option, range: string, required: true, description: Original loop option text.}
      volume-sliders: {alias: volume-sliders, slot_uri: pixlnd:audio-source-music-rules/volume-sliders, range: string, required: true, description: Original volume text.}
      backend: {alias: backend, slot_uri: pixlnd:audio-source-music-rules/backend, range: string, required: true, description: Original backend qualification.}
  audio-source-ambient:
    description: Original source-tagged ambient descriptions, not availability claims.
    class_uri: pixlnd:audio-source-ambient
    see_also: [../instances/audio.json#ambient]
    attributes:
      omega: {alias: Ω, slot_uri: pixlnd:audio-source-ambient/omega, range: string, multivalued: true, description: Original Omega list.}
      steam: {alias: S, slot_uri: pixlnd:audio-source-ambient/S, range: string, multivalued: true, description: Original Steam list.}
  slash-commands-source:
    description: Whole slash-command input retaining literal command keys and modded-server context.
    class_uri: pixlnd:slash-commands-source
    annotations: {source-map-entries: entries}
    see_also: [../instances/slash-commands.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:slash-commands-source/schema, range: string, required: true, equals_string: slash-command, description: Original schema marker.}
      chat-rules: {alias: chat-rules, slot_uri: pixlnd:slash-commands-source/chat-rules, range: slash-command-chat-rules, inlined: true, required: true, description: Original chat rules.}
      entries: {alias: entries, slot_uri: pixlnd:slash-commands-source/entries, range: slash-command-source-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original literal command-key map.}
  slash-command-source-entry:
    description: Key/value binding for one literal command key or server-command collection.
    class_uri: pixlnd:slash-command-source-entry
    see_also: [../instances/slash-commands.json]
    attributes:
      key: {alias: key, slot_uri: pixlnd:slash-command-source-entry/key, range: string, key: true, required: true, description: Original command key.}
      value:
        alias: value
        slot_uri: pixlnd:slash-command-source-entry/value
        any_of: [{range: slash-command-source-row, inlined: true}, {range: string, multivalued: true}]
        annotations: {source-map-union-range: slash-command-source-row}
        required: true
        description: Original command row or ordered server-command list.
  slash-command-source-row:
    description: Original descriptive command row; command keys remain unparsed source strings.
    class_uri: pixlnd:slash-command-source-row
    see_also: [../instances/slash-commands.json]
    attributes:
      desc: {alias: desc, slot_uri: pixlnd:slash-command-source-row/desc, range: string, required: true, description: Original command description.}
      versions: {alias: versions, slot_uri: pixlnd:slash-command-source-row/versions, range: string, multivalued: true, required: true, description: Original qualified source-version strings.}
  slash-command-chat-rules:
    description: Original chat-rule fields without inferred command or gameplay availability.
    class_uri: pixlnd:slash-command-chat-rules
    see_also: [../instances/slash-commands.json#chat-rules]
    attributes:
      controls: {alias: _controls, slot_uri: pixlnd:slash-command-chat-rules/controls, range: string, multivalued: true, required: true, description: Original control reference.}
      charset: {alias: charset, slot_uri: pixlnd:slash-command-chat-rules/charset, range: string, required: true, description: Original charset text.}
      name-length: {alias: name-length, slot_uri: pixlnd:slash-command-chat-rules/name-length, range: string, required: true, description: Original name-length text.}
  versions-source:
    description: Whole historical timeline, delta and reception source document without date normalization.
    class_uri: pixlnd:versions-source
    annotations: {source-map-paths: reception}
    see_also: [../instances/versions.json]
    attributes:
      schema-tag: {alias: '$schema', slot_uri: pixlnd:versions-source/schema, range: string, required: true, equals_string: version, description: Original schema marker.}
      timeline: {alias: timeline, slot_uri: pixlnd:versions-source/timeline, range: version-timeline-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original ordered timeline.}
      alpha-to-steam-delta: {alias: alpha-to-steam-delta, slot_uri: pixlnd:versions-source/alpha-to-steam-delta, range: version-delta, inlined: true, required: true, description: Original alpha-to-Steam delta.}
      reception: {alias: reception, slot_uri: pixlnd:versions-source/reception, range: version-reception-entry, multivalued: true, inlined: true, inlined_as_list: true, required: true, description: Original reception and fan-fix sections.}
  version-timeline-entry:
    description: Original historical timeline record; date and qualified version remain source strings.
    class_uri: pixlnd:version-timeline-entry
    see_also: [../instances/versions.json#timeline]
    attributes:
      date: {alias: date, slot_uri: pixlnd:version-timeline-entry/date, range: string, required: true, description: Original date or date-range string without normalization.}
      version-label: {alias: v, slot_uri: pixlnd:version-timeline-entry/v, range: string, required: true, description: Original version label including qualifications.}
      features: {alias: features, slot_uri: pixlnd:version-timeline-entry/features, range: string, multivalued: true, required: true, description: Original ordered feature and source-note strings.}
  version-delta:
    description: Original alpha-to-Steam removal and addition lists.
    class_uri: pixlnd:version-delta
    see_also: [../instances/versions.json#alpha-to-steam-delta]
    attributes:
      removed: {alias: removed, slot_uri: pixlnd:version-delta/removed, range: string, multivalued: true, required: true, description: Original removal list.}
      added: {alias: added, slot_uri: pixlnd:version-delta/added, range: string, multivalued: true, required: true, description: Original addition list.}
  version-reception-entry:
    description: Key/value binding for a reception section or the literal fan-fix list.
    class_uri: pixlnd:version-reception-entry
    see_also: [../instances/versions.json#reception]
    attributes:
      key: {alias: key, slot_uri: pixlnd:version-reception-entry/key, range: string, key: true, required: true, description: Original reception key.}
      value:
        alias: value
        slot_uri: pixlnd:version-reception-entry/value
        any_of: [{range: version-reception, inlined: true}, {range: string, multivalued: true}]
        annotations: {source-map-union-range: version-reception}
        required: true
        description: Original reception record or fan-fix list.
  version-reception:
    description: Original reception text, scores and lists; rating text is not parsed or normalized.
    class_uri: pixlnd:version-reception
    annotations: {source-map-paths: scores}
    see_also: [../instances/versions.json#reception]
    attributes:
      scores: {alias: scores, slot_uri: pixlnd:version-reception/scores, range: version-score-entry, multivalued: true, inlined: true, inlined_as_list: true, description: Original source score map.}
