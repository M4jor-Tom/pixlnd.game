slots:
  source-notes:
    alias: notes
    slot_uri: pixlnd:source/notes
    exactly_one_of:
    - range: string
      multivalued: true
    description: Literal source qualifications; no reference normalization or inferred availability.
    see_also: [../domain/5_Constraints.md]
  source-entry-key:
    alias: key
    slot_uri: pixlnd:source-entry/key
    range: string
    required: true
    key: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: Exact original catalog container key, local to its source; never a fabricated body identifier.
    see_also: [../domain/0_Conventions.md, ../domain/5_Constraints.md]
  source-versions:
    alias: versions
    slot_uri: pixlnd:source/versions
    range: SourceVersion
    required: true
    multivalued: true
    minimum_cardinality: 1
    description: Explicit confirmed source annotations, not hybrid availability.
    see_also: [../domain/0_Conventions.md]
enums:
  SourceHands:
    enum_uri: pixlnd:SourceHands
    description: Literal weapon-source handedness, separate from logical loadout alternatives.
    see_also: [../instances/weapon-types.json]
    permissible_values:
      1h: {description: One-handed source weapon.}
      2h: {description: Two-handed source weapon.}
      offhand: {description: Off-hand source weapon.}
      1h dual (need two): {description: Source bracelet qualification.}
  SourceStatusKind:
    enum_uri: pixlnd:SourceStatusKind
    description: Literal source effect categories and scope qualifications.
    see_also: [../instances/status-effects.json]
    permissible_values:
      buff: {description: Beneficial effect.}
      debuff: {description: Harmful effect.}
      displacement: {description: Displacing effect.}
      debuff (NPC): {description: NPC-scoped source effect.}
      debuff (land-wide): {description: Land-scoped source effect.}
      debuff (settlement): {description: Settlement-scoped source effect.}
      buff (land-wide): {description: Land-scoped source buff.}
  FactionAlignment:
    enum_uri: pixlnd:FactionAlignment
    description: Source faction alignment categories, not creature hostility or attack permission.
    see_also: [../instances/factions.json]
    permissible_values:
      good: {description: Good-aligned faction.}
      evil: {description: Evil-aligned faction.}
      hostile: {description: Hostile source group.}
      lore: {description: Lore-only faction description.}
  SourceVersion:
    enum_uri: pixlnd:SourceVersion
    description: Confirmed source tags; uncertainty-qualified source text is retained separately.
    see_also: [../domain/0_Conventions.md]
    permissible_values:
      A: {description: Alpha reference.}
      S: {description: Steam reference.}
      Ω: {description: Announced Omega reference.}
      X: {description: Cut or unused source content.}
