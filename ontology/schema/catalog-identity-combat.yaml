id: https://w3id.org/pixlnd/catalog-identity-combat
name: pixlnd-catalog-identity-combat
title: Identity and combat source representations
description: Complete source envelopes, distinct from logical identities and selected hybrid behavior.
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- identity
- combat
- catalog-properties
default_range: string
classes:
  races-source:
    class_uri: pixlnd:races-source
    description: Race catalog with creation metadata; entries carry original container keys, not global identities.
    see_also: [../instances/races.json, ../domain/5_Constraints.md]
    annotations:
      source-map-entries: entries
    attributes:
      schema-tag: {alias: '$schema', slot_uri: 'pixlnd:races-source/schema', range: string, required: true, equals_string: race, description: "Original $schema field of races-source; retains the source representation."}
      documentation: {alias: _doc, slot_uri: 'pixlnd:races-source/doc', range: string, required: true, description: "Original _doc field of races-source; retains the source representation."}
      creation: {alias: _creation, slot_uri: 'pixlnd:races-source/creation', range: race-creation, required: true, inlined: true, description: "Original _creation field of races-source; retains the source representation."}
      entries: {alias: entries, slot_uri: 'pixlnd:races-source/entries', range: race-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "Original entries field of races-source; retains the source representation."}
  race-source-entry:
    class_uri: pixlnd:race-source-entry
    description: Reversible representation of one original race container key and its unchanged body.
    see_also: [../domain/0_Conventions.md, ../instances/races.json]
    slots: [source-entry-key]
    attributes:
      value: {alias: value, slot_uri: 'pixlnd:race-source-entry/value', range: race-source-row, required: true, inlined: true, description: "Original value field of race-source-entry; retains the source representation."}
  race-source-row:
    class_uri: pixlnd:race-source-row
    description: Race source body without a fabricated identifier or inherited creation defaults.
    see_also: [../instances/races.json, ../domain/3_Classes.md#race]
    slots: [race-name, race-playable, race-size-class, race-hair, race-heads, source-versions]
    slot_usage:
      race-name: {required: true}
      race-hair: {required: true}
      race-heads: {required: true}
    attributes:
      alpha-entity-ids: {alias: alpha-entity-ids, slot_uri: 'pixlnd:race-source-row/alpha-entity-ids', range: race-source-ids, required: true, inlined: true, description: "Original alpha-entity-ids field of race-source-row; retains the source representation."}
      quirks: {alias: quirks, slot_uri: 'pixlnd:race-source-row/quirks', range: string, required: true, multivalued: true, description: "Original quirks field of race-source-row; retains the source representation."}
  race-source-ids:
    class_uri: pixlnd:race-source-ids
    description: Per-gender numeric source IDs; these do not replace stable race identity.
    see_also: [../instances/races.json]
    attributes:
      male: {alias: male, slot_uri: 'pixlnd:race-source-ids/male', range: integer, required: true, minimum_value: 0, description: "Original male field of race-source-ids; retains the source representation."}
      female: {alias: female, slot_uri: 'pixlnd:race-source-ids/female', range: integer, required: true, minimum_value: 0, description: "Original female field of race-source-ids; retains the source representation."}
  race-creation:
    class_uri: pixlnd:race-creation
    description: Literal character-creation metadata, retaining source-specific alternatives and uncertain palette text.
    see_also: [../instances/races.json#_creation, ../domain/3_Classes.md#player-character]
    attributes:
      genders: {alias: genders, slot_uri: 'pixlnd:race-creation/genders', range: gender, required: true, multivalued: true, description: "Original genders field of race-creation; retains the source representation."}
      choices: {alias: choices, slot_uri: 'pixlnd:race-creation/choices', range: string, required: true, multivalued: true, description: "Original choices field of race-creation; retains the source representation."}
      skin-color: {alias: skin-color, slot_uri: 'pixlnd:race-creation/skin-color', range: string, required: true, description: "Original skin-color field of race-creation; retains the source representation."}
      spec-at-creation: {alias: spec-at-creation, slot_uri: 'pixlnd:race-creation/spec-at-creation', range: boolean, required: true, description: "Original spec-at-creation field of race-creation; retains the source representation."}
      starting-kit: {alias: starting-kit, slot_uri: 'pixlnd:race-creation/starting-kit', range: source-version-text-lists, required: true, inlined: true, description: "Original starting-kit field of race-creation; retains the source representation."}
      spawn: {alias: spawn, slot_uri: 'pixlnd:race-creation/spawn', range: source-version-text, required: true, inlined: true, description: "Original spawn field of race-creation; retains the source representation."}
      alpha-world-flow: {alias: alpha-world-flow, slot_uri: 'pixlnd:race-creation/alpha-world-flow', range: string, required: true, multivalued: true, description: "Original alpha-world-flow field of race-creation; retains the source representation."}
  source-version-text:
    class_uri: pixlnd:source-version-text
    description: Explicit Alpha and Steam description fields, not inferred provenance or selected hybrid rules.
    see_also: [../domain/5_Constraints.md]
    attributes:
      alpha: {alias: A, slot_uri: 'pixlnd:source-version-text/alpha', range: string, required: true, description: "Original A field of source-version-text; retains the source representation."}
      steam: {alias: S, slot_uri: 'pixlnd:source-version-text/steam', range: string, required: true, description: "Original S field of source-version-text; retains the source representation."}
  source-version-text-lists:
    class_uri: pixlnd:source-version-text-lists
    description: Explicit Alpha and Steam lists, preserving literal source entries.
    see_also: [../domain/5_Constraints.md]
    attributes:
      alpha: {alias: A, slot_uri: 'pixlnd:source-version-text-lists/alpha', range: string, required: true, multivalued: true, description: "Original A field of source-version-text-lists; retains the source representation."}
      steam: {alias: S, slot_uri: 'pixlnd:source-version-text-lists/steam', range: string, required: true, multivalued: true, description: "Original S field of source-version-text-lists; retains the source representation."}
  classes-source:
    class_uri: pixlnd:classes-source
    description: Class catalog and its separate shared and unshipped reference records.
    see_also: [../instances/classes.json]
    annotations: {source-map-entries: entries}
    attributes:
      schema-tag: {alias: '$schema', slot_uri: 'pixlnd:classes-source/schema', range: string, required: true, equals_string: character-class, description: "Original $schema field of classes-source; retains the source representation."}
      paladin: {alias: _paladin, slot_uri: 'pixlnd:classes-source/paladin', range: class-reference, required: true, inlined: true, description: "Original _paladin field of classes-source; retains the source representation."}
      shared: {alias: _shared, slot_uri: 'pixlnd:classes-source/shared', range: class-shared, required: true, inlined: true, description: "Original _shared field of classes-source; retains the source representation."}
      entries: {alias: entries, slot_uri: 'pixlnd:classes-source/entries', range: class-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "Original entries field of classes-source; retains the source representation."}
  class-source-entry:
    class_uri: pixlnd:class-source-entry
    description: Original class key and complete body.
    see_also: [../instances/classes.json]
    slots: [source-entry-key]
    attributes:
      value: {alias: value, slot_uri: 'pixlnd:class-source-entry/value', range: class-source-row, required: true, inlined: true, description: "Original value field of class-source-entry; retains the source representation."}
  class-source-row:
    class_uri: pixlnd:class-source-row
    description: Source class body; shared configuration is not a fifth class.
    see_also: [../instances/classes.json, ../domain/3_Classes.md#character-class]
    slots: [character-class-name, character-class-id-number, character-class-special-attack-mode, character-class-hp-mult, has-specialization, uses-weapon, wears-material, source-versions, source-notes]
    attributes:
      weapon-loadouts: {alias: weapon-loadouts, slot_uri: 'pixlnd:class-source-row/weapon-loadouts', range: string, required: true, multivalued: true, description: "Original weapon-loadouts field of class-source-row; retains the source representation."}
      armor-weight: {alias: armor-weight, slot_uri: 'pixlnd:class-source-row/armor-weight', range: string, required: true, description: "Original armor-weight field of class-source-row; retains the source representation."}
      mp-generation: {alias: mp-generation, slot_uri: 'pixlnd:class-source-row/mp-generation', range: string, required: true, multivalued: true, description: "Original mp-generation field of class-source-row; retains the source representation."}
      hp-multiplier-alpha: {alias: hp-multiplier-alpha, slot_uri: 'pixlnd:class-source-row/hp-multiplier-alpha', range: double, required: true, description: "Original hp-multiplier-alpha field of class-source-row; retains the source representation."}
      alt-name: {alias: alt-name, slot_uri: 'pixlnd:class-source-row/alt-name', exactly_one_of: [{range: string}], description: "Original alt-name field of class-source-row; retains the source representation."}
      special-attack-cost-mp: {alias: special-attack-cost-mp, slot_uri: 'pixlnd:class-source-row/special-attack-cost-mp', exactly_one_of: [{range: double, minimum_value: 0, maximum_value: 100}], description: "Original special-attack-cost-mp field of class-source-row; retains the source representation."}
  class-reference:
    class_uri: pixlnd:class-reference
    description: Named unshipped class reference, not an enabled character class.
    see_also: [../instances/classes.json#_paladin]
    attributes:
      name: {alias: name, slot_uri: 'pixlnd:class-reference/name', range: string, required: true, description: "Original name field of class-reference; retains the source representation."}
      status: {alias: status, slot_uri: 'pixlnd:class-reference/status', range: string, required: true, description: "Original status field of class-reference; retains the source representation."}
  class-shared:
    class_uri: pixlnd:class-shared
    description: Source-qualified shared class descriptions.
    see_also: [../instances/classes.json#_shared]
    attributes:
      unarmed: {alias: unarmed, slot_uri: 'pixlnd:class-shared/unarmed', range: string, required: true, description: "Original unarmed field of class-shared; retains the source representation."}
      accessories: {alias: accessories, slot_uri: 'pixlnd:class-shared/accessories', range: string, required: true, description: "Original accessories field of class-shared; retains the source representation."}
      spec-change: {alias: spec-change, slot_uri: 'pixlnd:class-shared/spec-change', range: source-version-text, required: true, inlined: true, description: "Original spec-change field of class-shared; retains the source representation."}
  specializations-source:
    class_uri: pixlnd:specializations-source
    description: Complete specialization catalog, retaining version-specific kits.
    see_also: [../instances/specializations.json]
    annotations: {source-map-entries: entries}
    attributes:
      schema-tag: {alias: '$schema', slot_uri: 'pixlnd:specializations-source/schema', range: string, required: true, equals_string: specialization, description: "Original $schema field of specializations-source; retains the source representation."}
      documentation: {alias: _doc, slot_uri: 'pixlnd:specializations-source/doc', range: string, required: true, description: "Original _doc field of specializations-source; retains the source representation."}
      entries: {alias: entries, slot_uri: 'pixlnd:specializations-source/entries', range: specialization-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "Original entries field of specializations-source; retains the source representation."}
  specialization-source-entry:
    class_uri: pixlnd:specialization-source-entry
    description: Original specialization key and complete body.
    see_also: [../instances/specializations.json]
    slots: [source-entry-key]
    attributes:
      value: {alias: value, slot_uri: 'pixlnd:specialization-source-entry/value', range: specialization-source-row, required: true, inlined: true, description: "Original value field of specialization-source-entry; retains the source representation."}
  specialization-source-row:
    class_uri: pixlnd:specialization-source-row
    description: Source specialization without a fabricated body ID.
    see_also: [../instances/specializations.json, ../domain/3_Classes.md#specialization]
    slots: [specialization-name, specialization-class, specialization-index, source-versions, source-notes]
    attributes:
      tint: {alias: tint, slot_uri: 'pixlnd:specialization-source-row/tint', exactly_one_of: [{range: string}], description: "Original tint field of specialization-source-row; retains the source representation."}
      cuwo-name: {alias: cuwo-name, slot_uri: 'pixlnd:specialization-source-row/cuwo-name', exactly_one_of: [{range: string}], description: "Original cuwo-name field of specialization-source-row; retains the source representation."}
      passives: {alias: passives, slot_uri: 'pixlnd:specialization-source-row/passives', range: source-version-abilities, required: true, inlined: true, description: "Original passives field of specialization-source-row; retains the source representation."}
      kit: {alias: kit, slot_uri: 'pixlnd:specialization-source-row/kit', range: source-version-abilities, required: true, inlined: true, description: "Original kit field of specialization-source-row; retains the source representation."}
  source-version-abilities:
    class_uri: pixlnd:source-version-abilities
    description: Version-specific ability references, without implicit hybrid activation.
    see_also: [../instances/specializations.json]
    attributes:
      alpha: {alias: A, slot_uri: 'pixlnd:source-version-abilities/alpha', range: ability, required: true, multivalued: true, description: "Original A field of source-version-abilities; retains the source representation."}
      steam: {alias: S, slot_uri: 'pixlnd:source-version-abilities/steam', range: ability, required: true, multivalued: true, description: "Original S field of source-version-abilities; retains the source representation."}
  creatures-source:
    class_uri: pixlnd:creatures-source
    description: Species source catalog; logical mobs are separate entities.
    see_also: [../instances/creatures.json]
    annotations: {source-map-entries: entries}
    attributes:
      schema-tag: {alias: '$schema', slot_uri: 'pixlnd:creatures-source/schema', range: string, required: true, equals_string: creature, description: "Original $schema field of creatures-source; retains the source representation."}
      documentation: {alias: _doc, slot_uri: 'pixlnd:creatures-source/doc', range: string, required: true, description: "Original _doc field of creatures-source; retains the source representation."}
      playable-races-as-enemies: {alias: _playable-races-as-enemies, slot_uri: 'pixlnd:creatures-source/playable-races-as-enemies', range: source-note-record, required: true, inlined: true, description: "Original _playable-races-as-enemies field of creatures-source; retains the source representation."}
      entries: {alias: entries, slot_uri: 'pixlnd:creatures-source/entries', range: creature-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "Original entries field of creatures-source; retains the source representation."}
  creature-source-entry:
    class_uri: pixlnd:creature-source-entry
    description: Original species key and complete source body.
    see_also: [../instances/creatures.json]
    slots: [source-entry-key]
    attributes:
      value: {alias: value, slot_uri: 'pixlnd:creature-source-entry/value', range: creature-source-row, required: true, inlined: true, description: "Original value field of creature-source-entry; retains the source representation."}
  creature-source-row:
    class_uri: pixlnd:creature-source-row
    description: Qualified source codes and descriptions remain literal, separate from normalized logical enums and references.
    see_also: [../instances/creatures.json, ../domain/3_Classes.md#creature]
    slots: [creature-alpha-entity-id, creature-category, member-of-family, descriptive-member-of-family, tamed-by, source-notes]
    attributes:
      name: {alias: name, slot_uri: 'pixlnd:creature-source-row/name', range: string, required: true, description: "Original name field of creature-source-row; retains the source representation."}
      hostility: {alias: h, slot_uri: 'pixlnd:creature-source-row/hostility', exactly_one_of: [{range: string}], description: "Original h field of creature-source-row; retains the source representation."}
      lands: {alias: lands, slot_uri: 'pixlnd:creature-source-row/lands', exactly_one_of: [{range: string, multivalued: true}], description: "Original lands field of creature-source-row; retains the source representation."}
      role: {alias: role, slot_uri: 'pixlnd:creature-source-row/role', exactly_one_of: [{range: string}], description: "Original role field of creature-source-row; retains the source representation."}
      ride: {alias: ride, slot_uri: 'pixlnd:creature-source-row/ride', exactly_one_of: [{range: boolean}], description: "Original ride field of creature-source-row; retains the source representation."}
      boss: {alias: boss, slot_uri: 'pixlnd:creature-source-row/boss', exactly_one_of: [{range: boolean}], description: "Original boss field of creature-source-row; retains the source representation."}
      bossable: {alias: bossable, slot_uri: 'pixlnd:creature-source-row/bossable', exactly_one_of: [{range: boolean}], description: "Original bossable field of creature-source-row; retains the source representation."}
      breaks-terrain: {alias: breaks-terrain, slot_uri: 'pixlnd:creature-source-row/breaks-terrain', exactly_one_of: [{range: boolean}], description: "Original breaks-terrain field of creature-source-row; retains the source representation."}
      drinks-potions: {alias: drinks-potions, slot_uri: 'pixlnd:creature-source-row/drinks-potions', exactly_one_of: [{range: boolean}], description: "Original drinks-potions field of creature-source-row; retains the source representation."}
      lantern-at-night: {alias: lantern-at-night, slot_uri: 'pixlnd:creature-source-row/lantern-at-night', exactly_one_of: [{range: boolean}], description: "Original lantern-at-night field of creature-source-row; retains the source representation."}
      pet-types: {alias: pet-types, slot_uri: 'pixlnd:creature-source-row/pet-types', exactly_one_of: [{range: string, multivalued: true}], description: "Original pet-types field of creature-source-row; retains the source representation."}
      group: {alias: group, slot_uri: 'pixlnd:creature-source-row/group', exactly_one_of: [{range: integer, multivalued: true, minimum_cardinality: 2, maximum_cardinality: 2, minimum_value: 1}], description: "Original group field of creature-source-row; retains the source representation."}
      drops: {alias: drops, slot_uri: 'pixlnd:creature-source-row/drops', exactly_one_of: [{range: string, multivalued: true}], description: "Original drops field of creature-source-row; retains the source representation."}
      abilities: {alias: abilities, slot_uri: 'pixlnd:creature-source-row/abilities', exactly_one_of: [{range: string, multivalued: true}], description: "Original abilities field of creature-source-row; retains the source representation."}
      faction: {alias: faction, slot_uri: 'pixlnd:creature-source-row/faction', exactly_one_of: [{range: faction}], description: "Original faction field of creature-source-row; retains the source representation."}
      versions: {alias: v, slot_uri: 'pixlnd:creature-source-row/versions', range: SourceVersion, required: true, multivalued: true, minimum_cardinality: 1, description: "Original v field of creature-source-row; retains the source representation."}
  source-note-record:
    class_uri: pixlnd:source-note-record
    description: Metadata note object, not a content instance.
    see_also: [../domain/5_Constraints.md]
    attributes:
      note: {alias: note, slot_uri: 'pixlnd:source-note-record/note', range: string, required: true, description: "Original note field of source-note-record; retains the source representation."}
  creature-families-source:
    class_uri: pixlnd:creature-families-source
    description: Taxonomy families and two distinct roster configurations.
    see_also: [../instances/creature-families.json, ../domain/5_Constraints.md]
    annotations: {source-map-entries: entries}
    attributes:
      schema-tag: {alias: '$schema', slot_uri: 'pixlnd:creature-families-source/schema', range: string, required: true, equals_string: creature-family, description: "Original $schema field of creature-families-source; retains the source representation."}
      forest-dungeon-rosters: {alias: forest-dungeon-rosters, slot_uri: 'pixlnd:creature-families-source/forest-dungeon-rosters', range: forest-rosters, required: true, inlined: true, description: "Original forest-dungeon-rosters field of creature-families-source; retains the source representation."}
      landscape-rosters: {alias: landscape-rosters, slot_uri: 'pixlnd:creature-families-source/landscape-rosters', range: landscape-rosters, required: true, inlined: true, description: "Original landscape-rosters field of creature-families-source; retains the source representation."}
      entries: {alias: entries, slot_uri: 'pixlnd:creature-families-source/entries', range: family-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "Original entries field of creature-families-source; retains the source representation."}
  family-source-entry:
    class_uri: pixlnd:family-source-entry
    description: Original taxonomy key and complete body, without inferred historical provenance.
    see_also: [../instances/creature-families.json]
    slots: [source-entry-key]
    attributes:
      value: {alias: value, slot_uri: 'pixlnd:family-source-entry/value', range: family-source-row, required: true, inlined: true, description: "Original value field of family-source-entry; retains the source representation."}
  family-source-row:
    class_uri: pixlnd:family-source-row
    description: Descriptive memberships do not assign multiple primary balancing families.
    see_also: [../instances/creature-families.json, ../domain/3_Classes.md#creature-family]
    slots: [creature-family-members]
    attributes:
      traits: {alias: traits, slot_uri: 'pixlnd:family-source-row/traits', exactly_one_of: [{range: string, multivalued: true}], description: "Original traits field of family-source-row; retains the source representation."}
  forest-rosters:
    class_uri: pixlnd:forest-rosters
    description: Named source roster variants; labels are configuration keys, not creature identities.
    see_also: [../instances/creature-families.json#forest-dungeon-rosters]
    extra_slots:
      range_expression: {range: forest-roster, required: true, inlined: true}
  forest-roster:
    class_uri: pixlnd:forest-roster
    description: Literal race, creature and family tokens; beetle is retained without inventing a creature alias.
    see_also: [../instances/creature-families.json#forest-dungeon-rosters, ../domain/5_Constraints.md]
    attributes:
      members: {alias: members, slot_uri: 'pixlnd:forest-roster/members', range: string, required: true, multivalued: true, description: "Original members field of forest-roster; retains the source representation."}
      boss: {alias: boss, slot_uri: 'pixlnd:forest-roster/boss', range: string, required: true, description: "Original boss field of forest-roster; retains the source representation."}
  landscape-rosters:
    class_uri: pixlnd:landscape-rosters
    description: Literal source landscape or habitat labels to creature reference lists; key resolution is not native foreign-key validation.
    see_also: [../instances/creature-families.json#landscape-rosters, ../domain/5_Constraints.md]
    extra_slots:
      range_expression: {range: creature, required: true, multivalued: true}
  factions-source:
    class_uri: pixlnd:factions-source
    description: Faction catalog with separate procedural realm-name examples.
    see_also: [../instances/factions.json]
    annotations: {source-map-entries: entries}
    attributes:
      schema-tag: {alias: '$schema', slot_uri: 'pixlnd:factions-source/schema', range: string, required: true, equals_string: faction, description: "Original $schema field of factions-source; retains the source representation."}
      documentation: {alias: _doc, slot_uri: 'pixlnd:factions-source/doc', range: string, required: true, description: "Original _doc field of factions-source; retains the source representation."}
      realm-name-examples: {alias: realm-name-examples, slot_uri: 'pixlnd:factions-source/realm-name-examples', range: realm-name-examples, required: true, inlined: true, description: "Original realm-name-examples field of factions-source; retains the source representation."}
      entries: {alias: entries, slot_uri: 'pixlnd:factions-source/entries', range: faction-source-entry, required: true, multivalued: true, inlined: true, inlined_as_list: true, minimum_cardinality: 1, description: "Original entries field of factions-source; retains the source representation."}
  faction-source-entry:
    class_uri: pixlnd:faction-source-entry
    description: Original faction key and complete body.
    see_also: [../instances/factions.json]
    slots: [source-entry-key]
    attributes:
      value: {alias: value, slot_uri: 'pixlnd:faction-source-entry/value', range: faction-source-row, required: true, inlined: true, description: "Original value field of faction-source-entry; retains the source representation."}
  faction-source-row:
    class_uri: pixlnd:faction-source-row
    description: Faction source descriptions and literal member references.
    see_also: [../instances/factions.json, ../domain/3_Classes.md#faction]
    slots: [faction-name, source-versions]
    slot_usage:
      faction-name: {required: true}
    attributes:
      alignment: {alias: alignment, slot_uri: 'pixlnd:faction-source-row/alignment', range: FactionAlignment, required: true, description: "Original alignment field of faction-source-row; retains the source representation."}
