id: https://w3id.org/pixlnd/save-content/saved-special
name: pixlnd-save-content-saved-special
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
default_range: string
classes:
  saved-special:
    class_uri: pixlnd:saved-special
    see_also: &id004
    - ../domain/encounter-contracts.md#boss-specials-and-breakable-rubble
    slots:
    - saved-special-phase
    - saved-special-left
    - saved-special-recovery
    - saved-special-engaged
    - saved-special-target
    - saved-special-origin
    - saved-special-endpoint
    description: Current special snapshot. Origin/endpoint are empty while inactive or three coordinates
      while active; phase-dependent applicability and geometry remain linked checks.
slots:
  saved-special-phase:
    slot_uri: pixlnd:saved-special/phase
    alias: phase
    domain: saved-special
    range: special-phase
    required: true
    see_also: *id004
  saved-special-left:
    slot_uri: pixlnd:saved-special/left
    alias: left
    domain: saved-special
    range: double
    required: true
    see_also: *id004
    minimum_value: 0
  saved-special-recovery:
    slot_uri: pixlnd:saved-special/recovery
    alias: recovery
    domain: saved-special
    range: double
    required: true
    see_also: *id004
    minimum_value: 0
  saved-special-engaged:
    slot_uri: pixlnd:saved-special/engaged
    alias: engaged
    domain: saved-special
    range: boolean
    required: true
    see_also: *id004
  saved-special-target:
    slot_uri: pixlnd:saved-special/target
    alias: target
    domain: saved-special
    range: string
    required: true
    see_also: *id004
  saved-special-origin:
    slot_uri: pixlnd:saved-special/origin
    alias: origin
    domain: saved-special
    required: true
    see_also: *id004
    any_of:
    - range: double
      multivalued: true
      maximum_cardinality: 0
    - range: double
      multivalued: true
      minimum_cardinality: 3
      maximum_cardinality: 3
  saved-special-endpoint:
    slot_uri: pixlnd:saved-special/endpoint
    alias: endpoint
    domain: saved-special
    required: true
    see_also: *id004
    any_of:
    - range: double
      multivalued: true
      maximum_cardinality: 0
    - range: double
      multivalued: true
      minimum_cardinality: 3
      maximum_cardinality: 3
enums:
  special-phase:
    enum_uri: pixlnd:special-phase
    permissible_values:
      ready: {}
      cooldown: {}
      warning: {}
      charge: {}
