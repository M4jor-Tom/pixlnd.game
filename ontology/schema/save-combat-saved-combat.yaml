id: https://w3id.org/pixlnd/save-combat/saved-combat
name: pixlnd-save-combat-saved-combat
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- save-combat-threat-records
default_range: string
classes:
  saved-combat:
    class_uri: pixlnd:saved-combat
    see_also: &id001
    - ../domain/3_Classes.md#ai-behavior
    slots:
    - saved-combat-threat
    - saved-combat-order
    - saved-combat-provoked
    - saved-combat-next-order
    - saved-combat-current
    - saved-combat-taunt
    - saved-combat-taunt-left
    - saved-combat-returning
    description: Persistent incarnation threat, order, provocation and target state. Empty current and taunt strings
      mean no target.
slots:
  saved-combat-threat:
    slot_uri: pixlnd:saved-combat/threat
    alias: threat
    domain: saved-combat
    range: saved-threat
    required: true
    see_also: *id001
    multivalued: true
    inlined: true
    inlined_as_list: false
    description: Threat of the saved combat.
  saved-combat-order:
    slot_uri: pixlnd:saved-combat/order
    alias: order
    domain: saved-combat
    range: saved-order
    required: true
    see_also: *id001
    multivalued: true
    inlined: true
    inlined_as_list: false
    description: Order of the saved combat.
  saved-combat-provoked:
    slot_uri: pixlnd:saved-combat/provoked
    alias: provoked
    domain: saved-combat
    range: saved-provocation
    required: true
    see_also: *id001
    multivalued: true
    inlined: true
    inlined_as_list: false
    description: Provoked of the saved combat.
  saved-combat-next-order:
    slot_uri: pixlnd:saved-combat/next_order
    alias: next_order
    domain: saved-combat
    range: integer
    required: true
    see_also: *id001
    minimum_value: 0
    description: Next order of the saved combat.
    maximum_value: 9223372036854775295
  saved-combat-current:
    slot_uri: pixlnd:saved-combat/current
    alias: current
    domain: saved-combat
    range: string
    required: true
    see_also: *id001
    description: Current of the saved combat.
  saved-combat-taunt:
    slot_uri: pixlnd:saved-combat/taunt
    alias: taunt
    domain: saved-combat
    range: string
    required: true
    see_also: *id001
    description: Taunt of the saved combat.
  saved-combat-taunt-left:
    slot_uri: pixlnd:saved-combat/taunt_left
    alias: taunt_left
    domain: saved-combat
    range: double
    required: true
    see_also: *id001
    minimum_value: 0
    description: Taunt left of the saved combat.
  saved-combat-returning:
    slot_uri: pixlnd:saved-combat/returning
    alias: returning
    domain: saved-combat
    range: boolean
    required: true
    see_also: *id001
    description: Returning of the saved combat.
