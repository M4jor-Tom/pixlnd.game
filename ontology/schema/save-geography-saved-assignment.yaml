id: https://w3id.org/pixlnd/save-geography/saved-assignment
name: pixlnd-save-geography-saved-assignment
prefixes:
  pixlnd: https://w3id.org/pixlnd/
  linkml: https://w3id.org/linkml/
default_prefix: pixlnd
imports:
- linkml:types
- save-combat
default_range: string
classes:
  saved-assignment:
    class_uri: pixlnd:saved-assignment
    see_also: &id001
    - ../domain/encounter-contracts.md#geometry-and-occupancy
    slots:
    - saved-assignment-key
    - saved-assignment-pack
    - saved-assignment-special
    - saved-assignment-spirit
    - saved-assignment-home
    - saved-assignment-role
    - saved-assignment-tier
    - saved-assignment-boss
    - saved-assignment-seed
    description: Permanent site member assignment, distinct from a living incarnation; empty special and
      spirit strings mean no assigned effect.
slots:
  saved-assignment-key:
    slot_uri: pixlnd:saved-assignment/key
    alias: key
    domain: saved-assignment
    range: string
    required: true
    see_also: *id001
    description: Key of the saved assignment.
  saved-assignment-pack:
    slot_uri: pixlnd:saved-assignment/pack
    alias: pack
    domain: saved-assignment
    range: string
    required: true
    see_also: *id001
    description: Pack of the saved assignment.
  saved-assignment-special:
    slot_uri: pixlnd:saved-assignment/special
    alias: special
    domain: saved-assignment
    range: string
    required: true
    see_also: *id001
    description: Special of the saved assignment.
  saved-assignment-spirit:
    slot_uri: pixlnd:saved-assignment/spirit
    alias: spirit
    domain: saved-assignment
    range: string
    required: true
    see_also: *id001
    description: Spirit of the saved assignment.
  saved-assignment-home:
    slot_uri: pixlnd:saved-assignment/home
    alias: home
    domain: saved-assignment
    range: double
    required: true
    see_also: *id001
    multivalued: true
    minimum_cardinality: 3
    maximum_cardinality: 3
    description: Home of the saved assignment.
  saved-assignment-role:
    slot_uri: pixlnd:saved-assignment/role
    alias: role
    domain: saved-assignment
    range: saved-role
    required: true
    see_also: *id001
    description: Role of the saved assignment.
  saved-assignment-tier:
    slot_uri: pixlnd:saved-assignment/tier
    alias: tier
    domain: saved-assignment
    range: integer
    required: true
    see_also: *id001
    minimum_value: 0
    description: Tier of the saved assignment.
  saved-assignment-boss:
    slot_uri: pixlnd:saved-assignment/boss
    alias: boss
    domain: saved-assignment
    range: boolean
    required: true
    see_also: *id001
    description: Boss of the saved assignment.
  saved-assignment-seed:
    slot_uri: pixlnd:saved-assignment/seed
    alias: seed
    domain: saved-assignment
    range: integer
    required: true
    see_also: *id001
    minimum_value: 0
    description: Seed of the saved assignment.
