default_install_hook_types: [pre-commit]
# Short gates run at commit. CI runs the full manifest; the background launcher is opt-in.
# Host and CI run this same complete manual manifest synchronously.
default_stages: [manual]

repos:
  - repo: local
    hooks:
      - id: python-lint
        name: Python lint (ruff)
        entry: nix develop --no-update-lock-file -c ruff check --output-format concise
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit, manual]
      - id: ontology-schema-size
        name: LinkML schema modules stay within 150 lines
        entry: awk 'FNR == 151 { print FILENAME " exceeds 150 lines"; bad = 1 } END { exit bad }'
        language: system
        files: ^ontology/schema/.*\.yaml$
        stages: [pre-commit, manual]
      - id: ontology-mermaid
        name: Ontology Mermaid diagrams (LinkML)
        entry: nix develop --no-update-lock-file -c bash scripts/ontology_mermaid.sh
        language: system
        pass_filenames: false
        files: ^(ontology/schema/|tools/ontology/|docs/ontology/mermaid/|scripts/ontology_mermaid\.sh$)
        stages: [pre-commit, manual]
      - id: ontology-instances
        name: Bound, validated ontology instances for the game (LinkML)
        entry: nix develop --no-update-lock-file -c uv run --locked --project tools/ontology python scripts/ontology_bind.py
        language: system
        pass_filenames: false
        files: ^(ontology/schema/|ontology/instances/|game/generated/instances/|tools/ontology/|scripts/ontology_bind\.py$|tests/ontology_source_contracts\.py$)
        stages: [pre-commit, manual]
      - id: ontology-schema-tests
        name: LinkML schema and instance tests
        verbose: true
        entry: nix develop --no-update-lock-file -c bash scripts/ontology_tests.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: quality-runner
        name: Quality runner regressions
        verbose: true
        entry: nix develop --no-update-lock-file -c bash tests/test_checks.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: quality
        name: GDScript format and lint, GDScript/Python/Bash sizes and complexity, ontology and headless tests
        verbose: true
        # Enter the pinned toolchain even when git push runs outside nix develop.
        entry: nix develop --no-update-lock-file -c bash scripts/checks.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: gate-background
        name: Start the full quality gate in the background
        verbose: true
        entry: bash scripts/gate.sh start
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
      - id: gate-receipt
        name: Require a passed background quality gate for the pushed commit
        verbose: true
        entry: bash scripts/gate.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
